  `;

  if(canManage()){
    const [{data: trainings}, {data: matches}, {data: existingCallUps}] = await Promise.all([
      supabase.from('trainings').select('*').order('session_date', {ascending:false}).limit(20),
      supabase.from('matches').select('*').order('match_date', {ascending:false}).limit(20),
      supabase.from('call_ups').select('training_id,match_id'),
    ]);
    // Un entrenamiento o partido recién creado ya lanza su convocatoria
    // automáticamente; aquí solo se ofrecen los que aún no tienen una.
    const convocatedTrainingIds = new Set((existingCallUps||[]).map(c=>c.training_id).filter(Boolean));
    const convocatedMatchIds = new Set((existingCallUps||[]).map(c=>c.match_id).filter(Boolean));
    const availableTrainings = (trainings||[]).filter(t=>!convocatedTrainingIds.has(t.id));
    const availableMatches = (matches||[]).filter(m=>!convocatedMatchIds.has(m.id));
    // Este formulario solo tiene sentido si hay un entrenamiento o partido SIN convocatoria
    // (algo raro, ya que se lanza automático al crearlos) — si no hay ninguno pendiente, no
    // se muestra, para no confundir con selects vacíos que no dejan hacer nada.
    if(availableTrainings.length || availableMatches.length){
      $('#callup-form-wrap').innerHTML = `
        <div class="panel">
          <h3>Convocar manualmente</h3>
          <p class="muted">Todo entrenamiento o partido nuevo ya lanza su convocatoria automáticamente. Este formulario es solo para el caso raro de que alguno se haya quedado sin convocatoria.</p>
          <div class="row">
            <select id="cu-type">
              ${availableTrainings.length ? '<option value="entrenamiento">Entrenamiento</option>' : ''}
              ${availableMatches.length ? '<option value="partido">Partido</option>' : ''}
            </select>
            <select id="cu-training" style="${availableTrainings.length ? '' : 'display:none'}">${availableTrainings.map(t=>`<option value="${t.id}" data-date="${t.session_date}">${fmtDate(t.session_date)} ${t.location?('· '+t.location):''}</option>`).join('')}</select>
            <select id="cu-match" style="${availableTrainings.length ? 'display:none' : ''}">${availableMatches.map(m=>`<option value="${m.id}" data-date="${m.match_date}">${fmtDate(m.match_date)} vs ${m.opponent}</option>`).join('')}</select>
            <select id="cu-uniform" style="${!availableTrainings.length && availableMatches.length ? '' : 'display:none'}">
              <option value="uniforme_1">Uniforme 1 (negro y amarillo)</option>
              <option value="uniforme_2">Uniforme 2 (blanco y azul)</option>
            </select>
          </div>
          <textarea id="cu-notes" placeholder="Notas para el equipo (opcional)"></textarea>
          <button id="cu-save">Crear convocatoria</button>
        </div>
      `;
    } else {
      $('#callup-form-wrap').innerHTML = '';
    }
    $('#cu-type')?.addEventListener('change', ()=>{
      const isMatch = $('#cu-type').value === 'partido';
      $('#cu-training').style.display = isMatch ? 'none' : 'block';
      $('#cu-match').style.display = isMatch ? 'block' : 'none';
      $('#cu-uniform').style.display = isMatch ? 'block' : 'none';
    });
    $('#cu-save')?.addEventListener('click', async ()=>{
      const type = $('#cu-type').value;
      const isMatch = type === 'partido';
      const sel = isMatch ? $('#cu-match') : $('#cu-training');
      const id = sel.value;
      if(!id){ toast(isMatch ? 'Crea primero un partido en la sección Partidos' : 'Crea primero un entrenamiento en la sección Entrenamientos', true); return; }
      const eventDate = sel.selectedOptions[0].dataset.date;
      const payload = {
        type,
        training_id: isMatch ? null : id,
        match_id: isMatch ? id : null,
        event_date: eventDate,
        uniform: isMatch ? $('#cu-uniform').value : null,
        notes: $('#cu-notes').value.trim(),
        created_by: profile.id,
      };
      const { error } = await supabase.from('call_ups').insert(payload);
      if(error) return toast(error.message, true);
      toast('Convocatoria creada');
      renderConvocatoria();
    });
  }

  await loadCallUpsList();
}

async function loadCallUpsList(){
  // Del más reciente (próximo o recién realizado) al más lejano en el tiempo.
  const { data: callUps, error: callUpsError } = await supabase.from('call_ups')
    .select('*')
    .order('event_date', {ascending:true});

  const list = $('#callups-list');
  // Antes esto se trataba en silencio como "no hay convocatorias" cuando en
  // realidad Supabase devolvía un error (p. ej. de permisos/RLS) — ahora se
  // muestra el mensaje real para poder diagnosticarlo sin abrir la consola.
  if(callUpsError){ list.innerHTML = `<p class="muted">No se pudieron cargar las convocatorias: ${callUpsError.message}</p>`; return; }
  if(!callUps || !callUps.length){ list.innerHTML = '<p class="muted">No hay convocatorias registradas.</p>'; return; }

  // Los datos de entrenamiento/partido se traen aparte (en vez de con el embed
  // automático de PostgREST: trainings(...), matches(...)) porque ese embed
  // fallaba con "column trainings_1.location_url does not exist" — algo
  // ambiguo en cómo Supabase resuelve la relación entre call_ups y trainings.
  // Trayendo cada tabla por separado y uniéndolas aquí se evita el problema.
  const trainingIds = [...new Set(callUps.filter(c=>c.training_id).map(c=>c.training_id))];
  const matchIds = [...new Set(callUps.filter(c=>c.match_id).map(c=>c.match_id))];
  const [{ data: trainingsData }, { data: matchesData }] = await Promise.all([
    trainingIds.length ? supabase.from('trainings').select('id,session_date,start_time,location,location_url').in('id', trainingIds) : Promise.resolve({ data: [] }),
    matchIds.length ? supabase.from('matches').select('id,match_date,match_time,opponent,location,location_url').in('id', matchIds) : Promise.resolve({ data: [] }),
  ]);
  const trainingsById = Object.fromEntries((trainingsData||[]).map(t=>[t.id, t]));
  const matchesById = Object.fromEntries((matchesData||[]).map(m=>[m.id, m]));
  callUps.forEach(c=>{
    c.trainings = c.training_id ? trainingsById[c.training_id] : null;
    c.matches = c.match_id ? matchesById[c.match_id] : null;
  });

  // El cuerpo técnico y el usuario maestro ven el historial completo. El
  // jugador (y "fichaje") solo necesita ver la convocatoria más próxima —
  // sea partido o entrenamiento — en vez de desplazarse por todo el historial.
  let visibleCallUps = callUps;
  if(!canManage()){
    const today = new Date().toISOString().slice(0,10);
    const upcoming = callUps.filter(c=>c.event_date >= today);
    visibleCallUps = upcoming.length ? [upcoming[0]] : [callUps[callUps.length-1]];
  }

  // Resumen rápido (X/Y confirmados) y el detalle de quién asiste, quién no
  // asiste y quién todavía no responde — visible tanto para el cuerpo técnico
  // y usuario maestro como para el jugador, sin tener que desplegar cada
  // convocatoria para saber con cuántos compañeros se cuenta ese día.
  const { data: allResponses } = await supabase.from('call_up_responses')
    .select('call_up_id, player_id, response, players(full_name, jersey_number)')
    .in('call_up_id', visibleCallUps.map(c=>c.id));
  let countsByCallUp = {};
  let confirmedByCallUp = {};
  let notAttendingByCallUp = {};
  let respondedIdsByCallUp = {};
  (allResponses||[]).forEach(r=>{
    if(!countsByCallUp[r.call_up_id]) countsByCallUp[r.call_up_id] = 0;
    if(!confirmedByCallUp[r.call_up_id]) confirmedByCallUp[r.call_up_id] = [];
    if(!notAttendingByCallUp[r.call_up_id]) notAttendingByCallUp[r.call_up_id] = [];
    if(!respondedIdsByCallUp[r.call_up_id]) respondedIdsByCallUp[r.call_up_id] = new Set();
    if(r.player_id) respondedIdsByCallUp[r.call_up_id].add(r.player_id);
    if(r.response === 'asiste'){
      countsByCallUp[r.call_up_id]++;
      if(r.players) confirmedByCallUp[r.call_up_id].push(`#${r.players.jersey_number} ${r.players.full_name}`);
    } else if(r.response === 'no_asiste'){
      if(r.players) notAttendingByCallUp[r.call_up_id].push(`#${r.players.jersey_number} ${r.players.full_name}`);
    }
  });
  // Los jugadores lesionados no cuentan como disponibles para la convocatoria.
  const eligiblePlayers = playersCache.filter(p=>p.active && !p.injured);
  const totalActive = eligiblePlayers.length;

  list.innerHTML = visibleCallUps.map(c=>{
    const label = c.type === 'partido' ? `Partido vs ${c.matches?.opponent || '-'}` : 'Entrenamiento';
    const open = isCallUpOpen(c);
    const eventLocation = c.type === 'partido' ? c.matches?.location : c.trainings?.location;
    const eventLocationUrl = c.type === 'partido' ? c.matches?.location_url : c.trainings?.location_url;
    const summary = `<span class="muted" style="margin-left:8px">${countsByCallUp[c.id]||0}/${totalActive} confirmados</span>`;
    const confirmedNames = confirmedByCallUp[c.id] || [];
    const notAttendingNames = notAttendingByCallUp[c.id] || [];
    const respondedIds = respondedIdsByCallUp[c.id] || new Set();
    const pendingNames = eligiblePlayers.filter(p=>!respondedIds.has(p.id)).map(p=>`#${p.jersey_number} ${p.full_name}`);
    const nameList = (names)=> names.length ? `<ul style="margin:4px 0 0;padding-left:18px">${names.map(n=>`<li>${n}</li>`).join('')}</ul>` : '<div class="muted" style="margin-top:4px">Nadie por ahora.</div>';
    return `
      <div class="panel">
        <details ${!canManage() ? 'open' : ''}>
          <summary style="cursor:pointer">
            <strong>${label} · ${fmtDate(c.event_date)}</strong>
            <span class="badge ${open?'presente':'ausente'}" style="margin-left:8px">${open?'Abierta':'Cerrada'}</span>
            ${summary}
          </summary>
          <div class="muted" style="margin-top:8px">Responder antes de: ${fmtDeadline(c)}</div>
          ${(eventLocation || eventLocationUrl) ? `<div style="margin-top:6px">${eventLocation ? '📍 '+eventLocation+' ' : ''}${mapsLinkAuto(eventLocation, eventLocationUrl)}</div>` : ''}
          ${c.type==='partido' && c.uniform ? `<div style="margin-top:6px">Uniforme: <strong>${UNIFORM_LABELS[c.uniform]||c.uniform}</strong></div>` : ''}
          ${c.notes ? `<div class="muted" style="margin-top:6px">${c.notes}</div>` : ''}
          <div style="margin-top:8px">
            <div class="muted">✅ Asisten (${confirmedNames.length}/${totalActive}):</div>
            ${nameList(confirmedNames)}
          </div>
          <div style="margin-top:8px">
            <div class="muted">❌ No asisten (${notAttendingNames.length}/${totalActive}):</div>
            ${nameList(notAttendingNames)}
          </div>
          <div style="margin-top:8px">
            <div class="muted">⏳ Pendientes por responder (${pendingNames.length}/${totalActive}):</div>
            ${nameList(pendingNames)}
          </div>
          <div id="cu-body-${c.id}" style="margin-top:12px">Cargando…</div>
        </details>
      </div>
    `;
  }).join('');

  for(const c of visibleCallUps) renderCallUpBody(c);
}

async function renderCallUpBody(callUp){
  const container = $(`#cu-body-${callUp.id}`);
  if(!container) return;
  const open = isCallUpOpen(callUp);

  if(canManage()){
    const { data: responses } = await supabase.from('call_up_responses').select('*, players(full_name,jersey_number)').eq('call_up_id', callUp.id);
    const byPlayer = Object.fromEntries((responses||[]).map(r=>[r.player_id, r]));
    const injuredActive = playersCache.filter(p=>p.active && p.injured);
    container.innerHTML = `
      <p class="muted">El cuerpo técnico y el usuario maestro pueden marcar la asistencia de un jugador directamente, sin necesidad de esperar su respuesta ni la hora límite.</p>
      ${injuredActive.length ? `<p class="muted">🩹 No convocados por lesión: ${injuredActive.map(p=>`#${p.jersey_number} ${p.full_name}`).join(', ')}</p>` : ''}
      <table><thead><tr><th>#</th><th>Jugador</th><th>Respuesta</th><th>Respondió</th><th></th></tr></thead>
      <tbody>
        ${playersCache.filter(p=>p.active && !p.injured).map(p=>{
          const r = byPlayer[p.id];
          const statusLabel = r?.response === 'asiste' ? 'Asiste' : r?.response === 'no_asiste' ? 'No asiste' : (open ? 'Sin responder' : 'No respondió a tiempo');
          const badgeClass = r?.response === 'asiste' ? 'presente' : r?.response === 'no_asiste' ? 'ausente' : 'tarde';
          return `<tr><td>#${p.jersey_number}</td><td>${p.full_name}</td><td><span class="badge ${badgeClass}">${statusLabel}</span></td><td>${r?.responded_at ? new Date(r.responded_at).toLocaleString('es-ES') : '-'}</td>
            <td><button class="small secondary" onclick="window.__staffSetResponse('${callUp.id}','${p.id}','asiste')">Marcar asiste</button> <button class="small secondary" onclick="window.__staffSetResponse('${callUp.id}','${p.id}','no_asiste')">Marcar no asiste</button></td></tr>`;
        }).join('')}
      </tbody></table>
    `;
  } else if(profile.player_id){
    const { data: mine } = await supabase.from('call_up_responses').select('*').eq('call_up_id', callUp.id).eq('player_id', profile.player_id).maybeSingle();
    if(mine?.response){
      container.innerHTML = `Tu respuesta: <span class="badge ${mine.response==='asiste'?'presente':'ausente'}">${mine.response==='asiste'?'Asiste':'No asiste'}</span>
        ${open ? `<div style="margin-top:8px"><button class="small secondary" onclick="window.__respondCallUp('${callUp.id}','asiste')">Cambiar a Asiste</button> <button class="small secondary" onclick="window.__respondCallUp('${callUp.id}','no_asiste')">Cambiar a No asiste</button></div>` : ''}`;
    } else if(open){
      container.innerHTML = `
        <p class="muted">¿Asistes?</p>
        <button onclick="window.__respondCallUp('${callUp.id}','asiste')">Sí, asisto</button>
        <button class="secondary" onclick="window.__respondCallUp('${callUp.id}','no_asiste')">No puedo asistir</button>
      `;
    } else {
      container.innerHTML = `<span class="badge ausente">No respondiste a tiempo</span>`;
    }
  } else {
    container.innerHTML = '';
  }
}

window.__respondCallUp = async (callUpId, response)=>{
  const payload = { call_up_id: callUpId, player_id: profile.player_id, response, responded_at: new Date().toISOString() };
  const { error } = await supabase.from('call_up_responses').upsert(payload, { onConflict: 'call_up_id,player_id' });
  if(error) return toast(error.message, true);
  toast('Respuesta registrada');
  if($('#callups-list')) loadCallUpsList();
  if($('#notify-banner')) renderPlayerNotifications();
  refreshConvocatoriaBadge();
};

// El cuerpo técnico / usuario maestro fija la respuesta de un jugador a una
// convocatoria (partido o entrenamiento) directamente, sin esperar a que el
// jugador responda ni a la hora límite (3 horas antes del evento).
window.__staffSetResponse = async (callUpId, playerId, response)=>{
  const payload = { call_up_id: callUpId, player_id: playerId, response, responded_at: new Date().toISOString() };
  const { error } = await supabase.from('call_up_responses').upsert(payload, { onConflict: 'call_up_id,player_id' });
  if(error) return toast(error.message, true);
  toast('Asistencia marcada por el cuerpo técnico');
  loadCallUpsList();
};

// ---------------- MENSAJES (directos, jugador/fichaje <-> cuerpo técnico) ----------------
// Canal 1 a 1: un jugador (o fichaje) elige a qué miembro del cuerpo técnico
// escribirle, y el cuerpo técnico elige a qué jugador/fichaje responderle.
// El usuario maestro no tiene acceso a este módulo.
async function renderMensajes(){
  const isStaffSide = profile.role === 'cuerpo_tecnico';
  // El usuario maestro (Comité ALS) puede escribirle tanto al cuerpo
  // técnico como a jugadores/fichajes, ve a todo el mundo como contacto, y
  // también tiene su propia opción de mensaje masivo (a todos los
  // jugadores/fichajes del equipo, en vez de "a mis compañeros").
  const isMaestro = profile.role === 'usuario_maestro';
  const isPlayerSide = profile.role === 'jugador' || profile.role === 'fichaje';
  // Comité ALS y cuerpo técnico (el DT) comparten la misma opción de
  // mensaje masivo: escribirle de una sola vez a todos los jugadores/fichajes.
  const canMassMessageTeam = isMaestro || isStaffSide;
  main.innerHTML = `
    <h2 class="section-title">Mensajes</h2>
    <div class="panel">
      <div class="row">
        <select id="msg-contact" style="flex:1"><option value="">Cargando contactos…</option></select>
      </div>
      <div id="msg-thread" style="margin:12px 0;max-height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px"></div>
      <div class="row">
        <textarea id="msg-body" placeholder="Escribe un mensaje…" style="flex:1;min-height:60px"></textarea>
      </div>
      <div class="row" style="align-items:center;margin-bottom:12px">
        <label class="muted" style="flex:1;font-size:12px">
          📎 Adjuntar archivo (opcional — PDF, imagen, Word, Excel; máx. 15 MB)
          <input id="msg-file" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" style="margin-top:4px" />
        </label>
      </div>
      <button id="msg-send">Enviar</button>
    </div>
  `;

  // El usuario maestro se agrega como contacto posible para todos los demás
  // roles (antes solo era al revés: el maestro veía a todos, pero nadie
  // podía verlo a él ni encontrar su conversación).
  const contactRoles = isMaestro
    ? ['cuerpo_tecnico','jugador','fichaje']
    : isStaffSide
      ? ['jugador','fichaje','usuario_maestro']
      : ['cuerpo_tecnico','usuario_maestro'];
  // Los jugadores/fichajes se cargan aparte — solo se usan para armar la
  // opción de "mensaje masivo", no como contactos de chat 1 a 1
  // individuales. Jugador/fichaje la usan para escribirle a "todos mis
  // compañeros"; Comité ALS y cuerpo técnico (canMassMessageTeam) la usan
  // para escribirle a "todos los jugadores/fichajes" del equipo de una sola vez.
  const [{ data: contacts }, { data: unread }, { data: teammates, error: teammatesError }, { data: soloJugadores }] = await Promise.all([
    supabase.from('profiles')
      .select('id, full_name, role, player_id, players(jersey_number)')
      .in('role', contactRoles)
      .neq('id', profile.id)
      .order('full_name'),
    // Mensajes sin leer que me han mandado, agrupados por quién los mandó —
    // para mostrar un aviso junto al nombre de cada contacto.
    supabase.from('messages').select('sender_id').eq('recipient_id', profile.id).is('read_at', null),
    (isPlayerSide || canMassMessageTeam) ? supabase.from('profiles').select('id').in('role', ['jugador','fichaje']).neq('id', profile.id) : Promise.resolve({ data: [] }),
    // Solo para Comité ALS: lista de "jugador" puro (sin fichajes ni cuerpo
    // técnico) para el "Comunicado oficial" con archivo adjunto.
    isMaestro ? supabase.from('profiles').select('id').eq('role', 'jugador').neq('id', profile.id) : Promise.resolve({ data: [] }),
  ]);
  // Si la consulta de compañeros falla (p. ej. por un permiso/RLS que
  // bloquea a un jugador leer los perfiles de otros jugadores), se avisa en
  // vez de simplemente no mostrar la opción de mensaje masivo sin explicación.
  if(teammatesError) toast('No se pudo cargar la lista de compañeros para el mensaje masivo: ' + teammatesError.message, true);
  const unreadBySender = {};
  (unread||[]).forEach(m=>{ unreadBySender[m.sender_id] = (unreadBySender[m.sender_id]||0) + 1; });

  const sorted = (contacts||[]).slice().sort((a,b)=>{
    const ja = a.players?.jersey_number, jb = b.players?.jersey_number;
    if(ja!=null && jb!=null) return ja - jb;
    return a.full_name.localeCompare(b.full_name);
  });

  const MASS_MESSAGE_VALUE = '__todos_mis_companeros__';
  const COMUNICADO_VALUE = '__comunicado_oficial_jugadores__';
  const teammateIds = (teammates||[]).map(t=>t.id);
  const soloJugadorIds = (soloJugadores||[]).map(t=>t.id);

  const contactSel = $('#msg-contact');
  const massOption = ((isPlayerSide || canMassMessageTeam) && teammateIds.length)
    ? `<option value="${MASS_MESSAGE_VALUE}">📣 ${canMassMessageTeam ? `Enviar a todos los jugadores/fichajes (${teammateIds.length})` : `Enviar a todos mis compañeros (${teammateIds.length})`}</option>`
    : '';
  // Solo Comité ALS ve esta opción: comunicado oficial únicamente a
  // jugadores (sin fichajes ni cuerpo técnico), pensado para mandar
  // circulares/PDFs adjuntos.
  const comunicadoOption = (isMaestro && soloJugadorIds.length)
    ? `<option value="${COMUNICADO_VALUE}">📄 Comunicado oficial — solo jugadores, sin fichajes ni cuerpo técnico (${soloJugadorIds.length})</option>`
    : '';
  contactSel.innerHTML = massOption + comunicadoOption + (sorted.length
    ? sorted.map(c=>{
        const tag = c.players?.jersey_number ? `#${c.players.jersey_number} ` : '';
        const unreadTag = unreadBySender[c.id] ? ` — ${unreadBySender[c.id]} sin leer` : '';
        return `<option value="${c.id}">${tag}${c.full_name}${unreadTag}</option>`;
      }).join('')
    : '<option value="">No hay contactos disponibles todavía</option>');

  // Con la opción de mensaje masivo agregada, ese queda seleccionado por
  // defecto (es la primera opción del <select>) — así que el hilo inicial
  // que se muestra depende de cuál sea la selección real, no de "sorted[0]".
  const showThreadFor = async (value)=>{
    if(value === MASS_MESSAGE_VALUE){
      $('#msg-thread').innerHTML = canMassMessageTeam
        ? `<p class="muted">Este mensaje se enviará como mensaje privado a cada uno de los ${teammateIds.length} jugadores/fichajes del equipo (aparecerá en el chat de cada uno contigo, no en un canal grupal aparte).</p>`
        : `<p class="muted">Este mensaje se enviará como mensaje privado a cada uno de tus ${teammateIds.length} compañeros (aparecerá en el chat de cada uno contigo, no en un canal grupal aparte).</p>`;
    } else if(value === COMUNICADO_VALUE){
      $('#msg-thread').innerHTML = `<p class="muted">📄 Este comunicado se enviará como mensaje privado a cada uno de los ${soloJugadorIds.length} jugadores del equipo — <strong>no</strong> a fichajes ni al cuerpo técnico. Adjunta el PDF (u otro archivo) abajo si quieres incluirlo.</p>`;
    } else if(value){
      await loadMessageThread(value);
    } else {
      $('#msg-thread').innerHTML = `<p class="muted">${isPlayerSide ? 'Todavía no hay cuentas de cuerpo técnico creadas.' : 'Todavía no hay contactos disponibles.'}</p>`;
    }
  };
  await showThreadFor(contactSel.value);

  contactSel.addEventListener('change', ()=> showThreadFor(contactSel.value));

  // Sube el archivo adjunto (si se eligió uno) al mismo bucket que ya usa la
  // app para fotos/logos, bajo su propia carpeta "message-attachments/". Se
  // sube una sola vez y la misma URL se reutiliza en todas las filas cuando
  // el mensaje es masivo (mensaje a todos / comunicado oficial).
  const uploadMsgAttachment = async ()=>{
    const file = $('#msg-file')?.files?.[0];
    if(!file) return { attachment_url: null, attachment_name: null };
    if(file.size > 15 * 1024 * 1024){ throw new Error('El archivo adjunto no puede pesar más de 15 MB'); }
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
    const path = `message-attachments/${profile.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error: upErr } = await supabase.storage.from('match-photos').upload(path, file);
    if(upErr) throw upErr;
    const { data: pub } = supabase.storage.from('match-photos').getPublicUrl(path);
    return { attachment_url: pub.publicUrl, attachment_name: file.name };
  };

  $('#msg-send').addEventListener('click', async ()=>{
    const recipientId = contactSel.value;
    const body = $('#msg-body').value.trim();
    const hasFile = !!$('#msg-file')?.files?.length;
    if(!recipientId){ toast('Elige un contacto primero', true); return; }
    if(!body && !hasFile){ toast('Escribe un mensaje o adjunta un archivo', true); return; }

    const sendBtn = $('#msg-send');
    sendBtn.disabled = true;
    let attachment;
    try{
      attachment = await uploadMsgAttachment();
    }catch(err){
      toast(err.message, true); sendBtn.disabled = false; return;
    }

    if(recipientId === MASS_MESSAGE_VALUE || recipientId === COMUNICADO_VALUE){
      const targetIds = recipientId === COMUNICADO_VALUE ? soloJugadorIds : teammateIds;
      const rows = targetIds.map(id => ({ sender_id: profile.id, recipient_id: id, body, ...attachment }));
      const { error } = await supabase.from('messages').insert(rows);
      sendBtn.disabled = false;
      if(error){ toast(error.message, true); return; }
      $('#msg-body').value = ''; if($('#msg-file')) $('#msg-file').value = '';
      toast(recipientId === COMUNICADO_VALUE
        ? `Comunicado enviado a ${targetIds.length} jugadores`
        : (canMassMessageTeam ? `Mensaje enviado a ${targetIds.length} jugadores/fichajes` : `Mensaje enviado a ${targetIds.length} compañeros`));
      await showThreadFor(recipientId);
      return;
    }

    const { error } = await supabase.from('messages').insert({ sender_id: profile.id, recipient_id: recipientId, body, ...attachment });
    sendBtn.disabled = false;
    if(error){ toast(error.message, true); return; }
    $('#msg-body').value = ''; if($('#msg-file')) $('#msg-file').value = '';
    await loadMessageThread(recipientId);
  });
}

async function loadMessageThread(contactId){
  const thread = $('#msg-thread');
  if(!thread || !contactId) return;
  thread.innerHTML = '<p class="muted">Cargando…</p>';
  const { data: msgs } = await supabase.from('messages')
    .select('*')
    .or(`and(sender_id.eq.${profile.id},recipient_id.eq.${contactId}),and(sender_id.eq.${contactId},recipient_id.eq.${profile.id})`)
    .order('created_at', {ascending:true});

  thread.innerHTML = (msgs||[]).length
    ? msgs.map(m=>{
        const mine = m.sender_id === profile.id;
        const safeBody = (m.body||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const safeName = (m.attachment_name||'archivo adjunto').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const attachmentHtml = m.attachment_url
          ? `<div style="margin-top:${safeBody?'6px':'0'}"><a href="${m.attachment_url}" target="_blank" rel="noopener" style="color:${mine?'#fff':'var(--brand)'};text-decoration:underline">📎 ${safeName}</a></div>`
          : '';
        return `
          <div style="margin-bottom:10px;text-align:${mine?'right':'left'}">
            <div class="muted" style="font-size:11px">${mine?'Tú':'Ellos'} · ${new Date(m.created_at).toLocaleString('es-ES')}</div>
            <div style="display:inline-block;background:${mine?'var(--accent2)':'var(--panel2)'};color:${mine?'#fff':'var(--text)'};padding:6px 10px;border-radius:8px;max-width:80%;text-align:left;white-space:pre-wrap">${safeBody}${attachmentHtml}</div>
          </div>
        `;
      }).join('')
    : '<p class="muted">Todavía no hay mensajes en esta conversación. Escribe el primero.</p>';
  thread.scrollTop = thread.scrollHeight;

  // Al abrir la conversación, marca como leídos los mensajes que ese contacto me mandó.
  const unreadIds = (msgs||[]).filter(m=>m.recipient_id===profile.id && !m.read_at).map(m=>m.id);
  if(unreadIds.length){
    await supabase.from('messages').update({ read_at: new Date().toISOString() }).in('id', unreadIds);
    refreshMensajesBadge();
  }
}

async function refreshMensajesBadge(){
  const btn = document.querySelector('.nav-btn[data-view="mensajes"]');
  if(!btn) return;
  const existing = btn.querySelector('.nav-badge');
  if(existing) existing.remove();
  if(!['cuerpo_tecnico','jugador','fichaje','usuario_maestro'].includes(profile.role)) return;
  const { count } = await supabase.from('messages')
    .select('*', { count: 'exact', head: true })
    .eq('recipient_id', profile.id)
    .is('read_at', null);
  if(count){
    const badge = document.createElement('span');
    badge.className = 'nav-badge';
    badge.textContent = count;
    btn.appendChild(badge);
  }
}
</script>
