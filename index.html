// ---------------- ENTRENAMIENTOS / ASISTENCIA ----------------
async function renderEntrenamientos(){
  // Del más reciente (próximo o recién realizado) al más lejano en el tiempo.
  const { data: trainings } = await supabase.from('trainings').select('*').order('session_date', {ascending:true});
  main.innerHTML = `
    <div class="module-pill-wrap"><span class="module-pill">Entrenamientos</span></div>
    <div class="list-header-row">
      <h2 class="section-title">Entrenamientos</h2>
      ${canManageEvents() ? `<button id="nt-toggle" class="secondary" style="width:auto">+ Crear</button>` : ''}
    </div>
    ${canManageEvents() ? `
    <div class="panel" id="nt-panel" style="display:none">
      <h3>Nuevo entrenamiento</h3>
      <div class="row">
        <input id="nt-date" type="date" />
        <input id="nt-time" type="time" />
        <input id="nt-location" placeholder="Lugar" />
        <input id="nt-notes" placeholder="Notas" />
      </div>
      <div class="row">
        <input id="nt-location-url" placeholder="Link de Google Maps o Waze (opcional)" style="flex:1" />
      </div>
      <button id="nt-save">Crear entrenamiento</button>
    </div>
    <button id="nt-export" class="secondary" style="margin-bottom:16px">⬇️ Exportar asistencia a Excel</button>` : ''}
    <div class="tab-pill-row">
      <button class="tab-pill active" data-ent-tab="proximos">Próximos</button>
      <button class="tab-pill" data-ent-tab="realizados">Realizados</button>
    </div>
    <div id="trainings-list"></div>
  `;
  $('#nt-toggle')?.addEventListener('click', ()=>{
    const panel = $('#nt-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  const list = $('#trainings-list');
  // Resumen rápido de asistencia (X/Y presentes) para no tener que desplegar cada
  // entrenamiento para saber cómo fue — con el roster completo la lista es larga.
  let presentesByTraining = {};
  if(canManageEvents() && (trainings||[]).length){
    const { data: allAttendance } = await supabase.from('attendance')
      .select('training_id, status').in('training_id', trainings.map(t=>t.id));
    (allAttendance||[]).forEach(a=>{
      if(a.status === 'presente') presentesByTraining[a.training_id] = (presentesByTraining[a.training_id]||0) + 1;
    });
  }
  const totalActive = playersCache.filter(p=>p.active).length;

  // Cada entrenamiento va colapsado por defecto y se despliega al hacer clic — con el
  // roster completo, mostrar todos abiertos a la vez hace la lista interminable.
  const trainingCard = t => {
    const summary = canManageEvents() ? `<div class="muted" style="margin-top:2px">${presentesByTraining[t.id]||0}/${totalActive} presentes</div>` : '';
    const [dow, dnum] = t.session_date ? [new Date(t.session_date+'T00:00:00').toLocaleDateString('es-ES',{weekday:'short'}).toUpperCase(), new Date(t.session_date+'T00:00:00').getDate()] : ['FECHA','–'];
    return `
    <div class="panel">
      <details>
        <summary class="event-summary-row">
          <div class="event-date-box"><div class="dow">${t.session_date ? dow : 'POR'}</div><div class="num">${t.session_date ? dnum : 'DEFINIR'}</div></div>
          <div>
            <div style="font-weight:700">Sesión de entrenamiento</div>
            <div class="muted">${t.start_time ? '🕒 '+t.start_time.slice(0,5)+' · ' : ''}${t.location ? '📍 '+t.location : 'Lugar por definir'}</div>
            ${summary}
          </div>
        </summary>
        ${t.location_url ? `<div style="margin-top:4px">${mapsLink(t.location_url)}</div>` : ''}
        ${t.notes ? `<div class="muted" style="margin-top:6px">${t.notes}</div>` : ''}
        ${canManageEvents() ? `
        <div class="panel" style="background:var(--panel2);margin-top:10px">
          <p class="muted" style="margin-top:0">Editar entrenamiento (por ejemplo, si cambia la fecha) o eliminarlo si se canceló.</p>
          <div class="row">
            <input type="date" class="et-date" value="${t.session_date}" />
            <input type="time" class="et-time" value="${t.start_time?.slice(0,5)||''}" />
            <input class="et-location" placeholder="Lugar" value="${t.location||''}" />
            <input class="et-notes" placeholder="Notas" value="${t.notes||''}" />
          </div>
          <div class="row">
            <input class="et-location-url" placeholder="Link de Google Maps o Waze (opcional)" value="${t.location_url||''}" style="flex:1" />
          </div>
          <div class="row">
            <button class="small" onclick="window.__saveTraining('${t.id}', this)">Guardar cambios</button>
            <button class="small danger" onclick="window.__deleteTraining('${t.id}')">Eliminar entrenamiento</button>
          </div>
        </div>` : ''}
        <div id="att-${t.id}" style="margin-top:10px">Cargando asistencia…</div>
      </details>
    </div>
  `;
  };
  // Próximos (el más cercano primero) aparte de los ya realizados (el más reciente primero).
  const today = new Date().toISOString().slice(0,10);
  const proximos = (trainings||[]).filter(t=>t.session_date >= today).sort((a,b)=>a.session_date.localeCompare(b.session_date));
  const realizados = (trainings||[]).filter(t=>t.session_date < today).sort((a,b)=>b.session_date.localeCompare(a.session_date));
  list.innerHTML = `
    <div id="ent-proximos">${proximos.map(trainingCard).join('') || '<p class="muted">No hay entrenamientos próximos.</p>'}</div>
    <div id="ent-realizados" style="display:none">${realizados.map(trainingCard).join('') || '<p class="muted">Todavía no se ha realizado ningún entrenamiento.</p>'}</div>
  `;
  $$('.tab-pill[data-ent-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{
      $$('.tab-pill[data-ent-tab]').forEach(x=> x.classList.toggle('active', x===b));
      $('#ent-proximos').style.display = b.dataset.entTab === 'proximos' ? 'block' : 'none';
      $('#ent-realizados').style.display = b.dataset.entTab === 'realizados' ? 'block' : 'none';
    });
  });

  for(const t of (trainings||[])) renderAttendanceForTraining(t.id, t.session_date);

  if(canManageEvents()){
    $('#nt-export').addEventListener('click', ()=> exportAttendanceToExcel(trainings||[]));
    $('#nt-save').addEventListener('click', async ()=>{
      const payload = {
        session_date: $('#nt-date').value,
        start_time: $('#nt-time').value || null,
        location: $('#nt-location').value.trim(),
        location_url: $('#nt-location-url').value.trim() || null,
        notes: $('#nt-notes').value.trim(),
        season_id: currentSeasonId(),
      };
      if(!payload.session_date){ toast('La fecha es obligatoria', true); return; }
      const { data: newTraining, error } = await supabase.from('trainings').insert(payload).select().single();
      if(error){ toast(error.message, true); return; }
      // Convocatoria automática: los jugadores la ven de inmediato como notificación.
      const { error: cuError } = await supabase.from('call_ups').insert({
        type: 'entrenamiento',
        training_id: newTraining.id,
        match_id: null,
        event_date: newTraining.session_date,
        uniform: null,
        notes: null,
        created_by: profile.id,
      });
      if(cuError) toast('Entrenamiento creado, pero no se pudo lanzar la convocatoria: ' + cuError.message, true);
      else toast('Entrenamiento creado y convocatoria enviada a los jugadores');
      renderEntrenamientos();
    });
  }
}

window.__saveTraining = async (trainingId, btn)=>{
  const panel = btn.closest('details');
  const session_date = panel.querySelector('.et-date').value;
  if(!session_date){ toast('La fecha es obligatoria', true); return; }
  const payload = {
    session_date,
    start_time: panel.querySelector('.et-time').value || null,
    location: panel.querySelector('.et-location').value.trim(),
    location_url: panel.querySelector('.et-location-url').value.trim() || null,
    notes: panel.querySelector('.et-notes').value.trim(),
  };
  const { error } = await supabase.from('trainings').update(payload).eq('id', trainingId);
  if(error){ toast(error.message, true); return; }
  // Mantiene sincronizada la fecha de la convocatoria asociada.
  await supabase.from('call_ups').update({ event_date: session_date }).eq('training_id', trainingId);
  toast('Entrenamiento actualizado'); renderEntrenamientos();
};

window.__deleteTraining = async (trainingId)=>{
  if(!confirm('¿Eliminar este entrenamiento? Se borrará también la asistencia y la convocatoria asociada. Esta acción no se puede deshacer.')) return;
  // El schema tiene "on delete cascade" en attendance/call_ups/call_up_responses y
  // "on delete set null" en evaluations.training_id, así que un solo delete basta.
  const { error } = await supabase.from('trainings').delete().eq('id', trainingId);
  if(error){ toast(error.message, true); return; }
  toast('Entrenamiento eliminado'); renderEntrenamientos();
};

async function renderAttendanceForTraining(trainingId, sessionDate){
  const container = $(`#att-${trainingId}`);
  if(!container) return;
  const [{ data: att }, { data: callUp }] = await Promise.all([
    supabase.from('attendance').select('*').eq('training_id', trainingId),
    supabase.from('call_ups').select('id').eq('training_id', trainingId).maybeSingle(),
  ]);
  const byPlayer = Object.fromEntries((att||[]).map(a=>[a.player_id, a]));
  let confirmedIds = new Set();
  if(callUp){
    const { data: responses } = await supabase.from('call_up_responses').select('player_id').eq('call_up_id', callUp.id).eq('response', 'asiste');
    confirmedIds = new Set((responses||[]).map(r=>r.player_id));
  }

  if(canManageEvents()){
    const { data: evals } = await supabase.from('evaluations').select('*').eq('training_id', trainingId);
    const evalByPlayer = Object.fromEntries((evals||[]).map(e=>[e.player_id, e]));
    container.innerHTML = `
      <p class="muted">Registra asistencia y, opcionalmente, la calificación (1-5) del desempeño de cada jugador en este entrenamiento. Si un jugador confirmó "Asiste" en la convocatoria y aún no le registras la asistencia aquí, esa confirmación ya cuenta como presente en su promedio.</p>
      <table>
        <thead><tr><th>#</th><th>Jugador</th><th>Estado</th><th>Llegada</th><th>Motivo (si ausente)</th><th>Notas</th><th>Téc.</th><th>Fís.</th><th>Tác.</th><th>Men.</th><th></th></tr></thead>
        <tbody>
          ${playersCache.filter(p=>p.active).map(p=>{
            const a = byPlayer[p.id] || {};
            const e = evalByPlayer[p.id] || {};
            const confirmedNoRecord = !a.status && confirmedIds.has(p.id);
            return `<tr data-pid="${p.id}" data-session-date="${sessionDate}">
              <td>#${p.jersey_number}</td>
              <td>${p.full_name}${confirmedNoRecord ? ' <span class="badge presente" title="Confirmó Asiste en la convocatoria; ya cuenta como presente en su promedio">✅ confirmó</span>' : ''}</td>
              <td><select class="f-status">
                <option value="presente" ${a.status==='presente'?'selected':''}>Presente</option>
                <option value="tarde" ${a.status==='tarde'?'selected':''}>Tarde</option>
                <option value="ausente" ${a.status==='ausente'?'selected':''}>Ausente</option>
              </select></td>
              <td><input class="f-time" type="time" value="${a.arrival_time?.slice(0,5)||''}"/></td>
              <td><select class="f-reason">
                <option value="">—</option>
                ${['trabajo','viaje','familia','enfermo','lesion','otro'].map(r=>`<option value="${r}" ${a.absence_reason===r?'selected':''}>${r}</option>`).join('')}
              </select></td>
              <td><input class="f-notes" value="${a.reason_notes||''}"/></td>
              <td><input type="number" min="1" max="5" class="f-technique rating-input" value="${e.technique||''}" placeholder="-" /></td>
              <td><input type="number" min="1" max="5" class="f-physical rating-input" value="${e.physical||''}" placeholder="-" /></td>
              <td><input type="number" min="1" max="5" class="f-tactical rating-input" value="${e.tactical||''}" placeholder="-" /></td>
              <td><input type="number" min="1" max="5" class="f-mental rating-input" value="${e.mental||''}" placeholder="-" /></td>
              <td><button class="small" onclick="window.__saveAttendance('${trainingId}','${p.id}', this)">Guardar</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  } else {
    const a = byPlayer[profile.player_id];
    container.innerHTML = a
      ? `<span class="badge ${a.status}">${a.status}</span> ${a.arrival_time ? '· Llegada: '+a.arrival_time.slice(0,5) : ''} ${a.absence_reason ? '· Motivo: '+a.absence_reason : ''} ${a.reason_notes ? '· '+a.reason_notes : ''}`
      : `<span class="muted">Aún no registrada</span>`;
  }
}

window.__saveAttendance = async (trainingId, playerId, btn)=>{
  const tr = btn.closest('tr');
  const payload = {
    training_id: trainingId,
    player_id: playerId,
    status: tr.querySelector('.f-status').value,
    arrival_time: tr.querySelector('.f-time').value || null,
    absence_reason: tr.querySelector('.f-reason').value || null,
    reason_notes: tr.querySelector('.f-notes').value || null,
    recorded_by: profile.id,
  };
  const { error } = await supabase.from('attendance').upsert(payload, { onConflict: 'training_id,player_id' });
  if(error){ toast(error.message, true); return; }

  const technique = tr.querySelector('.f-technique')?.value;
  const physical = tr.querySelector('.f-physical')?.value;
  const tactical = tr.querySelector('.f-tactical')?.value;
  const mental = tr.querySelector('.f-mental')?.value;
  if(technique || physical || tactical || mental){
    const evalPayload = {
      player_id: playerId, training_id: trainingId,
      eval_date: tr.dataset.sessionDate,
      evaluator_id: profile.id,
      technique: Number(technique)||null,
      physical: Number(physical)||null,
      tactical: Number(tactical)||null,
      mental: Number(mental)||null,
    };
    const { error: evalError } = await supabase.from('evaluations').upsert(evalPayload, { onConflict: 'player_id,training_id' });
    if(evalError){ toast(evalError.message, true); return; }
  }
  toast('Asistencia y calificación guardadas');
};

// Exporta un .xlsx con una fila por jugador y entrenamiento: asistencia, llegada,
// motivo de ausencia y la calificación (si el DT la registró).
async function exportAttendanceToExcel(trainings){
  if(!trainings.length){ toast('No hay entrenamientos para exportar', true); return; }
  toast('Generando Excel…');
  const [{data: attendance}, {data: evals}] = await Promise.all([
    supabase.from('attendance').select('*'),
    supabase.from('evaluations').select('*').not('training_id', 'is', null),
  ]);
  const trainingById = Object.fromEntries(trainings.map(t=>[t.id, t]));
  const playerById = Object.fromEntries(playersCache.map(p=>[p.id, p]));
  const evalByKey = Object.fromEntries((evals||[]).map(e=>[`${e.training_id}_${e.player_id}`, e]));

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Asistencia');
  ws.columns = [
    { header: 'Fecha', key: 'fecha', width: 14 },
    { header: '#', key: 'num', width: 6 },
    { header: 'Jugador', key: 'jugador', width: 26 },
    { header: 'Estado', key: 'estado', width: 12 },
    { header: 'Llegada', key: 'llegada', width: 10 },
    { header: 'Motivo', key: 'motivo', width: 14 },
    { header: 'Notas', key: 'notas', width: 30 },
    { header: 'Técnica', key: 'tec', width: 10 },
    { header: 'Físico', key: 'fis', width: 10 },
    { header: 'Táctica', key: 'tac', width: 10 },
    { header: 'Mental', key: 'men', width: 10 },
  ];
  styleHeaderRow(ws);

  (attendance||[]).sort((a,b)=>{
    const ta = trainingById[a.training_id]?.session_date || '';
    const tb = trainingById[b.training_id]?.session_date || '';
    return tb.localeCompare(ta);
  }).forEach(a=>{
    const t = trainingById[a.training_id];
    const p = playerById[a.player_id];
    if(!t || !p) return;
    const e = evalByKey[`${a.training_id}_${a.player_id}`];
    ws.addRow({
      fecha: fmtDate(t.session_date),
      num: p.jersey_number,
      jugador: p.full_name,
      estado: a.status,
      llegada: a.arrival_time ? a.arrival_time.slice(0,5) : '-',
      motivo: a.absence_reason || '-',
      notas: a.reason_notes || '',
      tec: e?.technique || '', fis: e?.physical || '', tac: e?.tactical || '', men: e?.mental || '',
    });
  });

  await downloadWorkbook(wb, `asistencia_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel de asistencia descargado');
}

// ---------------- FINANZAS (solo el rol "financiero" edita; el resumen es de solo lectura para los demás) ----------------
// Categorías de gasto + presupuesto: las crea y edita libremente el usuario maestro
// (ya no es una lista fija; puede agregar cosas como "Inscripción al torneo").
let expenseCategories = [];
async function loadExpenseCategories(){
  const { data } = await supabase.from('expense_categories').select('*').eq('season_id', currentSeasonId()).order('name');
  expenseCategories = data || [];
}

// ---------------- PAGOS DE TARJETAS Y SANCIONES (sección aparte y siempre visible) ----------------
// Es una categoría de gasto normal por debajo (así entra en el presupuesto de
// la temporada junto a las demás), pero tiene su propio panel exclusivo en
// Finanzas para que el cuerpo técnico / usuario maestro no tenga que filtrar
// la lista general de gastos para verlos: quedan aparte y siempre a la vista.
const SANCIONES_CATEGORY_NAME = 'Sanciones y tarjetas (amarillas y rojas)';
let sancionesCategoryId = null;
async function ensureSancionesCategory(){
  const seasonId = currentSeasonId();
  let cat = expenseCategories.find(c => c.name === SANCIONES_CATEGORY_NAME);
  if(!cat){
    // No existe todavía para esta temporada (por ejemplo, una temporada nueva) — se crea sola.
    const { data, error } = await supabase.from('expense_categories')
      .insert({ name: SANCIONES_CATEGORY_NAME, estimated_amount: 0, season_id: seasonId })
      .select().single();
    if(!error && data){ cat = data; expenseCategories.push(data); }
  }
  sancionesCategoryId = cat?.id || null;
}
async function loadSancionesPagos(){
  if(!sancionesCategoryId) return [];
  const { data } = await supabase.from('team_expenses')
    .select('*')
    .eq('category_id', sancionesCategoryId)
    .order('expense_date', {ascending:false});
  return data || [];
}
async function renderSancionesPanel(){
  const pagos = await loadSancionesPagos();
  const total = pagos.reduce((sum,p)=>sum + Number(p.amount), 0);
  const container = $('#sanciones-list');
  if(!container) return;
  container.innerHTML = `
    <table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Monto</th><th></th></tr></thead>
      <tbody>
        ${pagos.map(p=>`<tr><td>${fmtDate(p.expense_date)}</td><td>${p.description||'-'}</td><td>${fmtMoney(p.amount)}</td><td><button class="small secondary" onclick="window.__deleteSancionPago('${p.id}')">Eliminar</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Todavía no hay pagos registrados.</td></tr>'}
      </tbody>
    </table>
    <p style="margin-top:8px"><strong>Total pagado en tarjetas/sanciones: ${fmtMoney(total)}</strong></p>
  `;
}
window.__deleteSancionPago = async (id)=>{

window.__deleteIncome = async (id)=>{
  if(!confirm('¿Eliminar este ingreso extra? Esta acción no se puede deshacer.')) return;

// Multa por tarjeta amarilla/roja: se suma automáticamente a lo que debe cada
// jugador (no hay que crear una cuota manual por cada tarjeta).
let fineSettings = { id: null, yellow_card_fine: 0, red_card_fine: 0 };
async function loadFineSettings(){
  const { data } = await supabase.from('fine_settings').select('*').limit(1).maybeSingle();

async function loadFinancialSummaryReadOnly(selector){
  const el = $(selector);
  if(!el) return;
  const { data: summary, error } = await supabase.rpc('team_financial_summary');
  el.innerHTML = error ? `<p class="muted">No se pudo cargar el resumen financiero.</p>` : renderFinancialSummaryHTML(summary || {});

function renderFinancialSummaryHTML(s){
  const totalRecaudado = s.total_recaudado || 0;
  const totalComprometido = s.total_comprometido || 0;
  const totalMultas = s.total_multas_tarjetas || 0;
  const totalIngresosExtra = s.total_ingresos_extra || 0;
  const totalGastado = s.total_gastado || 0;
  const totalPresupuestado = s.total_presupuestado || 0;
  const saldo = totalRecaudado - totalGastado;
  const presupuesto = s.presupuesto_por_categoria || [];
  const ultimosGastos = s.ultimos_gastos || [];
  return `
    <div class="panel">
      <h3>Resumen financiero del equipo</h3>
      <div class="cards">
        <div class="card"><div class="num">${fmtMoney(totalRecaudado)}</div><div class="label">Recaudado</div></div>
        <div class="card"><div class="num">${fmtMoney(totalComprometido)}</div><div class="label">Comprometido a recibir (cuotas + multas)</div></div>
        <div class="card"><div class="num">${fmtMoney(totalMultas)}</div><div class="label">De eso, multas por tarjetas</div></div>
        <div class="card"><div class="num">${fmtMoney(totalGastado)}</div><div class="label">Gastado</div></div>
        <div class="card"><div class="num">${fmtMoney(saldo)}</div><div class="label">Saldo en caja</div></div>
      </div>
      ${totalMultas ? `<p class="muted">Las multas por tarjetas amarillas/rojas se suman como deuda de cada jugador (ver "Salud financiera") y también como plata que el equipo tiene comprometido recibir, ya que de ahí sale lo que hay que cancelarle a la organización del torneo.</p>` : ''}
      ${totalIngresosExtra ? `<p class="muted">"Recaudado" incluye ${fmtMoney(totalIngresosExtra)} en ingresos extra que no dependen de ningún jugador (patrocinios, donaciones, etc. — ver "Ingresos extra" más abajo).</p>` : ''}
      <h4>Presupuesto de la temporada: presupuestado vs. ejecutado</h4>
      <table><thead><tr><th>Categoría</th><th>Presupuestado</th><th>Ejecutado (real)</th><th>Diferencia</th></tr></thead>
      <tbody>${presupuesto.length ? presupuesto.map(c=>{
        const diff = Number(c.estimated_amount) - Number(c.ejecutado);
        return `<tr><td>${c.name}</td><td>${fmtMoney(c.estimated_amount)}</td><td>${fmtMoney(c.ejecutado)}</td><td style="color:${diff<0?'var(--danger)':'var(--accent)'}">${fmtMoney(diff)}</td></tr>`;
      }).join('') : '<tr><td colspan="4" class="muted">Aún no hay categorías de presupuesto</td></tr>'}</tbody>
      <tfoot><tr><td><strong>Total</strong></td><td><strong>${fmtMoney(totalPresupuestado)}</strong></td><td><strong>${fmtMoney(totalGastado)}</strong></td><td><strong>${fmtMoney(totalPresupuestado-totalGastado)}</strong></td></tr></tfoot></table>
      <h4>Últimos gastos registrados</h4>
      <table><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th></tr></thead>
      <tbody>${ultimosGastos.length ? ultimosGastos.map(e=>`<tr><td>${fmtDate(e.expense_date)}</td><td>${e.category}</td><td>${e.description||'-'}</td><td>${fmtMoney(e.amount)}</td></tr>`).join('') : '<tr><td colspan="4" class="muted">Sin gastos registrados</td></tr>'}</tbody></table>
    </div>
  `;
}

// Recuerda qué sub-sección de Finanzas quedó abierta (estilo lámina: landing
// con lista de accesos + detalle) para que, al guardar algo dentro de una
// sección y volver a renderizar todo el módulo, el usuario no "rebote" al
// landing sino que siga viendo la misma sección.
let finOpenSection = null;
function openFinSection(id){
  const landing = $('#fin-landing'), sections = $('#fin-sections');
  if(!landing || !sections) return;
  landing.style.display = 'none';
  sections.style.display = 'block';
  $$('.fin-section').forEach(s=> s.style.display = (s.id === id ? 'block' : 'none'));
  finOpenSection = id;
}
function closeFinSection(){
  const landing = $('#fin-landing'), sections = $('#fin-sections');
  if(!landing || !sections) return;
  sections.style.display = 'none';
  landing.style.display = 'block';
  finOpenSection = null;
}

  const { data: s } = await supabase.rpc('team_financial_summary');

  if(gasEl) gasEl.textContent = fmtMoney(summary.total_gastado);
}

// Tabla editable de presupuesto: presupuestado (editable) vs. ejecutado (real, calculado).
async function renderBudgetRows(){
  const { data: expenses } = await supabase.from('team_expenses').select('category_id, amount');
  const ejecutadoPorCategoria = {};
  (expenses||[]).forEach(e=>{ ejecutadoPorCategoria[e.category_id] = (ejecutadoPorCategoria[e.category_id]||0) + Number(e.amount); });
  $('#budget-tbody').innerHTML = expenseCategories.map(c=>{
    const ejecutado = ejecutadoPorCategoria[c.id] || 0;
    const diff = Number(c.estimated_amount) - ejecutado;
    return `<tr data-cid="${c.id}">
      <td>${c.name}</td>
      <td><input type="number" class="budget-amount" value="${c.estimated_amount}" style="width:120px"></td>
      <td>${fmtMoney(ejecutado)}</td>
      <td style="color:${diff<0?'var(--danger)':'var(--accent)'}">${fmtMoney(diff)}</td>
      <td>
        <button class="small" onclick="window.__saveBudget('${c.id}', this)">Guardar</button>
        <button class="small danger" onclick="window.__deleteBudgetCategory('${c.id}', '${c.name.replace(/'/g,"\\'")}')">Eliminar</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="muted">Aún no has creado categorías de presupuesto</td></tr>';
}

window.__saveBudget = async (categoryId, btn)=>{
  const tr = btn.closest('tr');
  const estimated_amount = Number(tr.querySelector('.budget-amount').value) || 0;
  const { error } = await supabase.from('expense_categories').update({ estimated_amount }).eq('id', categoryId);

window.__deleteBudgetCategory = async (categoryId, categoryName)=>{
  if(!confirm(`¿Eliminar la categoría de presupuesto "${categoryName}"? Esta acción no se puede deshacer.`)) return;
  // expense_categories no tiene "on delete cascade" en team_expenses.category_id, así que
  // si ya hay gastos registrados en esta categoría, avisamos antes de intentar borrar.
  const { count } = await supabase.from('team_expenses').select('id', { count: 'exact', head: true }).eq('category_id', categoryId);
  if(count){ toast(`No se puede eliminar: hay ${count} gasto(s) registrados en "${categoryName}". Elimínalos o cámbialos de categoría primero.`, true); return; }
  const { error } = await supabase.from('expense_categories').delete().eq('id', categoryId);
  if(error){ toast(error.message, true); return; }
  toast('Categoría eliminada');
  await loadExpenseCategories();
  renderBudgetRows();
  loadFinancialSummaryReadOnly('#fin-summary');
};

// Cuota presupuestada vs. pagado por jugador, sumando automáticamente las
// multas por tarjeta amarilla/roja (según fine_settings) a lo que debe.
async function renderPlayerHealthRows(){
  const [{data: dues}, {data: pays}, {data: stats}] = await Promise.all([
    supabase.from('payment_dues').select('player_id, amount_due, due_date'),
    supabase.from('payments').select('player_id, amount'),
    supabase.from('player_match_stats').select('player_id, yellow_cards, red_cards'),
  ]);
  const today = new Date().toISOString().slice(0,10);
  const rows = playersCache.filter(p=>p.active).map(p=>{
    const playerDues = (dues||[]).filter(d=>d.player_id===p.id);
    const cuotas = playerDues.reduce((a,d)=>a+Number(d.amount_due),0);
    const pagado = (pays||[]).filter(x=>x.player_id===p.id).reduce((a,x)=>a+Number(x.amount),0);
    const yellow = (stats||[]).filter(s=>s.player_id===p.id).reduce((a,s)=>a+(s.yellow_cards||0),0);
    const red = (stats||[]).filter(s=>s.player_id===p.id).reduce((a,s)=>a+(s.red_cards||0),0);
    const multas = yellow*Number(fineSettings.yellow_card_fine||0) + red*Number(fineSettings.red_card_fine||0);
    const totalDebe = cuotas + multas;
    const saldo = totalDebe - pagado;
    const hayVencida = playerDues.some(d=>d.due_date && d.due_date < today);
    const estado = saldo <= 0 ? 'Al día' : (hayVencida ? 'Vencido' : 'Pendiente');
    const badgeClass = saldo <= 0 ? 'presente' : (hayVencida ? 'ausente' : 'tarde');
    return { p, cuotas, multas, totalDebe, pagado, saldo, estado, badgeClass, yellow, red };
  });
  $('#player-health-tbody').innerHTML = rows.map(r=>`
    <tr>
      <td>#${r.p.jersey_number}</td>
      <td>${r.p.full_name}</td>
      <td>${fmtMoney(r.cuotas)}</td>
      <td>${fmtMoney(r.multas)}${(r.yellow||r.red) ? ` <span class="muted">(${r.yellow} 🟨${r.red?' '+r.red+' 🟥':''})</span>` : ''}</td>
      <td>${fmtMoney(r.totalDebe)}</td>
      <td>${fmtMoney(r.pagado)}</td>
      <td>${fmtMoney(r.saldo)}</td>
      <td><span class="badge ${r.badgeClass}">${r.estado}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="8" class="muted">Sin jugadores activos</td></tr>';
}

// Resume, por jugador, los recordatorios automáticos de pago que se le han
// mandado (los inserta directo en 'messages' la función de Supabase
// send_payment_reminders(), identificados por el prefijo fijo del mensaje).
// Esto es solo un resumen de lectura — el mensaje completo se ve en el
// módulo Mensajes, en la conversación con ese jugador.
async function renderReminderLog(){
  const el = $('#reminder-log-tbody');
  if(!el) return;
  const [{ data: msgs }, { data: profs }] = await Promise.all([
    supabase.from('messages').select('recipient_id, created_at').like('body', '⏰ Recordatorio de pago%').order('created_at', {ascending:false}),
    supabase.from('profiles').select('id, full_name, player_id, players(jersey_number)').in('role', ['jugador','fichaje']),
  ]);
  const profById = {};
  (profs||[]).forEach(p=> profById[p.id] = p);
  const summary = {};
  (msgs||[]).forEach(m=>{
    if(!summary[m.recipient_id]) summary[m.recipient_id] = { count: 0, last: m.created_at };
    summary[m.recipient_id].count++;
    if(m.created_at > summary[m.recipient_id].last) summary[m.recipient_id].last = m.created_at;
  });
  const rows = Object.entries(summary).map(([recipientId, s])=>{
    const prof = profById[recipientId];
    return { name: prof?.full_name || 'Jugador eliminado', jersey: prof?.players?.jersey_number, ...s };
  }).sort((a,b)=> new Date(b.last) - new Date(a.last));

  el.innerHTML = rows.length ? rows.map(r=>`
    <tr>
      <td>${r.jersey ? '#'+r.jersey+' ' : ''}${r.name}</td>
      <td>${r.count}</td>
      <td>${new Date(r.last).toLocaleString('es-ES')}</td>
    </tr>
  `).join('') : '<tr><td colspan="3" class="muted">Todavía no se ha enviado ningún recordatorio automático</td></tr>';
}

// Solo el usuario maestro puede borrar una cuota (la política "maestro gestiona
// cuotas" en payment_dues ya lo exige también a nivel de base de datos, esto es
// solo la confirmación del lado de la app). Si esa cuota ya tenía pagos
// registrados, esos pagos NO se borran — quedan con due_id en null (ver
// "on delete set null" en schema.sql) para no perder el historial de pagos.
window.__deleteDue = async (dueId, btn)=>{
  if(!confirm('¿Eliminar esta cuota? Los pagos que ya se hayan registrado contra ella no se borran, solo la cuota.')) return;

  toast('Cuota eliminada');
  renderPlayerHealthRows();
  loadFinanceDetail();
};

  toast('Generando Excel…');

  ]);
  const todayISO = new Date().toISOString().slice(0,10);
  const rows = (playersCache||[]).filter(p=>p.active).map(p=>{
    const playerDues = (allDues||[]).filter(d=>d.player_id===p.id);
    const cuotas = playerDues.reduce((a,d)=>a+Number(d.amount_due),0);
    const pagado = (allPays||[]).filter(x=>x.player_id===p.id).reduce((a,x)=>a+Number(x.amount),0);
    const yellow = (stats||[]).filter(s=>s.player_id===p.id).reduce((a,s)=>a+(s.yellow_cards||0),0);
    const red = (stats||[]).filter(s=>s.player_id===p.id).reduce((a,s)=>a+(s.red_cards||0),0);
    const multas = yellow*Number(fineSettings.yellow_card_fine||0) + red*Number(fineSettings.red_card_fine||0);
    const total = cuotas + multas;
    const saldo = total - pagado;
    const hayVencida = playerDues.some(d=>d.due_date && d.due_date < todayISO);
    const estado = saldo <= 0 ? 'Al día' : (hayVencida ? 'Vencido' : 'Pendiente');

// ---------------- TEMPORADAS (histórico semestral) ----------------
// El torneo corre en semestres. Cada temporada agrupa sus propios entrenamientos, partidos,
// categorías de presupuesto y cuotas (vía season_id), para poder comparar un semestre contra
// otro sin mezclar los datos.
async function seasonStats(seasonId){
  const [{ data: matches }, { data: trainings }, { data: categorias }, { data: dues }] = await Promise.all([
    supabase.from('matches').select('result').eq('season_id', seasonId),
    supabase.from('trainings').select('id').eq('season_id', seasonId),
    supabase.from('expense_categories').select('id, estimated_amount').eq('season_id', seasonId),
    supabase.from('payment_dues').select('player_id, amount_due').eq('season_id', seasonId),
  ]);
  const categoriaIds = (categorias||[]).map(c=>c.id);
  const presupuestado = (categorias||[]).reduce((a,c)=>a+Number(c.estimated_amount||0),0);
  let ejecutado = 0;
  if(categoriaIds.length){
    const { data: expenses } = await supabase.from('team_expenses').select('amount').in('category_id', categoriaIds);
    ejecutado = (expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0);
  }
  const comprometido = (dues||[]).reduce((a,d)=>a+Number(d.amount_due||0),0);
  const duePlayerIds = [...new Set((dues||[]).map(d=>d.player_id))];
  let recaudado = 0;
  if(duePlayerIds.length){
    // Aproximación: pagos de jugadores que tienen al menos una cuota en esta temporada.
    const { data: pays } = await supabase.from('payments').select('amount').in('player_id', duePlayerIds);
    recaudado = (pays||[]).reduce((a,p)=>a+Number(p.amount||0),0);
  }
  const jugados = (matches||[]).filter(m=>m.result && m.result.trim()).length;
  return { partidosProgramados: (matches||[]).length, partidosJugados: jugados, entrenamientos: (trainings||[]).length, presupuestado, ejecutado, comprometido, recaudado };
}

        <div class="card"><div class="num">${fmtMoney(s.ejecutado)}</div><div class="label">Ejecutado (gastos)</div></div>
        <div class="card"><div class="num">${fmtMoney(s.comprometido)}</div><div class="label">Cuotas asignadas</div></div>
        <div class="card"><div class="num">${fmtMoney(s.recaudado)}</div><div class="label">Recaudado (aprox.)</div></div>
      </div>
    `;
  };
  if(seasons.length) await renderHistorico();
  else $('#th-body').innerHTML = '<p class="muted">Aún no hay temporadas.</p>';
  $('#th-season').addEventListener('change', renderHistorico);
  $('#ts-save').addEventListener('click', async ()=>{
    const name = $('#ts-name').value.trim();
    const start_date = $('#ts-start').value || null;
    const end_date = $('#ts-end').value || null;
    if(!name){ toast('El nombre de la temporada es obligatorio', true); return; }
    const makeCurrent = $('#ts-current').checked;
    if(makeCurrent){
      const { error: unsetError } = await supabase.from('seasons').update({ is_current: false }).eq('is_current', true);
      if(unsetError) return toast(unsetError.message, true);
    }
    const { error } = await supabase.from('seasons').insert({ name, start_date, end_date, is_current: makeCurrent });
    if(error) return toast(error.message, true);
    toast('Temporada creada');
    await loadCurrentSeason();
    renderTemporadas();
  });
}

window.__setCurrentSeason = async (seasonId)=>{
  const { error: unsetError } = await supabase.from('seasons').update({ is_current: false }).eq('is_current', true);
  if(unsetError) return toast(unsetError.message, true);
  const { error } = await supabase.from('seasons').update({ is_current: true }).eq('id', seasonId);
  if(error) return toast(error.message, true);
  toast('Temporada actual actualizada');
  await loadCurrentSeason();
  renderTemporadas();
};

function extractYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

  const { data: matches } = await supabase.from('matches').select('*').order('match_date', {ascending:true});
  main.innerHTML = `

        </div>
        <div class="row">
          <input id="nm-youtube" placeholder="Link de YouTube - Primer tiempo" />
          <input id="nm-youtube2" placeholder="Link de YouTube - Segundo tiempo" />
        </div>
        <div class="row">
          <select id="nm-uniform">
            <option value="uniforme_1">Uniforme 1 (negro y amarillo)</option>
            <option value="uniforme_2">Uniforme 2 (blanco y azul)</option>
          </select>
        </div>
        <div class="row">
          <button id="nm-search-yt" class="secondary">Buscar en YouTube del canal</button>
          <button id="nm-search-ig" class="secondary">Buscar en Instagram</button>
        </div>
        <div id="nm-suggestions" class="muted"></div>
        <button id="nm-save" style="margin-top:8px">Crear partido</button>
        <p class="muted">Al crear el partido se envía automáticamente la convocatoria a todos los jugadores.</p>
      </div>` : ''}
      <div id="matches-list"></div>
    </div>
    <div id="match-detail"></div>
  `;
  const matchCard = m => {
    const [dow, dnum] = m.match_date ? [new Date(m.match_date+'T00:00:00').toLocaleDateString('es-ES',{weekday:'short'}).toUpperCase(), new Date(m.match_date+'T00:00:00').getDate()] : ['FECHA','–'];
    return `
    <div class="panel match-card event-summary-row" style="cursor:pointer" onclick="window.__openMatch('${m.id}')">
      <div class="event-date-box"><div class="dow">${dow}</div><div class="num">${dnum}</div></div>
      <div>

        <div class="muted">${m.match_time?'🕒 '+m.match_time.slice(0,5)+' · ':''}${m.competition||'Copa Futbolgol'}${m.result ? ' · '+m.result : ''}</div>
      </div>
    </div>
  `;
  };
  // Próximos (el más cercano primero) aparte de los ya jugados (el más reciente primero).
  const today = new Date().toISOString().slice(0,10);
  const proximos = (matches||[]).filter(m=>m.match_date >= today).sort((a,b)=>a.match_date.localeCompare(b.match_date));
  const jugados = (matches||[]).filter(m=>m.match_date < today).sort((a,b)=>b.match_date.localeCompare(a.match_date));
  $('#matches-list').innerHTML = `
    <div id="par-proximos">${proximos.map(matchCard).join('') || '<p class="muted">No hay partidos próximos.</p>'}</div>
    <div id="par-jugados" style="display:none">${jugados.map(matchCard).join('') || '<p class="muted">Todavía no se ha jugado ningún partido.</p>'}</div>
  `;
  $('#nm-toggle')?.addEventListener('click', ()=>{
    const panel = $('#nm-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  $$('.tab-pill[data-par-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{
      $$('.tab-pill[data-par-tab]').forEach(x=> x.classList.toggle('active', x===b));
      $('#par-proximos').style.display = b.dataset.parTab === 'proximos' ? 'block' : 'none';
      $('#par-jugados').style.display = b.dataset.parTab === 'jugados' ? 'block' : 'none';
    });
  });

  if(canManageEvents()){
    $('#nm-search-yt').addEventListener('click', searchYouTube);
    $('#nm-search-ig').addEventListener('click', searchInstagram);
    $('#nm-save').addEventListener('click', async ()=>{
      const ytUrl = $('#nm-youtube').value.trim();
      const ytUrl2 = $('#nm-youtube2').value.trim();
      const payload = {
        match_date: $('#nm-date').value,
        match_time: $('#nm-time').value || null,
        opponent: $('#nm-opponent').value.trim(),
        competition: $('#nm-competition').value.trim(),
        location: $('#nm-location').value.trim(),
        location_url: $('#nm-location-url').value.trim() || null,
        result: $('#nm-result').value.trim(),
        instagram_url: $('#nm-instagram').value.trim() || null,
        youtube_url: ytUrl || null,
        youtube_video_id: extractYouTubeId(ytUrl),
        youtube_url_2: ytUrl2 || null,
        season_id: currentSeasonId(),
      };
      if(!payload.match_date || !payload.opponent){ toast('Fecha y rival son obligatorios', true); return; }
      const { data: newMatch, error } = await supabase.from('matches').insert(payload).select().single();
      if(error) return toast(error.message, true);
      // Convocatoria automática: los jugadores la ven de inmediato como notificación,
      // incluyendo el uniforme que les corresponde para este partido.
      const { error: cuError } = await supabase.from('call_ups').insert({
        type: 'partido',
        training_id: null,
        match_id: newMatch.id,
        event_date: newMatch.match_date,
        uniform: $('#nm-uniform').value,
        notes: null,
        created_by: profile.id,
      });
      if(cuError) toast('Partido creado, pero no se pudo lanzar la convocatoria: ' + cuError.message, true);
      else toast('Partido creado y convocatoria enviada a los jugadores');
      renderPartidos();
    });
  }
}

// YouTube Data API v3 — búsqueda de videos del canal del equipo
async function searchYouTube(){
  const box = $('#nm-suggestions');
  box.textContent = 'Buscando en YouTube…';
  try{
    const url = `https://www.googleapis.com/youtube/v3/search?key=${YOUTUBE_API_KEY}&channelId=${YOUTUBE_CHANNEL_ID}&part=snippet&order=date&maxResults=5&type=video`;
    const res = await fetch(url);
    const json = await res.json();
    if(json.error){ box.textContent = 'Error de YouTube API: '+json.error.message; return; }
    box.innerHTML = 'Resultados: ' + (json.items||[]).map(it=>{
      const vid = it.id.videoId;
      const title = it.snippet.title.replace(/'/g,"\\'");
      return `<button class="small secondary" onclick="document.getElementById('nm-youtube').value='https://youtu.be/${vid}'">${it.snippet.title}</button>`;
    }).join(' ') || 'sin resultados';
  }catch(e){ box.textContent = 'No se pudo conectar con YouTube API (revisa YOUTUBE_API_KEY / CHANNEL_ID).'; }
}

// Instagram Graph API — vía Edge Function proxy (evita exponer el token y problemas de CORS)
async function searchInstagram(){
  const box = $('#nm-suggestions');
  box.textContent = 'Buscando en Instagram…';
  try{
    const res = await fetch(INSTAGRAM_PROXY_URL);
    const json = await res.json();
    if(json.error){ box.textContent = 'Error de Instagram API: '+json.error; return; }
    box.innerHTML = 'Resultados: ' + (json.data||[]).slice(0,5).map(it=>{
      return `<button class="small secondary" onclick="document.getElementById('nm-instagram').value='${it.permalink}'">${(it.caption||'Post').slice(0,30)}</button>`;
    }).join(' ') || 'sin resultados';
  }catch(e){ box.textContent = 'No se pudo conectar con el proxy de Instagram (revisa INSTAGRAM_PROXY_URL y la Edge Function).'; }
}

window.__openMatch = async (matchId)=>{
  const { data: m } = await supabase.from('matches').select('*').eq('id', matchId).single();
  const { data: stats } = await supabase.from('player_match_stats').select('*, players(full_name, jersey_number)').eq('match_id', matchId);
  const { data: evals } = await supabase.from('evaluations').select('*').eq('match_id', matchId);
  const { data: comments } = await supabase.from('match_comments').select('*, players(full_name, jersey_number)').eq('match_id', matchId).order('created_at');
  const { data: matchCallUp } = await supabase.from('call_ups').select('*').eq('match_id', matchId).maybeSingle();
  const byPlayer = Object.fromEntries((stats||[]).map(s=>[s.player_id, s]));
  const evalByPlayer = Object.fromEntries((evals||[]).map(e=>[e.player_id, e]));

  // Sugerencia automática de "Figura del partido" según la calificación que
  // le puso el DT (promedio de técnica/física/táctica/mental): el jugador
  // con el promedio más alto queda pre-seleccionado en el select de abajo
  // si todavía no se ha elegido ninguno a mano — el DT siempre puede
  // cambiarlo antes de guardar (su elección manual manda sobre la sugerencia).
  const ratingAvg = (e)=>{
    const vals = [e?.technique, e?.physical, e?.tactical, e?.mental].map(Number).filter(v=>!isNaN(v) && v>0);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  };
  const suggestedMvp = Object.entries(evalByPlayer)
    .map(([pid, e])=> ({ pid, avg: ratingAvg(e) }))
    .filter(x=>x.avg !== null)
    .sort((a,b)=> b.avg - a.avg || (playersCache.find(p=>p.id===a.pid)?.jersey_number||0) - (playersCache.find(p=>p.id===b.pid)?.jersey_number||0))[0];
  // Organización en 3 grupos, igual en la tabla de carga del cuerpo técnico que
  // en la vista de solo lectura del jugador: 1) titulares (arrancaron el
  // partido), 2) suplentes que sí jugaron (entraron pero no fueron titulares),
  // 3) jugadores que no participaron (sin minutos registrados). Dentro de cada
  // grupo, ordenados por número de camiseta.
  const matchGroup = (p)=>{
    const s = byPlayer[p.id];
    if(s?.started) return 0;
    if(s && s.minutes_played > 0) return 1;
    return 2;
  };
  const sortedMatchPlayers = playersCache.filter(p=>p.active).slice().sort((a,b)=>{
    const ga = matchGroup(a), gb = matchGroup(b);
    if(ga !== gb) return ga - gb;
    return (a.jersey_number||0) - (b.jersey_number||0);
  });

  // Vista exclusiva: al abrir un partido se oculta la lista completa (y el
  // panel "Nuevo partido") para que solo se vea la información de este
  // partido; el botón "Volver" restaura la lista.
  const listView = document.getElementById('partidos-list-view');
  if(listView) listView.style.display = 'none';

  const detail = $('#match-detail');
  detail.innerHTML = `
    <div class="panel">
      <button class="secondary small" onclick="window.__closeMatch()">← Volver a todos los partidos</button>
      <h3>${fmtDate(m.match_date)}${m.match_time?' · '+m.match_time.slice(0,5):''} vs ${m.opponent} ${m.result?('· '+m.result):''}</h3>
      ${(m.location || m.location_url) ? `<div class="muted">${m.location ? '📍 '+m.location : ''} ${mapsLinkAuto(m.location, m.location_url)}</div>` : ''}
      ${m.mvp_player_id ? `<div class="mvp-badge">${playerAvatarHtml(m.mvp_player_id,'mvp-badge-photo')} 🏅 Figura del partido: ${playerName(m.mvp_player_id)}</div>` : ''}
      <div class="embed-wrap">
        ${m.youtube_video_id ? `<iframe width="320" height="180" src="https://www.youtube.com/embed/${m.youtube_video_id}" allowfullscreen></iframe>` : ''}
        ${m.instagram_url ? `<blockquote class="instagram-media" data-instgrm-permalink="${m.instagram_url}" style="width:320px"></blockquote>` : ''}
      </div>
      ${(m.youtube_url || m.youtube_url_2) ? `
      <div class="row" style="margin:8px 0">
        ${m.youtube_url ? `<button class="secondary" onclick="window.open('${m.youtube_url.replace(/'/g,"\\'")}','_blank')">▶ Ver primer tiempo</button>` : ''}
        ${m.youtube_url_2 ? `<button class="secondary" onclick="window.open('${m.youtube_url_2.replace(/'/g,"\\'")}','_blank')">▶ Ver segundo tiempo</button>` : ''}
      </div>` : ''}
      ${(m.photo_url_1 || m.photo_url_2) ? `
      <div class="row" style="margin:8px 0;flex-wrap:wrap">
        ${m.photo_url_1 ? `<a href="${m.photo_url_1}" target="_blank" rel="noopener"><img src="${m.photo_url_1}" alt="Foto del partido" style="max-width:160px;max-height:160px;border-radius:8px;object-fit:cover" /></a>` : ''}
        ${m.photo_url_2 ? `<a href="${m.photo_url_2}" target="_blank" rel="noopener"><img src="${m.photo_url_2}" alt="Foto del partido" style="max-width:160px;max-height:160px;border-radius:8px;object-fit:cover" /></a>` : ''}
      </div>` : ''}

      ${canManageEvents() ? `

        const hasEval = e.technique || e.physical || e.tactical || e.mental;
        const avg = hasEval ? (((e.technique||0)+(e.physical||0)+(e.tactical||0)+(e.mental||0))/4) : null;
        const estado = s.started ? 'Titular' : (s.minutes_played > 0 ? 'Suplente' : 'No participó');
        return `<tr><td>#${p.jersey_number}</td><td>${p.full_name}</td><td>${estado}</td><td>${s.minutes_played||0}</td><td>${s.goals||0}</td><td>${s.assists||0}</td><td>${s.yellow_cards||0}</td><td>${s.red_cards||0}</td><td>${e.technique||'-'}</td><td>${e.physical||'-'}</td><td>${e.tactical||'-'}</td><td>${e.mental||'-'}</td><td>${avg?avg.toFixed(1)+' / 5':'-'}</td></tr>`;
      }).join('')||'<tr><td colspan="13" class="muted">Sin jugadores activos</td></tr>'}</tbody></table>
      `}

      <h4>Comentarios del partido</h4>
      <div id="comments-list">${(comments||[]).map(c=>`
        <div class="comment"><div class="meta">#${c.players.jersey_number} ${c.players.full_name} · ${new Date(c.created_at).toLocaleString('es-ES')}</div>${c.comment_text}</div>
      `).join('') || '<p class="muted">Sin comentarios aún.</p>'}</div>
      ${profile.player_id ? `
        <textarea id="new-comment" placeholder="Escribe tu comentario sobre el partido…"></textarea>
        <button id="save-comment">Comentar</button>
      ` : ''}
    </div>
  `;

  // load instagram embed script (official, público)
  if(m.instagram_url && !window.instgrm){
    const s = document.createElement('script'); s.src = 'https://www.instagram.com/embed.js'; s.async = true;
    document.body.appendChild(s);
  } else if(window.instgrm){ window.instgrm.Embeds.process(); }

  // Máximo 11 titulares a la vez: si ya hay 11 marcados, desmarca el que se acaba de
  // intentar marcar y avisa. Es una validación en pantalla; cada fila igual se guarda
  // por separado con su botón "Guardar".
  if(canManageEvents()){
    $$('.f-started').forEach(cb=> cb.addEventListener('change', ()=>{
      if(cb.checked && $$('.f-started:checked').length > 11){
        cb.checked = false;
        toast('Ya hay 11 titulares seleccionados (el máximo permitido)', true);
      }
    }));
  }

  if(profile.player_id){
    $('#save-comment').addEventListener('click', async ()=>{
      const text = $('#new-comment').value.trim();
      if(!text) return;
      const { error } = await supabase.from('match_comments').insert({ match_id: matchId, player_id: profile.player_id, comment_text: text });
      if(error) return toast(error.message, true);
      window.__openMatch(matchId);
    });
  }
};

window.__saveMatch = async (matchId)=>{

    match_date,
    match_time: $('#em-time').value || null,

    competition: $('#em-competition').value.trim(),
    location: $('#em-location').value.trim(),
    location_url: $('#em-location-url').value.trim() || null,
    result: $('#em-result').value.trim(),
    youtube_url: ytUrl || null,
    youtube_video_id: extractYouTubeId(ytUrl),
    youtube_url_2: ytUrl2 || null,
  };
  // El selector de "Figura del partido" solo existe para cuerpo técnico/Comité

  const mvpEl = $('#em-mvp');

  const path = `${matchId}/foto${slot}-${Date.now()}.${ext}`;

// ---------------- FORMACIÓN (pizarrón táctico por partido) ----------------
// Solo cuerpo técnico y Comité ALS (canManage(), no canManageEvents()): es
// una herramienta táctica interna, los jugadores no la ven. Una fila en
// "lineups" por partido, y una fila en "lineup_players" por cada jugador ya
// ubicado en la cancha (con su posición en % de ancho/alto). Los jugadores
// "disponibles" (banca, todavía sin ubicar) salen de quién confirmó
// asistencia en la Convocatoria de ese partido; si todavía nadie ha
// respondido, se muestra el plantel activo completo como respaldo.
async function ensureLineup(matchId){
  const { data: existing } = await supabase.from('lineups').select('*').eq('match_id', matchId).maybeSingle();
  if(existing) return existing;
  const { data: created, error } = await supabase.from('lineups').insert({ match_id: matchId, created_by: profile.id }).select().single();
  if(error){ toast(error.message, true); return null; }
  return created;
}

window.__openLineup = async (matchId)=>{
  const panel = $('#lineup-panel');
  if(!panel) return;
  currentLineupMatchId = matchId;
  panel.innerHTML = '<p class="muted">Cargando formación…</p>';

  const [{ data: lineup }, { data: callUp }] = await Promise.all([
    supabase.from('lineups').select('*').eq('match_id', matchId).maybeSingle(),
    supabase.from('call_ups').select('id').eq('match_id', matchId).maybeSingle(),
  ]);

  let confirmedIds = [];
  if(callUp){
    const { data: responses } = await supabase.from('call_up_responses').select('player_id').eq('call_up_id', callUp.id).eq('response', 'asiste');
    confirmedIds = (responses||[]).map(r=>r.player_id);
  }

  let placed = [];
  if(lineup){
    const { data: lp } = await supabase.from('lineup_players').select('*').eq('lineup_id', lineup.id);
    placed = lp || [];
  }

  const poolIds = new Set(confirmedIds.length ? confirmedIds : playersCache.filter(p=>p.active && !p.injured).map(p=>p.id));
  // Un jugador ya ubicado en la cancha se sigue mostrando aunque después haya
  // dejado de estar en el "pool" (por ejemplo, si cambió su respuesta).
  placed.forEach(pp=> poolIds.add(pp.player_id));
  const placedIds = new Set(placed.map(pp=>pp.player_id));
  const bench = [...poolIds]
    .filter(id=>!placedIds.has(id))
    .map(id=>playersCache.find(p=>p.id===id))
    .filter(Boolean)
    .sort((a,b)=>(a.jersey_number||0)-(b.jersey_number||0));

  const firstName = (fullName)=> (fullName||'').split(' ')[0];

  panel.innerHTML = `
    <div class="row">
      <input id="lu-formation" placeholder="Esquema (ej. 4-4-2)" value="${(lineup?.formation_label||'').replace(/"/g,'&quot;')}" style="max-width:220px" />
      <button class="small secondary" onclick="window.__saveFormationLabel('${matchId}')">Guardar nombre</button>
      <button class="small danger" onclick="window.__clearLineup('${matchId}')">Vaciar cancha</button>
    </div>
    <p class="muted">Arrastra a un jugador de "Suplentes" hacia la cancha para ponerlo de titular. Arrástralo desde la cancha hacia afuera para devolverlo a suplentes. ${confirmedIds.length ? 'Los suplentes son quienes confirmaron asistencia en Convocatoria y todavía no están en la cancha.' : 'Todavía nadie confirmó asistencia en Convocatoria — por ahora se muestra todo el plantel activo.'}</p>
    <div class="lineup-wrap">
      <div>
        <div class="muted" style="margin-bottom:6px;font-weight:700">👕 Titulares — ${placed.length}/11 en la cancha</div>
        <div class="lineup-pitch" id="lineup-pitch">
          <svg class="lineup-lines" viewBox="0 0 300 450" preserveAspectRatio="none">
            <rect x="4" y="4" width="292" height="442" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <line x1="4" y1="225" x2="296" y2="225" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <circle cx="150" cy="225" r="40" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <rect x="70" y="4" width="160" height="60" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <rect x="70" y="386" width="160" height="60" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
          </svg>
          ${placed.map(pp=>{
            const p = playersCache.find(pl=>pl.id===pp.player_id);
            if(!p) return '';
            return `<div class="lineup-chip" style="left:${pp.pos_x}%;top:${pp.pos_y}%" data-pid="${p.id}">
              <div class="num">${p.jersey_number}</div>
              <div class="name">${firstName(p.full_name)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div>
        <div class="muted" style="margin-bottom:6px;font-weight:700">🔄 Suplentes</div>
        <div class="lineup-bench" id="lineup-bench">
          ${bench.length ? bench.map(p=>`
            <div class="lineup-bench-chip" data-pid="${p.id}"><div class="num">${p.jersey_number}</div>${firstName(p.full_name)}</div>
          `).join('') : '<span class="muted">No hay suplentes por ubicar.</span>'}
        </div>
      </div>
    </div>
  `;

  $$('.lineup-chip', panel).forEach(chip=> chip.addEventListener('pointerdown', e=> startLineupDrag(e, chip.dataset.pid)));
  $$('.lineup-bench-chip', panel).forEach(chip=> chip.addEventListener('pointerdown', e=> startLineupDrag(e, chip.dataset.pid)));
};

function startLineupDrag(e, playerId){
  e.preventDefault();
  const p = playersCache.find(pl=>pl.id===playerId);
  const ghost = document.createElement('div');
  ghost.className = 'lineup-drag-ghost';
  ghost.textContent = p ? p.jersey_number : '';
  document.body.appendChild(ghost);
  lineupDragState = { playerId, ghost };
  moveLineupGhost(e);
  document.addEventListener('pointermove', onLineupDragMove);
  document.addEventListener('pointerup', onLineupDragEnd, { once: true });
}
function moveLineupGhost(e){
  if(!lineupDragState) return;
  lineupDragState.ghost.style.left = e.clientX + 'px';
  lineupDragState.ghost.style.top = e.clientY + 'px';
}
function onLineupDragMove(e){ moveLineupGhost(e); }
async function onLineupDragEnd(e){
  document.removeEventListener('pointermove', onLineupDragMove);
  if(!lineupDragState) return;
  const { playerId, ghost } = lineupDragState;
  ghost.remove();
  lineupDragState = null;
  const pitch = document.getElementById('lineup-pitch');
  const matchId = currentLineupMatchId;
  if(!pitch || !matchId) return;
  const rect = pitch.getBoundingClientRect();
  const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
  if(inside){
    const x = Math.max(3, Math.min(97, ((e.clientX - rect.left) / rect.width) * 100));
    const y = Math.max(4, Math.min(96, ((e.clientY - rect.top) / rect.height) * 100));
    await window.__placeLineupPlayer(matchId, playerId, x, y);
  } else {
    await window.__removeLineupPlayer(matchId, playerId);
  }
}

window.__placeLineupPlayer = async (matchId, playerId, x, y)=>{
  const lineup = await ensureLineup(matchId);
  if(!lineup) return;
  const { error } = await supabase.from('lineup_players')
    .upsert({ lineup_id: lineup.id, player_id: playerId, pos_x: x, pos_y: y }, { onConflict: 'lineup_id,player_id' });
  if(error){ toast(error.message, true); return; }
  window.__openLineup(matchId);
};

window.__removeLineupPlayer = async (matchId, playerId)=>{
  const lineup = await ensureLineup(matchId);
  if(!lineup) return;
  await supabase.from('lineup_players').delete().eq('lineup_id', lineup.id).eq('player_id', playerId);
  window.__openLineup(matchId);
};

window.__clearLineup = async (matchId)=>{
  const lineup = await ensureLineup(matchId);
  if(!lineup) return;
  const { error } = await supabase.from('lineup_players').delete().eq('lineup_id', lineup.id);
  if(error){ toast(error.message, true); return; }
  toast('Cancha vaciada');
  window.__openLineup(matchId);
};

window.__saveFormationLabel = async (matchId)=>{
  const lineup = await ensureLineup(matchId);
  if(!lineup) return;
  const { error } = await supabase.from('lineups')

  equipacionItemsCache = items || [];

  if(itemsErr){
    // Causa más común la primera vez que se abre este módulo: todavía no se
    // ejecutó en Supabase el SQL que crea las tablas store_items/store_orders.
    $('#equipacion-catalog').innerHTML = `<p class="muted" style="color:var(--danger)">No se pudo cargar la tienda (${itemsErr.message}). Si es la primera vez, revisa que se haya ejecutado el SQL de store_items/store_orders en Supabase.</p>`;
  } else {
    renderEquipacionCatalog();
  }
  renderEquipacionCart();

  const myOrdersEl = $('#equipacion-my-orders');
  if(!myOrders || !myOrders.length){
    myOrdersEl.innerHTML = '<p class="muted">Aún no has enviado ninguna solicitud.</p>';
  } else {
    myOrdersEl.innerHTML = `<div class="table-scroll"><table><thead><tr><th>Ítem</th><th>Variante</th><th>Cant.</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>
      ${myOrders.map(o=>`<tr>
        <td>${o.store_items?.name || '—'}</td>
        <td>${o.variant || (o.personalization ? personalizationSummary(o.personalization) : '—')}</td>
        <td>${o.quantity}</td>
        <td><span class="badge ${storeOrderStatusBadgeClass(o.status)}">${storeOrderStatusLabel(o.status)}</span></td>
        <td>${new Date(o.created_at).toLocaleDateString('es-ES')}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
  }

  if(isStoreStaff()){
    await renderEquipacionAdmin();
    await renderEquipacionStaffOrders();
  }
}

function personalizationSummary(p){
  if(!p) return '—';
  const parts = [];
  if(p.nombre) parts.push(p.nombre);
  if(p.numero) parts.push('#'+p.numero);
  if(p.bandera) parts.push(p.bandera);
  if(p.equipo_profesional) parts.push(p.equipo_profesional);
  return parts.join(' · ') || '—';
}

function renderEquipacionCatalog(){
  const el = $('#equipacion-catalog');
  if(!equipacionItemsCache.length){
    el.innerHTML = '<p class="muted">El Comité todavía no ha cargado productos en la tienda.</p>';
    return;
  }
  const categories = ['todos', ...new Set(equipacionItemsCache.map(i=>i.category))];
  const shown = equipacionCategoryFilter === 'todos' ? equipacionItemsCache : equipacionItemsCache.filter(i=>i.category===equipacionCategoryFilter);
  el.innerHTML = `
    <div class="tabs" id="equipacion-filters">
      ${categories.map(c=>`<button data-cat="${c}" class="${c===equipacionCategoryFilter?'active':''}">${c==='todos'?'Todos':(STORE_CATEGORY_LABELS[c]||c)}</button>`).join('')}
    </div>
    <div class="cards">
      ${shown.map(i=>equipacionItemCardHtml(i)).join('')}
    </div>
  `;
  $$('#equipacion-filters button').forEach(b=> b.addEventListener('click', ()=>{
    equipacionCategoryFilter = b.dataset.cat;
    renderEquipacionCatalog();
  }));
  shown.forEach(i=>{
    const addBtn = document.getElementById(`eq-add-${i.id}`);
    if(addBtn) addBtn.addEventListener('click', ()=> addEquipacionToCart(i));
  });
}

function equipacionItemCardHtml(i){
  const icon = STORE_CATEGORY_ICONS[i.category] || '🛍️';
  const priceHtml = i.price != null ? fmtMoney(i.price) : 'Precio por confirmar';
  const variantHtml = (i.variant_options && i.variant_options.length)
    ? `<select id="eq-variant-${i.id}">${i.variant_options.map(v=>`<option value="${v}">${v}</option>`).join('')}</select>`
    : '';
  const personalizationHtml = i.requires_personalization ? `
    <input id="eq-perso-nombre-${i.id}" placeholder="Nombre para el guayo" />
    <input id="eq-perso-numero-${i.id}" placeholder="Número" />
    <input id="eq-perso-bandera-${i.id}" placeholder="Bandera (país)" />
    <input id="eq-perso-equipo-${i.id}" placeholder="Equipo profesional colombiano" />
  ` : '';
  return `
    <div class="card">
      ${i.image_url
        ? `<img src="${i.image_url}" alt="${i.name}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px" />`
        : `<div style="font-size:40px;text-align:center;margin-bottom:6px">${icon}</div>`}
      <div style="font-weight:700;margin-bottom:2px">${i.name}</div>
      <div class="label" style="margin-bottom:8px">${priceHtml}</div>

      ${variantHtml}
      ${personalizationHtml}
      <button class="small" id="eq-add-${i.id}" style="width:100%;margin-top:4px">${i.requires_personalization ? 'Agregar personalización' : 'Agregar a mi pedido'}</button>
    </div>
  `;
}

function addEquipacionToCart(item){
  const variantSel = document.getElementById(`eq-variant-${item.id}`);
  const variant = variantSel ? variantSel.value : null;
  let personalization = null;
  if(item.requires_personalization){
    const nombre = document.getElementById(`eq-perso-nombre-${item.id}`)?.value.trim();
    const numero = document.getElementById(`eq-perso-numero-${item.id}`)?.value.trim();
    const bandera = document.getElementById(`eq-perso-bandera-${item.id}`)?.value.trim();
    const equipo_profesional = document.getElementById(`eq-perso-equipo-${item.id}`)?.value.trim();
    if(!nombre){ toast('Escribe el nombre para personalizar los guayos', true); return; }
    personalization = { nombre, numero, bandera, equipo_profesional };
  }
  equipacionCart.push({ item_id: item.id, name: item.name, price: item.price, variant, personalization, quantity: 1 });
  renderEquipacionCart();
  toast(`${item.name} agregado a tu pedido`);
}

function renderEquipacionCart(){
  const el = $('#equipacion-cart');
  if(!equipacionCart.length){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="panel" style="border:2px solid var(--brand)">
      <h3>🛍️ Tu pedido (${equipacionCart.length})</h3>
      ${equipacionCart.map((c,idx)=>`
        <div class="notify-item">
          <div>${c.name}${c.variant ? ` · ${c.variant}` : ''}${c.personalization ? ` · ${personalizationSummary(c.personalization)}` : ''}</div>
          <button class="small secondary" data-remove="${idx}">Quitar</button>
        </div>
      `).join('')}
      <button id="equipacion-submit-order" style="width:100%;margin-top:10px">Enviar pedido al Comité</button>
    </div>
  `;
  $$('[data-remove]').forEach(b=> b.addEventListener('click', ()=>{
    equipacionCart.splice(Number(b.dataset.remove), 1);
    renderEquipacionCart();
  }));
  $('#equipacion-submit-order')?.addEventListener('click', submitEquipacionOrder);
}

async function submitEquipacionOrder(){
  if(!equipacionCart.length) return;
  const btn = $('#equipacion-submit-order');
  btn.disabled = true;
  const rows = equipacionCart.map(c=>({
    item_id: c.item_id, user_id: profile.id, variant: c.variant || null,
    personalization: c.personalization || null, quantity: c.quantity, status: 'pendiente',
  }));
  const { error } = await supabase.from('store_orders').insert(rows);
  if(error){ toast('No se pudo enviar el pedido: ' + error.message, true); btn.disabled = false; return; }
  toast('Pedido enviado. El Comité te contactará para confirmar precio y entrega.');
  await renderEquipacion();
}

  const { error: upErr } = await supabase.storage.from('match-photos').upload(path, file, { upsert: true });

  const { error } = await supabase.from('store_items').update({ image_url: pub.publicUrl }).eq('id', id);
  if(error){ toast(error.message, true); return; }

// ---------------- CONVOCATORIA (a entrenamiento o a partido) ----------------
const UNIFORM_LABELS = { uniforme_1: 'Uniforme 1 (negro y amarillo)', uniforme_2: 'Uniforme 2 (blanco y azul)' };

// El cierre de la convocatoria es 3 horas antes de la hora real del evento
// (la del entrenamiento o la del partido), no un horario fijo. Si por algún
// motivo el entrenamiento/partido no tiene hora registrada, se usa 8:00pm
// como respaldo para no dejar la convocatoria sin fecha de cierre.
function callUpEventDateTime(c){
  const timeStr = (c.type === 'partido' ? c.matches?.match_time : c.trainings?.start_time) || '20:00:00';
  return new Date(`${c.event_date}T${timeStr}`);
}
function callUpDeadline(c){
  const d = callUpEventDateTime(c);
  d.setHours(d.getHours() - 3);
  return d;
}
function isCallUpOpen(c){ return new Date() < callUpDeadline(c); }
function fmtDeadline(c){
  return callUpDeadline(c).toLocaleString('es-ES', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

// Convocatorias abiertas que el jugador todavía no respondió — usado para
// la notificación en el Dashboard y la insignia del menú "Convocatoria".
async function getPendingCallUpsForPlayer(){
  if(!profile?.player_id) return [];
  // Un jugador lesionado no es convocable: no se le muestran convocatorias
  // pendientes ni se le cuenta en la insignia del menú.
  const me = playersCache.find(p=>p.id===profile.player_id);
  if(me?.injured) return [];
  const [{data: callUps}, {data: myResponses}] = await Promise.all([
    supabase.from('call_ups').select('*, matches(opponent,match_time), trainings(start_time)').order('event_date', {ascending:true}),
    supabase.from('call_up_responses').select('call_up_id,response').eq('player_id', profile.player_id),
  ]);
  const answered = new Set((myResponses||[]).filter(r=>r.response).map(r=>r.call_up_id));
  return (callUps||[]).filter(c => isCallUpOpen(c) && !answered.has(c.id));
}

// Banner de notificación en el Dashboard del jugador: solo la próxima
// convocatoria de partido y la próxima de entrenamiento (no todas las pendientes,
// para no saturar el dashboard — el resto se ve completo en "Convocatoria").
async function renderPlayerNotifications(){
  const container = $('#notify-banner');
  if(!container) return;
  const me = playersCache.find(p=>p.id===profile.player_id);
  if(me?.injured){
    container.innerHTML = `
      <div class="notify-banner">
        <h3>🩹 Te encuentras lesionado</h3>
        <p class="muted">El cuerpo técnico te marcó como lesionado, así que no te llegarán convocatorias a partidos ni entrenamientos hasta que te recuperes.</p>
      </div>
    `;
    return;
  }
  const pending = await getPendingCallUpsForPlayer();
  if(!pending.length){ container.innerHTML = ''; return; }
  // Para no saturar el Dashboard, solo se muestra la convocatoria más
  // próxima en el tiempo (sea de partido o de entreno) — si hay más
  // pendientes, el aviso de abajo manda a la sección "Convocatoria" a verlas.
  const shown = [...pending].sort((a,b)=>a.event_date.localeCompare(b.event_date)).slice(0,1);
  container.innerHTML = `
    <div class="notify-banner">
      <h3>📣 Tienes ${pending.length} convocatoria${pending.length>1?'s':''} por responder</h3>
      <p class="muted">Responde antes de que falten 3 horas para el entrenamiento o el partido, para que el cuerpo técnico pueda organizarlo.</p>
      ${shown.map(c=>{
        const label = c.type === 'partido' ? `Partido vs ${c.matches?.opponent || '-'}` : 'Entrenamiento';
        return `
          <div class="notify-item">
            <div><strong>${label}</strong> · ${fmtDate(c.event_date)} <span class="muted">· cierra ${fmtDeadline(c)}</span></div>
            <div>
              <button class="small" onclick="window.__respondCallUp('${c.id}','asiste')">Sí, asisto</button>
              <button class="small secondary" onclick="window.__respondCallUp('${c.id}','no_asiste')">No puedo</button>
            </div>
          </div>
        `;
      }).join('')}
      ${pending.length > shown.length ? `<p class="muted">Tienes más convocatorias pendientes — entra a "Convocatoria" para verlas todas.</p>` : ''}
    </div>
  `;
}

async function refreshConvocatoriaBadge(){
  const btn = document.querySelector('.nav-btn[data-view="convocatoria"]');
  if(!btn) return;

    <div id="callup-form-wrap"></div>
