       barra lateral/inferior de navegación, y el amarillo del equipo como
       acento en botones y estados activos. El login conserva el fondo
       oscuro con foto real (ver .retro-hero), igual que en la lámina "Acceso". */
    --bg:#F5F5F2; --panel:#FFFFFF; --panel2:#F1F0ED; --border:#E6E3DC;
    --text:#17140F; --muted:#726C5E; --accent:#1AA260; --accent2:#3B82F6;
    --warn:#E8A317; --danger:#E6453C;
    /* Colores del equipo: Abraham Lincoln FC (negro y amarillo) */
    --brand:#F4C515; --brand-dark:#141210;
    --poster-red:#e6604f; --poster-blue:#5b9bd9;
    /* "Chrome" de navegación (sidebar, bottom-tabbar, headers de admin) —
       siempre negro, como en todas las láminas, independiente del fondo
       claro del contenido. */
    --chrome:#141210; --chrome-text:#F2ECE0; --chrome-border:#2a271e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Baloo 2',-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:500;background:var(--bg);color:var(--text)}
  .display-font{font-family:'Baloo 2',sans-serif;font-weight:800}

  @keyframes float-ball{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-14px) rotate(18deg)}
  }
  .floating-ball{display:inline-block;animation:float-ball 2.6s ease-in-out infinite}

  /* Ilustración genérica de "jugadores" (pictogramas) que se usaba junto al
     login antes de tener fotos reales del equipo. Ahora que el fondo del
     login es la foto real del equipo, esta ilustración se deja oculta para
     no competir visualmente con la foto (el HTML se conserva sin usar). */
  .login-illustration{display:none !important}

    /* Degradado oscuro para que el formulario resalte sobre la foto */

    background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.55) 45%, rgba(10,10,9,.94) 100%);

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:var(--chrome)}
  .login-box{position:relative;z-index:1;padding:32px 28px;width:340px;text-align:center}
  .login-crest-ring{width:96px;height:96px;border-radius:50%;border:3px solid var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;background:rgba(255,255,255,.04)}
  .login-crest{width:66px;height:66px;object-fit:contain;display:block;margin:0;filter:none}
  .login-team-photo-bg{width:100%;height:118px;border-radius:12px;margin:0 0 18px;background-position:center 30%;border:1px solid rgba(255,255,255,.14)}
  .login-box h1{font-size:22px;margin:0 0 4px;letter-spacing:0;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800}
  .login-box p{color:#c9c3b4;font-size:13px;margin:0 0 22px;text-align:center}
  .login-field-label{display:block;text-align:left;font-size:12px;color:#c9c3b4;margin:0 0 6px;font-weight:600}
  .login-input-wrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:0 10px;margin-bottom:14px}
  #login-screen .login-input-wrap input{background:transparent;border:none;margin:0;padding:10px 0}
  .login-input-icon{font-size:15px;flex-shrink:0;line-height:1}
  .login-divider{border:none;border-top:1px solid rgba(255,255,255,.14);margin:18px 0 12px}
  .login-footnote{color:#8a8477;font-size:11.5px;text-align:center;margin:0}
  #login-screen input,#login-screen select,#login-screen textarea{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
  #login-screen ::placeholder{color:#8a8477}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  input,select,textarea{width:100%;padding:9px 10px;margin-bottom:12px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
  button{cursor:pointer;padding:10px 16px;border-radius:10px;border:none;background:var(--brand);color:var(--brand-dark);font-weight:700;text-transform:none;letter-spacing:0;font-size:14px;font-family:'Baloo 2',sans-serif}
  button.secondary{background:var(--panel);color:var(--text);border:2px solid var(--brand)}
  button.danger{background:var(--danger);color:white}
  .card-select{width:68px;height:46px;font-size:19px;font-weight:800;text-align:center;text-align-last:center;border-radius:8px;border-width:2px;border-style:solid}
  .card-select-yellow{background:#fdf3d9;color:#8a6500;border-color:var(--warn)}
  .card-select-red{background:#fbe4e2;color:var(--danger);border-color:var(--danger)}
  button.small{padding:7px 12px;font-size:12.5px}
  #app{display:none;min-height:100vh;grid-template-columns:220px 1fr}
  #app.active{display:grid}
  nav{background:var(--chrome);border-right:1px solid var(--chrome-border);padding:18px 12px;display:flex;flex-direction:column;position:relative}
  .nav-rainbow-bar{position:absolute;top:0;left:0;right:0;height:4px;background:var(--brand);pointer-events:none}
  nav h2{font-size:16px;margin:4px 8px 18px;color:var(--chrome-text);font-family:'Baloo 2',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .nav-crest{width:30px;height:30px;object-fit:contain;flex-shrink:0}
  nav .who{font-size:12px;color:#9a9486;margin:0 8px 16px}
  nav button.nav-btn{background:transparent;color:var(--chrome-text);text-align:left;margin-bottom:4px;font-weight:500;position:relative;border-radius:8px;transition:background .15s}
  nav button.nav-btn:hover{background:rgba(255,255,255,.08)}
  nav button.nav-btn.active{background:var(--brand);color:var(--brand-dark);font-weight:700;box-shadow:none}
  nav .logout{margin-top:auto}
  .nav-badge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;text-align:center}
  .notify-banner{background:var(--panel2);border:2px solid var(--poster-blue);border-radius:10px;padding:16px;margin-bottom:20px}
  .notify-banner h3{margin:0 0 4px}
  .notify-item{background:var(--panel);border-radius:8px;padding:10px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  main{padding:24px;overflow-y:auto;max-height:100vh}
  h2.section-title{margin-top:0;display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;letter-spacing:0;font-weight:800;font-size:26px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;transition:transform .15s,border-color .15s;box-shadow:0 1px 3px rgba(20,18,16,.04)}
  .card:hover{transform:translateY(-2px);border-color:var(--brand)}
  .card .num{font-size:24px;font-weight:800;font-family:'Baloo 2',sans-serif}

     que .dash-hero, pero con la info real del evento (estilo lámina "Inicio"):
     etiqueta, rival/fecha, datos con iconos y botón de acción, alineados abajo
     a la izquierda sobre la foto. */
  .dash-hero-content{position:relative;z-index:1;height:100%;min-height:240px;padding:20px 22px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
  .dash-hero-eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);text-shadow:0 2px 6px rgba(0,0,0,.65)}
  .dash-hero-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:0;text-shadow:0 2px 6px rgba(0,0,0,.65)}
  .dash-hero-vs{font-size:16px;font-weight:700;color:#fff;margin-bottom:2px;text-shadow:0 2px 6px rgba(0,0,0,.65)}
  .dash-hero-meta{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#f2ece0;margin-bottom:10px;text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .dash-hero-btn{align-self:flex-start;background:var(--brand);color:var(--brand-dark);font-weight:800;padding:9px 18px;border-radius:8px;border:none;text-transform:none;letter-spacing:0;font-size:13.5px;cursor:pointer}
  @media (max-width:600px){
    .dash-hero-content{min-height:170px;padding:14px 16px}
    .dash-hero-title{font-size:18px}
    .dash-hero-vs{font-size:14px}
    .dash-hero-meta{font-size:11.5px}
  }

  /* Grid de estadísticas compactas con icono circular de color (estilo
     lámina "Inicio"): Jugadores activos / Recaudado / Gastado / Saldo en
     caja para Comité y cuerpo técnico. */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  .stat-chip-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;min-width:0}
  .stat-chip-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .stat-chip-icon.blue{background:#DEEAFE;color:var(--accent2)}
  .stat-chip-icon.green{background:#D9F2E3;color:var(--accent)}
  .stat-chip-icon.red{background:#FBE1DE;color:var(--danger)}
  .stat-chip-icon.gold{background:#FBEFC6;color:#92700A}
  .stat-chip-body{min-width:0}
  .stat-chip-body .num{font-size:19px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-chip-body .label{font-size:11.5px;color:var(--muted)}
  @media (max-width:400px){
    .stat-grid{gap:8px}
    .stat-chip-card{padding:10px;gap:8px}
    .stat-chip-icon{width:32px;height:32px;font-size:14px}
    .stat-chip-body .num{font-size:15.5px}
  }

  /* Tarjeta negra "Saldo en caja" (estilo lámina "Finanzas"): icono +
     etiqueta + monto grande en amarillo, con un balón decorativo de fondo. */
  .balance-hero{
    position:relative;overflow:hidden;background:var(--chrome);border-radius:16px;
    padding:18px 20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;
    color:#fff;
  }
  .balance-hero::after{
    content:'⚽';position:absolute;right:-6px;bottom:-22px;font-size:110px;opacity:.08;
    pointer-events:none;line-height:1;
  }
  .balance-hero-icon{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative;z-index:1}
  .balance-hero-label{font-size:13px;color:#cfc9ba;margin-bottom:3px;position:relative;z-index:1}
  .balance-hero-amount{font-size:26px;font-weight:800;color:var(--brand);font-family:'Baloo 2',sans-serif;position:relative;z-index:1;white-space:nowrap}
  .balance-hero-chevron{margin-left:auto;color:#cfc9ba;font-size:20px;position:relative;z-index:1}

  /* Lista de accesos con icono + chevron (estilo lámina): fila blanca dentro
     de una tarjeta, usada para los menús de Finanzas y similares. */
  .link-list{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px}
  .link-row{
    width:100%;display:flex;align-items:center;gap:12px;background:transparent;
    border:none;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;
    color:var(--text);font-weight:600;font-size:14.5px;text-align:left;text-transform:none;
    letter-spacing:0;font-family:inherit;
  }
  .link-row:last-child{border-bottom:none}
  .link-row:hover{background:var(--panel2)}
  .link-row-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}
  .link-row-chevron{margin-left:auto;color:var(--muted);font-size:18px}
  .section-back-btn{background:transparent;color:var(--text);border:none;padding:6px 0;margin-bottom:14px;font-weight:700;font-size:14.5px;text-transform:none;letter-spacing:0;font-family:'Baloo 2',sans-serif}

  /* En celular se ven las tarjetas de jugador (estilo lámina "Equipo"); en
     escritorio se ve la tabla editable de siempre. Mismo patrón para
     reutilizar en otros módulos con vista de tarjetas vs. tabla. */
  .mobile-only{display:none}
  .desktop-only{display:block}
  @media (max-width:860px){
    .mobile-only{display:block}
    .desktop-only{display:none}
  }

  /* Header "Nuestro equipo": título + botón Agregar, pill de activos,
     buscador y filtros por posición en píldoras horizontales. */
  .list-header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .list-header-row h2{margin:0}
  .active-count-pill{display:inline-flex;align-items:center;gap:6px;background:#D9F2E3;color:#146C3C;font-weight:700;font-size:12.5px;padding:6px 13px;border-radius:999px;margin-bottom:14px}
  .pill-filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
  .pill-filter-row::-webkit-scrollbar{display:none}
  .pill-filter{flex:0 0 auto;background:var(--panel2);color:var(--text);border:none;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;font-family:'Baloo 2',sans-serif}
  .pill-filter.active{background:var(--brand);color:var(--brand-dark)}

  /* Tarjeta de jugador (lista "Nuestro equipo" / listas similares): chip tipo
     camiseta con el número, nombre/posición/rating y botón "Ver perfil". */
  .player-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
  .player-jersey-chip{width:54px;height:62px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:var(--panel2)}
  .player-jersey-chip img{width:100%;height:100%;object-fit:cover}
  .player-jersey-chip svg{width:100%;height:100%;display:block}
  .player-card-body{flex:1;min-width:0}
  .player-card-name{font-size:15px;font-weight:800;font-family:'Baloo 2',sans-serif;line-height:1.25}
  .player-card-position{font-size:12.5px;color:var(--muted);margin-bottom:3px}
  .player-card-rating{font-size:13px;color:var(--text);font-weight:700}
  .player-card-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
  .player-detail-field{margin-bottom:10px}
  .player-detail-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}

  /* Píldora negra con el nombre del módulo, centrada arriba del título
     (estilo lámina: "ENTRENAMIENTOS", "MENSAJES", "CONVOCATORIA"). */
  .module-pill-wrap{text-align:center;margin-bottom:10px}
  .module-pill{display:inline-block;background:var(--chrome);color:var(--brand);border:2px solid var(--brand);border-radius:999px;padding:6px 22px;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-family:'Baloo 2',sans-serif}

  /* Tabs tipo píldora (Próximos/Realizados, Lista/Formación, etc.) — mismo
     look que los filtros de posición en Equipo, pero ocupando el ancho
     completo en dos mitades iguales. */
  .tab-pill-row{display:flex;gap:8px;margin-bottom:16px}
  .tab-pill{flex:1;background:var(--panel2);color:var(--text);border:none;padding:11px 10px;border-radius:999px;font-weight:700;font-size:14px;text-align:center}
  .tab-pill.active{background:var(--brand);color:var(--brand-dark)}

  /* Tarjeta de entrenamiento/partido con caja de fecha a la izquierda
     (estilo lámina) + contenido a la derecha, usada como <summary> de un
     <details> para desplegar asistencia/convocatoria/formación debajo. */
  .event-date-box{background:var(--panel2);border-radius:10px;padding:10px 14px;text-align:center;flex-shrink:0;min-width:70px}
  .event-date-box .dow{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.03em}
  .event-date-box .num{font-size:19px;font-weight:800;font-family:'Baloo 2',sans-serif;line-height:1.15;color:var(--text)}
  .event-summary-row{display:flex;align-items:center;gap:14px;cursor:pointer;list-style:none}
  .event-summary-row::-webkit-details-marker{display:none}
  .event-summary-row::after{content:'Ver detalle ›';margin-left:auto;flex-shrink:0;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
  details[open] > .event-summary-row::after{content:'Ocultar ‹'}
  .card .label{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase}
  tr:last-child td{border-bottom:none}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;box-shadow:0 1px 3px rgba(20,18,16,.04)}
  .panel h3{margin-top:0;font-family:'Baloo 2',sans-serif;font-weight:700}
  /* Secciones "plegables" del Dashboard (estadísticas, resumen financiero):
     info que sigue disponible con un toque, sin saturar la primera vista. */
  .dash-collapsible{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px}
  .dash-collapsible summary{
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    font-family:'Baloo 2',sans-serif;font-weight:700;letter-spacing:0;
    font-size:15.5px;color:var(--text);user-select:none;
  }
  .dash-collapsible summary::-webkit-details-marker{display:none}
  .dash-collapsible summary::after{content:'▾ Ver más';margin-left:auto;font-family:inherit;font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted)}
  .dash-collapsible[open] summary::after{content:'▴ Ver menos'}
  .dash-collapsible[open] summary{margin-bottom:2px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:140px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.presente{background:#E3F6EB;color:#0E8C4C}
  .badge.tarde{background:#FDF1D6;color:#9A6E05}
  .badge.ausente{background:#FBE4E2;color:#C73A30}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{background:var(--panel2);color:var(--muted);border-radius:999px;font-weight:700}
  .tabs button.active{background:var(--brand);color:var(--brand-dark)}
  .comment{background:var(--panel2);border-radius:8px;padding:10px;margin-bottom:8px}
  .comment .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
  .embed-wrap{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .embed-wrap iframe{border-radius:8px;border:none}
  .stars{color:var(--warn);font-size:14px}
  .muted{color:var(--muted);font-size:12px}
  .close-x{float:right;cursor:pointer;color:var(--muted)}
  .match-card{cursor:pointer}
  .match-card:hover{border-color:var(--accent)}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--border);padding:12px 16px;border-radius:8px;z-index:50}
  .rating-input{width:72px !important;min-width:72px;height:44px;padding:8px 4px !important;text-align:center;font-size:20px;font-weight:700;margin-bottom:0 !important;color:var(--warn)}
  .stat-input{width:64px !important;min-width:64px;height:44px;padding:8px 4px !important;text-align:center;font-size:18px;font-weight:600;margin-bottom:0 !important}
  iframe{max-width:100%}

  /* Pie de página con los logos de los patrocinadores: ocupa las dos
     columnas del grid de #app (nav + main), así que siempre queda debajo de
     todo el contenido, sin importar la vista abierta. */
  #sponsors-footer{grid-column:1/-1}
  .sponsors-footer{display:flex;align-items:center;flex-wrap:wrap;gap:18px;padding:14px 24px;border-top:2px solid var(--border);background:var(--panel)}
  .sponsors-footer-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-right:4px;flex:0 0 auto}
  .sponsor-logo{display:inline-flex;align-items:center}
  .sponsor-logo img{max-height:40px;max-width:110px;object-fit:contain;opacity:.92;transition:opacity .15s}
  .sponsor-logo img:hover{opacity:1}

  /* Tarjetas "Figura del partido" / "Jugador del mes" del dashboard, y el
     distintivo que se muestra en el detalle de un partido con figura elegida. */
  .highlight-card{border-top-color:var(--warn);display:flex;align-items:center;gap:12px}
  .highlight-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--warn);flex-shrink:0}
  .highlight-photo-placeholder{width:52px;height:52px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .highlight-name{font-size:18px;font-weight:700;margin:4px 0 2px}
  .mvp-badge{display:flex;align-items:center;gap:8px;background:var(--warn);color:#241a03;font-weight:700;padding:4px 12px 4px 4px;border-radius:999px;font-size:12px;margin:6px 0;width:fit-content}
  .mvp-badge-photo{width:26px;height:26px;border-radius:50%;object-fit:cover}
  .mvp-badge-photo-placeholder{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:14px}

  /* Banner destacado ("enmarcado") de la Figura del último partido, visible
     en el Dashboard de todos los roles — foto grande con marco dorado,
     nombre y calificación promedio (si el DT la cargó). */
  /* Tarjeta blanca compacta, estilo lamina "Inicio": titulo + chevron arriba,
     miniatura cuadrada + nombre + calificacion abajo. */
  .mvp-spotlight{
    position:relative;display:flex;flex-direction:column;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,18,16,.04);
  }
  .mvp-spotlight-eyebrow{font-size:14px;font-weight:700;color:var(--text);font-family:'Baloo 2',sans-serif;display:flex;align-items:center;justify-content:space-between}
  .mvp-spotlight-eyebrow::after{content:'\203A';color:var(--muted);font-weight:700;font-size:18px}
  .mvp-spotlight-body{display:flex;align-items:center;gap:14px}
  .mvp-spotlight-frame{
    width:64px;height:64px;border-radius:12px;border:none;
    overflow:hidden;flex-shrink:0;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:28px;
  }
  .mvp-spotlight-frame img{width:100%;height:100%;object-fit:cover}
  .mvp-spotlight-name{font-size:18px;font-weight:800;color:var(--text);margin:0 0 3px;font-family:'Baloo 2',sans-serif}
  .mvp-spotlight-meta{font-size:14px;color:var(--muted)}
  @media (max-width:520px){
    .mvp-spotlight{padding:14px}
    .mvp-spotlight-frame{width:52px;height:52px;font-size:22px}
    .mvp-spotlight-name{font-size:16px}
  }

  /* Pizarrón de "Formación": cancha (proporción vertical, arco/portería
     arriba y abajo) con fichas de jugadores arrastrables, y a un lado la
     banca de jugadores disponibles todavía sin ubicar. */
  .lineup-wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .lineup-pitch{position:relative;width:300px;max-width:100%;aspect-ratio:2/3;background:linear-gradient(180deg,#1f8a54,#166339);border-radius:10px;border:2px solid #0d4024;overflow:hidden;flex:0 0 auto;touch-action:none}
  .lineup-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .lineup-chip{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;touch-action:none;width:58px;z-index:2}
  .lineup-chip .num{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .lineup-chip .name{font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85);margin-top:2px;text-align:center;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
  .lineup-bench{flex:1;min-width:200px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;background:var(--panel2);border-radius:10px;padding:10px;min-height:80px}
  .lineup-bench-chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 4px;cursor:grab;touch-action:none;font-size:12px;user-select:none}
  .lineup-bench-chip .num{width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto}
  .lineup-drag-ghost{position:fixed;left:0;top:0;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--brand-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;z-index:999}

  /* Lista de convocados junto a la cancha del Dashboard (mini formación de
     solo lectura) — aprovecha el espacio horizontal en vez de dejarlo vacío
     al lado de una cancha angosta, con el mismo # de camiseta que se ve en
     la ficha del jugador dentro de la cancha, en orden de arriba hacia abajo. */
  .lineup-roster{flex:1;min-width:200px;max-width:280px}
  .lineup-roster-list{list-style:none;margin:0 0 12px;padding:0}
  .lineup-roster-list li{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border);font-size:14px}
  .lineup-roster-num{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-dark);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

  /* ============= RESPONSIVE (celular / tablet) ============= */
  /* #menu-toggle queda oculto (no se usa; su función la cumple el botón
     "Más" de #bottom-tabbar, que llama exactamente a las mismas
     openMobileNav()/closeMobileNav() de siempre). */
  #menu-toggle{display:none}
  #nav-overlay{display:none}
  #bottom-tabbar{display:none}

  /* Barra inferior fija de 4 accesos directos (estilo app nativa), visible
     solo en celular/tablet. "Más" abre el menú completo (el <nav> de
     siempre, con la lista filtrada por rol que ya arma buildNav()) como un
     panel que sube desde abajo. */
  @media (max-width: 860px){
    #app.active ~ #bottom-tabbar{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:110;
      background:var(--chrome);border-top:1px solid var(--chrome-border);
      box-shadow:0 -2px 10px rgba(0,0,0,.35);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      justify-content:space-around;align-items:stretch;
    }
    #bottom-tabbar .tab-btn{
      flex:1;min-width:0;background:transparent;border:none;color:#9a9486;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:2px;font-size:10.5px;font-weight:600;padding:6px 2px;border-radius:10px;
      min-height:50px;text-transform:none;letter-spacing:0;font-family:'Baloo 2',sans-serif;
    }
    #bottom-tabbar .tab-btn .tab-icon{font-size:20px;line-height:1}
    #bottom-tabbar .tab-btn.active{color:var(--brand)}
  }

  @media (max-width: 860px){
    #app.active{display:block}

    /* El menú lateral se convierte en un panel que sube desde abajo (como
       una hoja/"sheet"), oculto por defecto y mostrado al tocar "Más" en
       #bottom-tabbar (usa las mismas openMobileNav()/closeMobileNav() que
       ya existían). #nav-overlay es el fondo oscuro detrás del panel. */
    nav{
      position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;width:100%;z-index:120;
      flex-direction:column;align-items:stretch;overflow-y:auto;max-height:72vh;
      -webkit-overflow-scrolling:touch;padding:14px 14px calc(96px + env(safe-area-inset-bottom));
      border-right:none;border-top:3px solid var(--brand);
      border-radius:16px 16px 0 0;
      box-shadow:0 -8px 30px rgba(0,0,0,.5);
      transform:translateY(105%);transition:transform .25s ease;
    }
    nav.nav-open{transform:translateY(0)}
    nav h2,nav .who{display:block}
    nav button.nav-btn{
      white-space:nowrap;margin-bottom:4px;padding:12px 14px;
      font-size:14.5px;min-height:46px;border-radius:10px;text-align:left;
    }
    nav .logout{margin-top:8px}
    nav .logout button{white-space:nowrap;padding:12px 14px;min-height:46px}
    nav::after{ content:none; }

    #nav-overlay{
      display:block;position:fixed;inset:0;z-index:115;background:rgba(0,0,0,0);
      pointer-events:none;transition:background .25s ease;
    }
    #nav-overlay.show{background:rgba(0,0,0,.55);pointer-events:auto}

    main{padding:16px 12px 92px;max-height:none}
    h2.section-title{font-size:18px}
    #login-screen,#force-password-screen{padding:20px}
    .login-box{width:100%;max-width:340px;padding:24px}

    /* Los formularios en fila (.row) se apilan en una sola columna: en
       celular, dos o tres campos angostos uno al lado del otro quedan
       difíciles de tocar y de leer. */
    .row{flex-direction:column;gap:8px}
    .row > *{min-width:100%;width:100%}

    /* Objetivos de toque más grandes: botones e inputs un poco más altos
       para que sean fáciles de presionar con el dedo. */
    input,select,textarea{padding:12px 10px;font-size:16px}
    button{padding:12px 16px;min-height:44px}
    button.small{padding:9px 12px;min-height:38px}

    /* Cada tabla se desplaza horizontalmente por sí sola (en vez de
       arrastrar toda la pantalla, botones incluidos, hacia los lados). */
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
    table{min-width:560px;white-space:nowrap}
    th,td{padding:10px 12px;white-space:nowrap}

    .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .tabs{gap:8px}
    .tabs button{padding:10px 14px;min-height:40px}
    .toast{left:16px;right:16px;bottom:16px}
    .sponsors-footer{padding:14px;gap:14px;justify-content:center}
    .sponsor-logo img{max-height:32px;max-width:88px}
  }
  @media (max-width: 420px){
    .login-box{padding:20px}
    .cards{grid-template-columns:1fr 1fr}
  }
</style>
</head>

const tableWrapObserver = new MutationObserver(()=>{
  $$('table', main).forEach(t=>{
    if(t.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    t.parentNode.insertBefore(wrap, t);

  });
});

function fmtDate(d){ if(!d) return '-'; return new Date(d+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMoney(n){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0); }
// Edad calculada a partir de la fecha de nacimiento — así nunca queda
// desactualizada (en vez de guardar un número fijo que hay que ir corrigiendo
// cada cumpleaños).
function calcAge(birthDate){
  if(!birthDate) return null;
  const b = new Date(birthDate+'T00:00:00');
  if(isNaN(b.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - b.getFullYear();
  const m = today.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
  return age;
}

// Descarga el workbook generado como archivo .xlsx en el navegador.
async function downloadWorkbook(workbook, filename){
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Link "Cómo llegar" (Google Maps, Waze o cualquier URL que haya puesto el
// cuerpo técnico) — se abre en pestaña nueva y nunca rompe el layout si no
// hay link cargado.
function mapsLink(url, label){
  if(!url) return '';
  // Si pegaron el link sin "https://" (por ejemplo, copiando solo el texto
  // visible), el navegador lo trata como una ruta interna de la app y el
  // clic no lleva a ningún lado. Se le agrega el esquema automáticamente.
  let href = url.trim();
  if(!/^https?:\/\//i.test(href)) href = 'https://' + href;
  const safeUrl = href.replace(/"/g,'&quot;');
  return `<a href="${safeUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${label || '📍 Cómo llegar'}</a>`;
}

// Link "Cómo llegar" con respaldo automático: si el cuerpo técnico solo
// escribió el nombre del lugar (campo "Lugar") pero no pegó un link de Google
// Maps/Waze, se arma un link de búsqueda de Google Maps con ese texto para
// que el pin siempre quede clickeable en vez de mostrar solo el nombre suelto.
function mapsLinkAuto(location, location_url){
  const url = location_url || (location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}` : '');
  return url ? mapsLink(url) : '';
}

// Igual que con mapsLink: si pegaron el link del patrocinador sin "https://"
// el navegador lo trataría como una ruta interna de la app.
function normalizeUrl(url){
  if(!url) return '';
  let href = url.trim();
  if(!/^https?:\/\//i.test(href)) href = 'https://' + href;
  return href.replace(/"/g,'&quot;');
}

      name, website_url: $('#sp-website').value.trim() || null, logo_url, active: true,
      sort_order: (maxRow?.sort_order ?? -1) + 1,
    });
    btn.disabled = false;
    if(insError){ toast(insError.message, true); return; }
    toast('Patrocinador agregado');
    renderPatrocinadores();
    renderSponsorsFooter();
  });
}

window.__saveSponsor = async (id)=>{
  const row = document.querySelector(`tr[data-id="${id}"]`);
  const payload = {
    name: row.querySelector('.sp-edit-name').value.trim(),
    website_url: row.querySelector('.sp-edit-website').value.trim() || null,
    active: row.querySelector('.sp-edit-active').checked,
    sort_order: Number(row.querySelector('.sp-edit-order').value) || 0,
  };
  if(!payload.name){ toast('El nombre es obligatorio', true); return; }
  // Si además dejaron seleccionada una imagen nueva en el campo de logo de
  // esta fila (aunque no hayan usado el botón "Cambiar logo"), se sube junto
  // con el resto de los cambios — así "Guardar" y "Cambiar logo" funcionan
  // igual y no depende de acordarse cuál botón usar.
  const logoFile = row.querySelector('.sp-edit-logo')?.files[0];
  if(logoFile){
    if(!logoFile.type.startsWith('image/')){ toast('El logo debe ser una imagen (PNG, JPG, etc.), no un PDF u otro archivo', true); return; }
    const ext = (logoFile.name.split('.').pop() || 'png').toLowerCase();
    const path = `sponsors/${id}-${Date.now()}.${ext}`;
    const { error: upErr } = await supabase.storage.from('match-photos').upload(path, logoFile, { upsert: true });
    if(upErr){ toast(upErr.message, true); return; }
    const { data: pub } = supabase.storage.from('match-photos').getPublicUrl(path);
    payload.logo_url = pub.publicUrl;
  }
  const { error } = await supabase.from('sponsors').update(payload).eq('id', id);
  if(error){ toast(error.message, true); return; }
  toast('Patrocinador actualizado' + (logoFile ? ' (logo incluido)' : ''));
  renderPatrocinadores();
  renderSponsorsFooter();
};

window.__replaceSponsorLogo = async (id, btn)=>{
  const row = btn.closest('tr');
  const input = row.querySelector('.sp-edit-logo');
  const file = input.files[0];
  if(!file){ toast('Selecciona una imagen primero', true); return; }
  if(!file.type.startsWith('image/')){ toast('El logo debe ser una imagen (PNG, JPG, etc.), no un PDF u otro archivo', true); return; }
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = `sponsors/${id}-${Date.now()}.${ext}`;
  const { error: upErr } = await supabase.storage.from('match-photos').upload(path, file, { upsert: true });
  if(upErr){ toast(upErr.message, true); return; }
  const { data: pub } = supabase.storage.from('match-photos').getPublicUrl(path);
  const { error } = await supabase.from('sponsors').update({ logo_url: pub.publicUrl }).eq('id', id);
  if(error){ toast(error.message, true); return; }
  toast('Logo actualizado');
  renderPatrocinadores();
  renderSponsorsFooter();
};

window.__deleteSponsor = async (id)=>{
  const { error } = await supabase.from('sponsors').delete().eq('id', id);
  if(error){ toast(error.message, true); return; }
  toast('Patrocinador eliminado');

  renderSponsorsFooter();
};

// Tarjeta única con el próximo evento del equipo (partido o entrenamiento, lo
// que caiga primero) — usada en el Dashboard de TODOS los roles, en vez de dos
// tarjetas separadas. Se muestra siempre que haya un partido o entreno
// programado a futuro (sin límite de días), para que la ubicación quede
// visible con anticipación.
async function fetchNextEventCard(){
  const today = new Date().toISOString().slice(0,10);
  const [{ data: trainings }, { data: matches }] = await Promise.all([
    supabase.from('trainings').select('*').gte('session_date', today).order('session_date').limit(1),
    supabase.from('matches').select('*').gte('match_date', today).order('match_date').limit(1),
  ]);
  const t = trainings?.[0], m = matches?.[0];
  if(!t && !m) return '';
  const matchIsNext = m && (!t || m.match_date <= t.session_date);
  return matchIsNext ? await fetchNextMatchCard() : await fetchNextTrainingCard();
}

// Tabla de posiciones de la Copa Futbolgol (torneo que juega el equipo),
// tomada en vivo de futbolgol.com a través de la Edge Function
// "fetch-standings" (el fetch se hace del lado del servidor porque el sitio
// de Futbolgol no permite llamadas directas desde el navegador). Muestra los
// primeros 10 puestos y, si Abraham Lincoln no está entre ellos, lo agrega
// como una fila extra con su posición real.
async function renderTournamentStandings(){
  const container = $('#tabla-torneo');
  if(!container) return;
  container.innerHTML = `<h3 class="section-title" style="margin-top:8px">Tabla de posiciones · Copa Futbolgol</h3><p class="muted">Cargando tabla…</p>`;
  try{
    // Este proyecto usa el sistema nuevo de llaves de Supabase. El cliente
    // global se creó con la llave anon "legacy" (formato JWT), que la
    // pasarela de Edge Functions rechaza. Por eso aquí forzamos los headers
    // con la publishable key nueva, que sí autentica correctamente.
    const { data, error } = await supabase.functions.invoke('fetch-standings', {
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}` },
    });
    if(error || !data || data.error) throw new Error(data?.error || error?.message || 'No se pudo cargar la tabla');
    const rows = [...(data.top10||[])];
    if(data.ourTeam && !data.ourInTop10) rows.push(data.ourTeam);
    container.innerHTML = `
      <h3 class="section-title" style="margin-top:8px">Tabla de posiciones · Copa Futbolgol</h3>
      <table>
        <thead><tr><th>Pos</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>GD</th><th>PTS</th></tr></thead>
        <tbody>
          ${rows.map(r=>{
            const isUs = (r.href||'').includes('abraham-lincoln');
            return `<tr style="${isUs?'font-weight:700;background:var(--panel2)':''}">
              <td>${r.pos ?? '-'}</td><td>${isUs?'⭐ ':''}${r.team}</td><td>${r.pj??'-'}</td><td>${r.pg??'-'}</td><td>${r.pe??'-'}</td><td>${r.pp??'-'}</td><td>${r.gf??'-'}</td><td>${r.gc??'-'}</td><td>${r.gd??'-'}</td><td>${r.pts??'-'}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="10" class="muted">Sin datos todavía.</td></tr>'}
        </tbody>
      </table>
      <p class="muted" style="margin-top:6px">Actualizado ${new Date(data.updatedAt).toLocaleString('es-ES')} · <a href="${data.source}" target="_blank" rel="noopener">Ver tabla completa en Futbolgol</a></p>
    `;
  }catch(err){
    container.innerHTML = `
      <h3 class="section-title" style="margin-top:8px">Tabla de posiciones · Copa Futbolgol</h3>
      <p class="muted">No se pudo cargar la tabla en este momento. <a href="https://www.futbolgol.com/copa/" target="_blank" rel="noopener">Verla directo en Futbolgol</a>.</p>
    `;
  }
}

// Banner del Dashboard con la Figura del último partido (elegida a mano por
// el cuerpo técnico, ver window.__saveMatch/matches.mvp_player_id) y el
// Jugador del Mes, calculado solo: quien acumule más veces "Figura del
// partido" dentro de los partidos ya jugados del mes calendario en curso
// (empate = ambos quedan mencionados igual, se ordenan por nombre).
async function renderMonthlyHighlights(){
  const container = $('#monthly-highlights');
  if(!container) return;
  const today = new Date().toISOString().slice(0,10);
  const now = new Date();
  const monthStart = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
  // Ojo: se busca el partido ya jugado MÁS RECIENTE QUE TENGA figura elegida
  // (not mvp_player_id is null), no simplemente "el último partido jugado" —
  // si el DT todavía no le puso figura al partido más reciente pero sí a uno
  // anterior, igual se muestra esa (la más reciente con figura), en vez de
  // no mostrar nada solo porque el partido más nuevo quedó sin elegir.
  const [{ data: lastMatches }, { data: monthMatches }] = await Promise.all([
    supabase.from('matches').select('id,opponent,match_date,mvp_player_id').lte('match_date', today).not('mvp_player_id', 'is', null).order('match_date', {ascending:false}).limit(1),
    supabase.from('matches').select('mvp_player_id').gte('match_date', monthStart).lte('match_date', today).not('mvp_player_id', 'is', null),
  ]);
  const lastMatch = lastMatches?.[0];

  // Calificación promedio (técnica/física/táctica/mental) que le puso el DT
  // a la figura del último partido, para mostrarla junto a su foto y nombre.
  let mvpRatingAvg = null;
  if(lastMatch?.mvp_player_id){
    const { data: mvpEval } = await supabase.from('evaluations').select('technique,physical,tactical,mental')
      .eq('match_id', lastMatch.id).eq('player_id', lastMatch.mvp_player_id).maybeSingle();
    if(mvpEval){
      const vals = [mvpEval.technique, mvpEval.physical, mvpEval.tactical, mvpEval.mental].map(Number).filter(v=>!isNaN(v) && v>0);
      if(vals.length) mvpRatingAvg = vals.reduce((a,b)=>a+b,0)/vals.length;
    }
  }

  const mvpCounts = {};
  (monthMatches||[]).forEach(m=>{ mvpCounts[m.mvp_player_id] = (mvpCounts[m.mvp_player_id]||0) + 1; });
  const ranked = Object.entries(mvpCounts).sort((a,b)=> b[1]-a[1] || playerName(a[0]).localeCompare(playerName(b[0])));
  const playerOfMonth = ranked[0];
  const monthName = now.toLocaleDateString('es-ES', {month:'long'});

  // Banner "enmarcado" grande con la Figura del último partido: foto, nombre
  // y calificación — visible en el Dashboard de todos los roles (Comité ALS,
  // cuerpo técnico, jugadores y fichajes), no solo dentro del partido.
  let spotlightHtml = '';
  if(lastMatch?.mvp_player_id){
    const photo = playerPhoto(lastMatch.mvp_player_id);
    spotlightHtml = `
      <div class="mvp-spotlight">
        <div class="mvp-spotlight-eyebrow">Figura del último partido · vs ${lastMatch.opponent}</div>
        <div class="mvp-spotlight-body">
          <div class="mvp-spotlight-frame">${photo ? `<img src="${photo}" alt="" />` : '🏅'}</div>
          <div>
            <div class="mvp-spotlight-name">${playerName(lastMatch.mvp_player_id)}</div>
            <div class="mvp-spotlight-meta">${mvpRatingAvg ? `⭐ ${mvpRatingAvg.toFixed(1)} / 5` : 'Sin calificación registrada'}</div>
          </div>
        </div>
      </div>
    `;
  }

  const cards = [];
  if(playerOfMonth){
    cards.push(`<div class="card highlight-card">${playerAvatarHtml(playerOfMonth[0],'highlight-photo')}<div><div class="label">⭐ Jugador del mes de ${monthName}</div><div class="highlight-name">${playerName(playerOfMonth[0])}</div><div class="muted">${playerOfMonth[1]} figura${playerOfMonth[1]>1?'s':''} del partido este mes</div></div></div>`);
  }
  container.innerHTML = spotlightHtml + (cards.length ? `<div class="cards">${cards.join('')}</div>` : '');
}

// Mini cancha de solo lectura en el Dashboard con la Formación del próximo
// partido — visible para cuerpo técnico/Comité ALS siempre, y para
// cualquier jugador/fichaje al que se le haya activado "can_view_lineup"
// desde Usuarios (ver canViewLineup()). No es arrastrable: solo mostrar.
async function renderDashboardLineup(){
  const container = $('#dash-lineup');
  if(!container) return;
  if(!canViewLineup()){ container.innerHTML = ''; return; }
  const today = new Date().toISOString().slice(0,10);
  const { data: matches } = await supabase.from('matches').select('id,opponent,match_date').gte('match_date', today).order('match_date', {ascending:true}).limit(1);
  const nextMatch = matches?.[0];
  if(!nextMatch){ container.innerHTML = ''; return; }
  const { data: lineup } = await supabase.from('lineups').select('*').eq('match_id', nextMatch.id).maybeSingle();
  let placed = [];
  if(lineup){
    const { data: lp } = await supabase.from('lineup_players').select('*').eq('lineup_id', lineup.id);
    placed = lp || [];
  }
  // Suplentes: mismo criterio que en el pizarrón editable (window.__openLineup)
  // — quienes confirmaron asistencia en Convocatoria (o, si nadie ha
  // respondido todavía, todo el plantel activo como respaldo) y no están ya
  // ubicados en la cancha.
  let suplentes = [];
  if(placed.length){
    const { data: callUp } = await supabase.from('call_ups').select('id').eq('match_id', nextMatch.id).maybeSingle();
    let confirmedIds = [];
    if(callUp){
      const { data: responses } = await supabase.from('call_up_responses').select('player_id').eq('call_up_id', callUp.id).eq('response', 'asiste');
      confirmedIds = (responses||[]).map(r=>r.player_id);
    }
    const poolIds = new Set(confirmedIds.length ? confirmedIds : playersCache.filter(p=>p.active && !p.injured).map(p=>p.id));
    const placedIds = new Set(placed.map(pp=>pp.player_id));
    suplentes = [...poolIds].filter(id=>!placedIds.has(id)).map(id=>playersCache.find(p=>p.id===id)).filter(Boolean)
      .sort((a,b)=>(a.jersey_number||0)-(b.jersey_number||0));
  }
  const firstName = (fullName)=> (fullName||'').split(' ')[0];
  // Mismo orden en la cancha y en la lista de al lado: de arriba (ataque)
  // hacia abajo (arquero), según la posición vertical (pos_y) de cada ficha.
  const placedSorted = placed.slice().sort((a,b)=> a.pos_y - b.pos_y);
  container.innerHTML = `
    <h3 class="section-title" style="margin-top:8px">⚽ Formación · vs ${nextMatch.opponent} · ${fmtDate(nextMatch.match_date)}</h3>
    ${placed.length ? `
      <div class="lineup-wrap">
        <div class="lineup-pitch">
          <svg class="lineup-lines" viewBox="0 0 300 450" preserveAspectRatio="none">
            <rect x="4" y="4" width="292" height="442" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <line x1="4" y1="225" x2="296" y2="225" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <circle cx="150" cy="225" r="40" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <rect x="70" y="4" width="160" height="60" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
            <rect x="70" y="386" width="160" height="60" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
          </svg>
          ${placed.map(pp=>{
            const p = playersCache.find(pl=>pl.id===pp.player_id);
            if(!p) return '';
            return `<div class="lineup-chip" style="left:${pp.pos_x}%;top:${pp.pos_y}%;cursor:default">
              <div class="num">${p.jersey_number}</div>
              <div class="name">${firstName(p.full_name)}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="lineup-roster">
          <div class="muted" style="font-weight:700;margin-bottom:4px">👕 Titulares</div>
          <ul class="lineup-roster-list">
            ${placedSorted.map(pp=>{
              const p = playersCache.find(pl=>pl.id===pp.player_id);
              if(!p) return '';
              return `<li><span class="lineup-roster-num">${p.jersey_number}</span> ${p.full_name}</li>`;
            }).join('')}
          </ul>
          ${suplentes.length ? `
            <div class="muted" style="font-weight:700;margin-bottom:4px">🔄 Suplentes</div>
            <ul class="lineup-roster-list">
              ${suplentes.map(p=>`<li><span class="lineup-roster-num">${p.jersey_number}</span> ${p.full_name}</li>`).join('')}
            </ul>
          ` : ''}
          ${canManage() ? `<button class="small secondary" onclick="window.__goToMatchLineup('${nextMatch.id}')">Editar formación</button>` : ''}
        </div>
      </div>
    ` : `<p class="muted">Todavía no hay formación armada para este partido.${canManage() ? ' Entra a Partidos para armarla.' : ''}</p>`}
  `;
}

    <div id="notify-banner"></div>
    <div id="unread-msgs-banner"></div>
    <div id="dash-cards" class="cards"><p class="muted">Cargando…</p></div>
    <div id="dash-more"></div>
    <div id="monthly-highlights"></div>
    <div id="dash-lineup"></div>
    <div id="top-scorers"></div>
    <div id="tabla-torneo"></div>`;
  renderDashHero();
  renderTournamentStandings();
  renderMonthlyHighlights();
  renderDashboardLineup();
  if(isMaster()){
    $('#dash-cards').className = 'stat-grid';
    const [{count: activePlayers}, summaryRes] = await Promise.all([
      // Un jugador lesionado no cuenta como "activo" en este contador del Dashboard.
      supabase.from('players').select('*', {count:'exact', head:true}).eq('active', true).eq('injured', false),
      supabase.rpc('team_financial_summary'),

    const s = summaryRes.data || {};

      <div class="stat-chip-card"><div class="stat-chip-icon green">⬆️</div><div class="stat-chip-body"><div class="num">${fmtMoney(s.total_recaudado)}</div><div class="label">Recaudado</div></div></div>

    `;
  } else if(isAdmin()){
    renderUnratedMatchesReminder();
    $('#dash-cards').className = 'stat-grid';
    const { count: activePlayers } = await supabase.from('players').select('*', {count:'exact', head:true}).eq('active', true).eq('injured', false);
    $('#dash-cards').innerHTML = `
      <div class="stat-chip-card"><div class="stat-chip-icon blue">👥</div><div class="stat-chip-body"><div class="num">${activePlayers ?? '-'}</div><div class="label">Jugadores activos</div></div></div>
    `;
  } else {
    renderPlayerNotifications();
    renderUnreadMessagesBanner();
    const pid = profile.player_id;
    // El % de participación (y el resto de estadísticas de partidos/entrenos) se
    // calculan solo sobre eventos que YA pasaron a la fecha — así el numerador
    // (a los que asistió/jugó) y el denominador (los que ya tuvo el equipo) quedan
    // en la misma base. Si no se filtrara también el numerador (con el join a
    // matches/trainings), un evento reprogramado a futuro después de haber
    // guardado su registro podía inflar el % por encima de 100%.
    //
    // El denominador de entrenamientos es "cuántos entrenamientos ya tuvo el
    // equipo" (tabla trainings, no cuántas filas de 'attendance' existan para
    // este jugador) — si el cuerpo técnico nunca le registró la asistencia en
    // alguno, ese entreno cuenta igual en el denominador y baja el % (no se
    // "salta"), en vez de desaparecer del cálculo como pasaba antes.
    //
    // Si el jugador respondió "Asiste" en la convocatoria de un entrenamiento
    // y el cuerpo técnico todavía no le registró la asistencia real (fila en
    // 'attendance'), esa confirmación de convocatoria cuenta como presente
    // para el promedio — así no se le "castiga" solo porque nadie pasó lista
    // todavía. Si SÍ existe una fila de attendance para ese entreno, esa fila
    // manda siempre (incluye el caso en que confirmó pero no llegó).
    const today = new Date().toISOString().slice(0,10);
    const [{data: att}, {data: trainingsData}, {data: stats}, {data: dues}, {data: pays}, {count: totalMatches}, {count: mvpCount}, {data: myCallUpConfirms}, {data: fineSettingsRow}, nextMatchCard, nextTrainingCard] = await Promise.all([
      supabase.from('attendance').select('training_id, status, trainings!inner(session_date)').eq('player_id', pid).lte('trainings.session_date', today),
      supabase.from('trainings').select('id').lte('session_date', today),
      supabase.from('player_match_stats').select('minutes_played,goals,assists,yellow_cards,red_cards, matches!inner(match_date)').eq('player_id', pid).lte('matches.match_date', today).order('created_at', {ascending:false}),
      supabase.from('payment_dues').select('amount_due').eq('player_id', pid),
      supabase.from('payments').select('amount').eq('player_id', pid),
      supabase.from('matches').select('*', {count:'exact', head:true}).lte('match_date', today),
      supabase.from('matches').select('*', {count:'exact', head:true}).eq('mvp_player_id', pid).lte('match_date', today),
      supabase.from('call_up_responses').select('call_ups!inner(training_id, event_date)').eq('player_id', pid).eq('response', 'asiste').not('call_ups.training_id', 'is', null).lte('call_ups.event_date', today),
      supabase.from('fine_settings').select('*').limit(1).maybeSingle(),
      // Antes se mostraba "el próximo evento" (partido O entreno, lo que
      // cayera primero) en una sola tarjeta — si el entreno caía antes, el
      // próximo partido desaparecía por completo del Dashboard. Ahora se
      // muestran siempre las dos tarjetas por separado.
      fetchNextMatchCard(),
      fetchNextTrainingCard(),
    ]);
    const totalTrainings = (trainingsData||[]).length;
    const attStatusByTraining = Object.fromEntries((att||[]).map(a=>[a.training_id, a.status]));
    const confirmedTrainingIds = new Set((myCallUpConfirms||[]).map(r=>r.call_ups?.training_id).filter(Boolean));
    const presentes = (trainingsData||[]).filter(t=>{
      const status = attStatusByTraining[t.id];
      // Fila real de asistencia registrada por el cuerpo técnico: manda siempre.
      if(status) return status !== 'ausente';
      // Sin registro todavía: si confirmó "Asiste" en la convocatoria, cuenta como presente.
      return confirmedTrainingIds.has(t.id);
    }).length;
    const pctEntrenos = totalTrainings ? Math.round((presentes/totalTrainings)*100) : 0;
    // "Partidos jugados" cuenta solo los partidos con minutos_played > 0 — el
    // cuerpo técnico puede guardar una fila de player_match_stats con 0
    // minutos (p. ej. para marcar tarjetas/calificación de alguien que no
    // participó, o al guardar toda la tabla de una vez), y esas filas NO
    // cuentan como partido jugado aunque exista el registro en la tabla.
    const partidosJugados = (stats||[]).filter(s=>s.minutes_played > 0).length;
    const pctPartidos = totalMatches ? Math.round((partidosJugados/totalMatches)*100) : 0;
    const minutosTotales = (stats||[]).reduce((a,s)=>a+s.minutes_played,0);
    const minutosPromedio = partidosJugados ? Math.round(minutosTotales/partidosJugados) : 0;
    const minutosUltimo = stats?.[0]?.minutes_played ?? 0;
    const goles = (stats||[]).reduce((a,s)=>a+s.goals,0);
    const asistencias = (stats||[]).reduce((a,s)=>a+s.assists,0);
    const amarillas = (stats||[]).reduce((a,s)=>a+s.yellow_cards,0);
    const rojas = (stats||[]).reduce((a,s)=>a+s.red_cards,0);
    // El saldo pendiente del jugador incluye tanto sus cuotas como las multas
    // por tarjetas amarillas/rojas (mismo cálculo que usa el cuerpo técnico
    // en Finanzas) — antes solo sumaba cuotas y las multas nunca aparecían
    // en el saldo que ve el propio jugador en su Dashboard.
    const cuotas = (dues||[]).reduce((a,d)=>a+Number(d.amount_due),0);
    const multas = amarillas*Number(fineSettingsRow?.yellow_card_fine||0) + rojas*Number(fineSettingsRow?.red_card_fine||0);
    const totalDue = cuotas + multas;
    const totalPaid = (pays||[]).reduce((a,p)=>a+Number(p.amount),0);
    const me = playersCache.find(p=>p.id===pid);
    // Dashboard "amigable": solo lo esencial de un vistazo queda siempre
    // visible (próximo partido, próximo entreno, camiseta y la figura/goleadores
    // más abajo); las estadísticas y el resumen financiero, que son más
    // densos, quedan plegados detrás de un botón de "Ver más".
    $('#dash-cards').className = 'cards';
    $('#dash-cards').innerHTML = `
      ${nextMatchCard}
      ${nextTrainingCard}
      <div class="card"><div class="num">#${me?.jersey_number ?? '-'}</div><div class="label">Tu camiseta</div></div>
    `;
    // "fichaje" es igual a "jugador" pero sin nada del módulo financiero —
    // ni el ítem de menú "Resumen financiero" (ver buildNav) ni este resumen
    // dentro del Dashboard.
    $('#dash-more').innerHTML = `
      <details class="dash-collapsible">
        <summary>📊 Ver mis estadísticas</summary>
        <div class="cards" style="margin-top:14px">
          <div class="card"><div class="num">${pctEntrenos}%</div><div class="label">Asistencia a entrenamientos</div></div>
          <div class="card"><div class="num">${pctPartidos}%</div><div class="label">Participación en partidos</div></div>
          <div class="card"><div class="num">${minutosUltimo}</div><div class="label">Minutos último partido</div></div>
          <div class="card"><div class="num">${minutosPromedio}</div><div class="label">Minutos promedio / partido</div></div>
          <div class="card"><div class="num">${partidosJugados}</div><div class="label">Partidos jugados</div></div>
          <div class="card"><div class="num">${goles}</div><div class="label">Goles</div></div>
          <div class="card"><div class="num">${asistencias}</div><div class="label">Asistencias</div></div>
          <div class="card"><div class="num">${amarillas}</div><div class="label">Tarjetas amarillas</div></div>
          <div class="card"><div class="num">${rojas}</div><div class="label">Tarjetas rojas</div></div>
          <div class="card highlight-card"><div class="num">🏅 ${mvpCount ?? 0}</div><div class="label">Veces figura del partido</div></div>
        </div>
      </details>
      ${profile.role !== 'fichaje' ? `
      <details class="dash-collapsible">
        <summary>💰 Ver resumen financiero</summary>
        <div class="cards" style="margin-top:14px">
          <div class="card"><div class="num">${fmtMoney(cuotas)}</div><div class="label">Cuotas</div></div>
          <div class="card"><div class="num">${fmtMoney(multas)}</div><div class="label">Multas (tarjetas)</div></div>
          <div class="card"><div class="num">${fmtMoney(totalDue)}</div><div class="label">Total a deber</div></div>
          <div class="card"><div class="num">${fmtMoney(totalPaid)}</div><div class="label">Total pagado</div></div>
          <div class="card"><div class="num">${fmtMoney(totalDue-totalPaid)}</div><div class="label">Saldo pendiente</div></div>
        </div>
      </details>` : ''}
    `;
  }

  // Top 5 goleadores del equipo — visible en el Dashboard de todos los roles
  // (usuario maestro, cuerpo técnico, jugador y fichaje).
  const [{ data: goalStats }, { data: allPlayers }] = await Promise.all([
    supabase.from('player_match_stats').select('player_id, goals'),
    supabase.from('players').select('id, full_name, jersey_number').eq('active', true),
  ]);
  const goalsByPlayer = {};
  (goalStats||[]).forEach(s=>{ goalsByPlayer[s.player_id] = (goalsByPlayer[s.player_id]||0) + (s.goals||0); });
  const topScorers = (allPlayers||[])
    .map(p=>({ ...p, goals: goalsByPlayer[p.id] || 0 }))
    .filter(p=>p.goals > 0)
    .sort((a,b)=>b.goals - a.goals)
    .slice(0,5);
  $('#top-scorers').innerHTML = `
    <h3 class="section-title" style="margin-top:8px">Top 5 goleadores del equipo</h3>
    ${topScorers.length ? `
    <table><thead><tr><th>#</th><th>Jugador</th><th>Goles</th></tr></thead>
    <tbody>${topScorers.map((p,i)=>`<tr><td>${i+1}</td><td>#${p.jersey_number} ${p.full_name}</td><td>${p.goals}</td></tr>`).join('')}</tbody></table>
    ` : '<p class="muted">Todavía no hay goles registrados.</p>'}
  `;
}

let playerRatings = {}; // player_id -> promedio de calificación (1-5)

async function loadPlayerRatings(){
  const { data: evals } = await supabase.from('evaluations').select('player_id,technique,physical,tactical,mental');
  const sums = {};
  (evals||[]).forEach(e=>{
    const vals = [e.technique, e.physical, e.tactical, e.mental].filter(v=>v!=null);
    if(!vals.length) return;
    const avg = vals.reduce((a,v)=>a+v,0) / vals.length;
    if(!sums[e.player_id]) sums[e.player_id] = [];
    sums[e.player_id].push(avg);
  });
  playerRatings = {};
  Object.entries(sums).forEach(([pid, arr])=>{
    playerRatings[pid] = arr.reduce((a,v)=>a+v,0) / arr.length;
  });
}

// Exporta un .xlsx con nombre, teléfono y correo de todos los jugadores
// (activos e inactivos), para tener el listado del equipo fuera de la app.
async function exportPlayersToExcel(){
  toast('Generando Excel…');
  const { data: players, error } = await supabase.from('players').select('*').order('jersey_number');
  if(error){ toast(error.message, true); return; }
  if(!players || !players.length){ toast('No hay jugadores para exportar', true); return; }

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Jugadores');
  ws.columns = [
    { header: '#', key: 'num', width: 6 },
    { header: 'Nombre', key: 'nombre', width: 28 },
    { header: 'Posición', key: 'posicion', width: 16 },
    { header: 'Teléfono', key: 'telefono', width: 16 },
    { header: 'Correo', key: 'correo', width: 28 },
    { header: 'Estado', key: 'estado', width: 12 },
  ];
  styleHeaderRow(ws);

  players.forEach(p=>{
    ws.addRow({
      num: p.jersey_number,
      nombre: p.full_name,
      posicion: p.position || '-',
      telefono: p.phone || '-',
      correo: p.email || '-',
      estado: p.injured ? 'Lesionado' : (p.active ? 'Activo' : 'Inactivo'),
    });
  });

  await downloadWorkbook(wb, `jugadores_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel de jugadores descargado');
}

// Agrupa las posiciones granulares (PLAYER_POSITIONS) en las 4 categorías
// que muestra la lámina "Equipo" como filtros (Porteros/Defensas/Volantes/
// Delanteros), sin perder el detalle fino que ya guarda cada jugador.
// Ícono de camiseta (forma real, no un cuadro de color) con el número
// impreso al centro — mismo corte negro/amarillo diagonal del uniforme real
// del equipo. Se usa donde la lámina muestra la camiseta del jugador en vez
// de su foto (tarjetas de "Nuestro equipo", detalle sin foto, etc.).
function jerseyIconSvg(number, uid){
  const clipId = `jersey-clip-${uid}`;
  return `
    <svg viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="${clipId}">
          <path d="M20 5 L8 13 L3 26 L14 31 L18 23 L18 59 L46 59 L46 23 L50 31 L61 26 L56 13 L44 5 L37 9 Q32 14 27 9 Z"/>
        </clipPath>
      </defs>
      <g clip-path="url(#${clipId})">
        <rect x="0" y="0" width="64" height="64" fill="#141210"/>
        <polygon points="0,64 0,38 64,0 64,26" fill="#F4C515"/>
      </g>
      <text x="32" y="44" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="18" fill="#fff">${number}</text>
    </svg>
  `;
}

function positionBucket(pos){
  if(!pos) return 'otro';
  if(pos === 'Portero') return 'porteros';
  if(pos.startsWith('Defensa') || pos.startsWith('Lateral')) return 'defensas';
  if(pos.startsWith('Volante') || pos === 'Mediocampista') return 'volantes';
  if(pos.startsWith('Extremo') || pos === 'Delantero') return 'delanteros';
  return 'otro';
}

// Lista de tarjetas de "Nuestro equipo" en celular (estilo lámina): filtra
// por búsqueda de nombre y por categoría de posición, sobre el mismo
// playersCache que ya usa la tabla de escritorio — ningún dato nuevo, solo
// otra forma de mostrarlo.
function renderPlayerCards(){
  const el = $('#player-cards-list');
  if(!el) return;
  const list = playersCache.filter(p=>{
    const matchesSearch = !playerSearchQuery || p.full_name.toLowerCase().includes(playerSearchQuery);
    const matchesPos = playerPositionFilter === 'todos' || positionBucket(p.position) === playerPositionFilter;
    return matchesSearch && matchesPos;
  });
  el.innerHTML = list.map(p=>`
    <div class="player-card">
      <div class="player-jersey-chip">${p.photo_url ? `<img src="${p.photo_url}" alt="" />` : jerseyIconSvg(p.jersey_number, p.id)}</div>
      <div class="player-card-body">
        <div class="player-card-name">#${p.jersey_number} ${p.full_name}</div>
        <div class="player-card-position">${p.position||'Posición sin definir'}${p.injured ? ' · 🩹 Lesionado' : (!p.active ? ' · Inactivo' : '')}</div>
        <div class="player-card-rating">${playerRatings[p.id] ? '⭐ ' + playerRatings[p.id].toFixed(1) + ' / 5' : '<span class="muted">Sin calificar</span>'}</div>
      </div>
      <div class="player-card-actions">
        <button class="small" data-view-profile="${p.id}">Ver perfil</button>
      </div>
    </div>
  `).join('') || '<p class="muted">No hay jugadores que coincidan con la búsqueda.</p>';
  $$('[data-view-profile]').forEach(b=> b.addEventListener('click', ()=> openPlayerDetail(b.dataset.viewProfile)));
}

// Vista de detalle de un jugador en celular (lámina "Ver perfil"): mismos
// campos y acciones que la fila editable de la tabla de escritorio, pero en
// formulario vertical en vez de una fila ancha difícil de usar en pantalla
// chica. Para quien no puede gestionar jugadores, queda en solo lectura.
function openPlayerDetail(id){
  const p = playersCache.find(x=>x.id===id);
  if(!p) return;
  const age = calcAge(p.birth_date);
  const list = $('#jugadores-mobile'), detail = $('#player-detail-view');
  list.style.display = 'none';
  detail.style.display = 'block';
  const editable = canManage();
  detail.innerHTML = `
    <button class="section-back-btn" id="pd-back">← Volver</button>
    <div class="panel" style="text-align:center">
      ${p.photo_url ? `<img src="${p.photo_url}" alt="" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:10px" />` : `<div class="player-jersey-chip" style="width:88px;height:102px;border-radius:14px;margin:0 auto 10px">${jerseyIconSvg(p.jersey_number, 'pd-'+p.id)}</div>`}
      <h3 style="margin:0 0 2px">#${p.jersey_number} ${p.full_name}</h3>
      <p class="muted" style="margin:0 0 10px">${p.position||'Posición sin definir'}</p>
      ${editable ? `
        <input type="file" id="pd-photo-input" accept="image/*" style="margin-bottom:8px" />

      ` : ''}
    </div>
    <div class="panel">
      <div class="player-detail-field"><label>Número de camiseta</label>${editable ? `<input id="pd-jersey" type="number" value="${p.jersey_number}" />` : `<p>#${p.jersey_number}</p>`}</div>
      <div class="player-detail-field"><label>Fecha de nacimiento</label>${editable ? `<input id="pd-birth" type="date" value="${p.birth_date||''}" />` : `<p>${age!=null ? age+' años' : '-'}</p>`}</div>
      <div class="player-detail-field"><label>N° de documento</label>${editable ? `<input id="pd-document" value="${p.document_number||''}" />` : `<p>${p.document_number||'-'}</p>`}</div>
      <div class="player-detail-field"><label>Teléfono</label>${editable ? `<input id="pd-phone" value="${p.phone||''}" />` : `<p>${p.phone||'-'}</p>`}</div>
      <div class="player-detail-field"><label>Correo</label>${editable ? `<input id="pd-email" type="email" value="${p.email||''}" />` : `<p>${p.email||'-'}</p>`}</div>
      <div class="player-detail-field"><label>Calificación promedio</label><p>${playerRatings[p.id] ? '⭐ ' + playerRatings[p.id].toFixed(1) + ' / 5' : 'Sin calificar'}</p></div>
      <div class="player-detail-field"><label>Estado</label><p>${p.active ? '<span class="badge presente">Activo</span>' : '<span class="badge ausente">Inactivo</span>'}${p.injured ? ' <span class="badge ausente">🩹 Lesionado</span>' : ''}</p></div>
      ${editable ? `
        <button id="pd-save" style="width:100%;margin-top:4px">Guardar cambios</button>
        <button class="secondary" id="pd-toggle-active" style="width:100%;margin-top:8px">${p.active?'Desactivar':'Activar'}</button>
        <button class="secondary" id="pd-toggle-injured" style="width:100%;margin-top:8px">${p.injured?'Quitar lesión':'🩹 Marcar lesionado'}</button>
      ` : ''}
    </div>
  `;
  $('#pd-back').addEventListener('click', closePlayerDetail);
  if(editable){
    $('#pd-photo-save').addEventListener('click', async ()=>{
      const file = $('#pd-photo-input').files[0];
      if(!file){ toast('Selecciona una imagen primero', true); return; }
      if(!file.type.startsWith('image/')){ toast('La foto debe ser una imagen (PNG, JPG, etc.)', true); return; }
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `players/${id}-${Date.now()}.${ext}`;
      const { error: upErr } = await supabase.storage.from('match-photos').upload(path, file, { upsert: true });
      if(upErr){ toast(upErr.message, true); return; }
      const { data: pub } = supabase.storage.from('match-photos').getPublicUrl(path);
      const { error } = await supabase.from('players').update({ photo_url: pub.publicUrl }).eq('id', id);
      if(error){ toast(error.message, true); return; }
      toast('Foto actualizada');
      await loadPlayersCache();
      renderPlayersRows(); renderPlayerCards();
      openPlayerDetail(id);
    });
    $('#pd-save').addEventListener('click', async ()=>{
      const jersey_number = Number($('#pd-jersey').value);
      if(!jersey_number){ toast('Número inválido', true); return; }
      const payload = {
        jersey_number,
        birth_date: $('#pd-birth').value || null,

      renderPlayersRows(); renderPlayerCards();
      closePlayerDetail();
    });

      await supabase.from('players').update({active: !p.active}).eq('id', id);

      openPlayerDetail(id);

      const { error } = await supabase.from('players').update({injured: !p.injured}).eq('id', id);
      if(error){ toast(error.message, true); return; }
      await loadPlayersCache();
      renderPlayersRows(); renderPlayerCards();
      openPlayerDetail(id);
    });
  }
}
function closePlayerDetail(){
  $('#player-detail-view').style.display = 'none';
  // Se limpia el estilo inline (en vez de forzar 'block') para que la
  // visibilidad vuelva a depender de la clase .mobile-only / el breakpoint,
  // y no quede fijada a "siempre visible" sin importar el tamaño de pantalla.
  $('#jugadores-mobile').style.removeProperty('display');
}

// Convocatoria (partidos y entrenamientos) — no se le pide respuesta ni se le

  const { error } = await supabase.from('players').update({injured: !injured}).eq('id', id);

  toast(!injured ? 'Jugador marcado como lesionado' : 'Lesión retirada del jugador');
  await loadPlayersCache();
  renderPlayersRows();
};

// ---------------- USUARIOS (solo usuario maestro: crear login de jugadores y cuerpo técnico) ----------------
// supabase.functions.invoke() solo llena "data" cuando la función responde 2xx. Cuando
// responde con un código de error (401/403/etc.), el mensaje real que armamos en el
// backend (ej. "Solo el usuario maestro puede crear cuentas.") queda en el cuerpo de la
// respuesta de error, no en "data" — hay que leerlo a mano para no mostrar solo el
// mensaje genérico "Edge Function returned a non-2xx status code".
async function extractFunctionError(data, error){
  if(data?.error) return data.error;
  if(!error) return null;
  try{
    const body = await error.context.json();
    if(body?.error) return body.error;
  }catch(e){ /* el cuerpo no era JSON, seguimos con el mensaje genérico */ }
  return error.message;
}

    document.documentElement.style.setProperty('--team-photo-img', `url("${pub.publicUrl}")`);
    toast('Foto del equipo actualizada');
    renderUsuarios();
  });

  $('#nu-save').addEventListener('click', async ()=>{
    const type = typeSel.value;
    const email = $('#nu-email').value.trim();
    const password = $('#nu-password').value;
    $('#nu-error').textContent = '';
    if(!email || !password){ $('#nu-error').textContent = 'Correo y contraseña son obligatorios.'; return; }
    if(password.length < 6){ $('#nu-error').textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }

    let payload;
    if(type === 'jugador' || type === 'fichaje'){
      const player_id = playerSel.value;
      if(!player_id){ $('#nu-error').textContent = 'Selecciona a qué jugador se vincula esta cuenta.'; return; }
      const player = playersCache.find(p => p.id === player_id);
      payload = { email, password, full_name: player.full_name, role: type, player_id };
    } else {
      const full_name = nameInput.value.trim();
      if(!full_name){ $('#nu-error').textContent = 'Escribe el nombre completo.'; return; }
      payload = { email, password, full_name, role: 'cuerpo_tecnico', player_id: null };
    }

    $('#nu-save').disabled = true;
    const { data, error } = await supabase.functions.invoke('admin-create-user', {
      body: payload,
      headers: { Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_PUBLISHABLE_KEY },
    });
    $('#nu-save').disabled = false;
    const errMsg = await extractFunctionError(data, error);
    if(errMsg){ $('#nu-error').textContent = errMsg; return; }
    toast('Cuenta creada. Comparte el correo y la contraseña con esa persona.');
    renderUsuarios();
  });
}
