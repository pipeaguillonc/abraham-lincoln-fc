<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abraham Lincoln FC — Copa Futbolgol</title>
<!-- ExcelJS: genera archivos .xlsx con formato (encabezados en negrita, anchos de columna, moneda) directamente en el navegador -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<!-- Tipografía condensada estilo póster retro/vintage, para los títulos grandes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    /* Línea gráfica "vintage retro fútbol" — fondo crema/papel, tinta casi
       negra, y los colores del equipo (negro y amarillo) como acento
       principal, con rojo/azul como acentos secundarios tipo póster. */
    --bg:#efe2c3; --panel:#fbf4e4; --panel2:#e7d8b4; --border:#d6c39a;
    --text:#1c1a16; --muted:#786a4e; --accent:#1f7a4d; --accent2:#2f5f9e;
    --warn:#c98a12; --danger:#c23b32;
    /* Colores del equipo: Abraham Lincoln FC (negro y amarillo) */
    --brand:#f4c515; --brand-dark:#171512;
    --poster-red:#d64545; --poster-blue:#2f5f9e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  .display-font{font-family:'Anton',Impact,sans-serif;letter-spacing:.01em}

  @keyframes float-ball{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-14px) rotate(18deg)}
  }
  .floating-ball{display:inline-block;animation:float-ball 2.6s ease-in-out infinite}

  /* Ilustración genérica de "jugadores" (pictogramas, no personas reales) que
     acompaña el login en pantallas anchas — homenaje al fútbol sin usar fotos
     ni retratos de nadie en particular. Textura de puntos (halftone) detrás,
     como en los afiches deportivos impresos de los 80. */
  .login-illustration{display:none}
  @media (min-width: 900px){
    .login-illustration{
      display:flex;align-items:flex-end;margin-right:8px;padding:24px 10px 0;position:relative;
      background-image:radial-gradient(var(--poster-blue) 1.6px, transparent 1.6px);
      background-size:14px 14px;background-position:0 0;
      -webkit-mask-image:radial-gradient(ellipse 100% 90% at 50% 100%, #000 55%, transparent 100%);
      mask-image:radial-gradient(ellipse 100% 90% at 50% 100%, #000 55%, transparent 100%);
      opacity:.9;
    }
    .player-svg{width:175px;height:auto;position:relative}
    .player-svg-2{margin-left:-46px;margin-bottom:-4px}
    .player-svg-3{margin-left:-40px;margin-bottom:10px;width:140px}
  }

  /* Fondo "póster vintage": papel color crema, confeti geométrico (triángulos
     rojo/azul/amarillo) en las esquinas y una cuadrícula finita de líneas,
     como en afiches deportivos retro. */
  .retro-hero{position:relative;overflow:hidden;background:var(--bg)}
  .retro-hero::before{
    /* Cuadrícula fina arriba a la derecha */
    content:'';position:absolute;top:0;right:0;width:45%;height:40%;
    background-image:linear-gradient(var(--poster-blue) 1px,transparent 1px),linear-gradient(90deg,var(--poster-blue) 1px,transparent 1px);
    background-size:26px 26px;opacity:.18;
    -webkit-mask-image:linear-gradient(225deg,#000 30%,transparent 75%);
    mask-image:linear-gradient(225deg,#000 30%,transparent 75%);
  }
  .retro-hero::after{
    /* Confeti geométrico abajo a la izquierda */
    content:'';position:absolute;bottom:-40px;left:-40px;width:220px;height:220px;
    background:
      conic-gradient(from 20deg at 20% 80%, var(--poster-red) 0 30deg, transparent 30deg 360deg),
      conic-gradient(from 200deg at 70% 90%, var(--brand) 0 40deg, transparent 40deg 360deg),
      conic-gradient(from 100deg at 45% 55%, var(--poster-blue) 0 35deg, transparent 35deg 360deg);
    opacity:.5;
  }
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
  .login-box{position:relative;z-index:1;background:var(--panel);padding:32px;border-radius:6px;width:340px;border:2px solid var(--brand-dark)}
  .login-box h1{font-size:26px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.01em;color:var(--brand-dark);font-family:'Anton',Impact,sans-serif}
  .login-box p{color:var(--muted);font-size:13px;margin:0 0 20px}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  input,select,textarea{width:100%;padding:9px 10px;margin-bottom:12px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
  button{cursor:pointer;padding:10px 16px;border-radius:6px;border:none;background:var(--brand-dark);color:#fbf4e4;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:13px}
  button.secondary{background:transparent;color:var(--brand-dark);border:2px solid var(--brand-dark)}
  button.danger{background:var(--danger);color:white}
  .card-select{width:68px;height:46px;font-size:19px;font-weight:800;text-align:center;text-align-last:center;border-radius:8px;border-width:2px;border-style:solid}
  .card-select-yellow{background:#3a2a06;color:var(--warn);border-color:var(--warn)}
  .card-select-red{background:#3a0d0d;color:var(--danger);border-color:var(--danger)}
  button.small{padding:5px 10px;font-size:12px}
  #app{display:none;min-height:100vh;grid-template-columns:220px 1fr}
  #app.active{display:grid}
  nav{background:var(--panel);border-right:3px solid var(--brand-dark);padding:18px 12px;display:flex;flex-direction:column;position:relative}
  .nav-rainbow-bar{position:absolute;top:0;left:0;right:0;height:4px;background:var(--brand);pointer-events:none}
  nav h2{font-size:16px;margin:4px 8px 18px;color:var(--brand-dark);font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
  nav .who{font-size:12px;color:var(--muted);margin:0 8px 16px}
  nav button.nav-btn{background:transparent;color:var(--text);text-align:left;margin-bottom:4px;font-weight:500;position:relative;border-radius:8px;transition:background .15s}
  nav button.nav-btn:hover{background:var(--panel2)}
  nav button.nav-btn.active{background:var(--brand-dark);color:#fbf4e4;box-shadow:inset 3px 0 0 var(--brand)}
  nav .logout{margin-top:auto}
  .nav-badge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;text-align:center}
  .notify-banner{background:var(--panel2);border:2px solid var(--poster-blue);border-radius:10px;padding:16px;margin-bottom:20px}
  .notify-banner h3{margin:0 0 4px}
  .notify-item{background:var(--panel);border-radius:8px;padding:10px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  main{padding:24px;overflow-y:auto;max-height:100vh}
  h2.section-title{margin-top:0;display:flex;align-items:center;gap:8px;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;font-weight:400}
  h2.section-title::before{content:'⚽';font-size:.85em}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--border);border-top:4px solid var(--brand);border-radius:6px;padding:16px;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-top-color:var(--poster-red)}
  .card .num{font-size:26px;font-weight:700}
  .dash-hero{background:var(--brand-dark);border-radius:6px;margin-bottom:20px}
  .dash-hero-inner{padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:14px;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
  .card .label{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
  tr:last-child td{border-bottom:none}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px}
  .panel h3{margin-top:0}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:140px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .badge.presente{background:#052e16;color:var(--accent)}
  .badge.tarde{background:#3f2d02;color:var(--warn)}
  .badge.ausente{background:#3f0d0d;color:var(--danger)}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{background:var(--panel2);color:var(--muted)}
  .tabs button.active{background:var(--accent);color:#052e16}
  .comment{background:var(--panel2);border-radius:8px;padding:10px;margin-bottom:8px}
  .comment .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
  .embed-wrap{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .embed-wrap iframe{border-radius:8px;border:none}
  .stars{color:var(--warn);font-size:14px}
  .muted{color:var(--muted);font-size:12px}
  .close-x{float:right;cursor:pointer;color:var(--muted)}
  .match-card{cursor:pointer}
  .match-card:hover{border-color:var(--accent)}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--border);padding:12px 16px;border-radius:8px;z-index:50}
  .rating-input{width:72px !important;min-width:72px;height:44px;padding:8px 4px !important;text-align:center;font-size:20px;font-weight:700;margin-bottom:0 !important;color:var(--warn)}
  .stat-input{width:64px !important;min-width:64px;height:44px;padding:8px 4px !important;text-align:center;font-size:18px;font-weight:600;margin-bottom:0 !important}
  iframe{max-width:100%}

  /* ============= RESPONSIVE (celular / tablet) ============= */
  /* #menu-toggle y #nav-overlay quedan del diseño anterior (menú lateral
     oculto); en celular ya no se usan — el menú pasó a ser una barra
     horizontal fija arriba, siempre visible, sin necesidad de abrirla. */
  #menu-toggle{display:none}
  #nav-overlay{display:none}

  @media (max-width: 860px){
    #app.active{display:block}

    /* La barra de módulos pasa de menú lateral a una barra horizontal fija
       arriba de la pantalla, con scroll hacia los lados si no caben todos
       los botones. Así el menú siempre está a la vista, sin tener que
       abrir nada. */
    nav{
      position:fixed;top:0;left:0;right:0;height:auto;width:100%;z-index:100;
      flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;padding:8px 10px;gap:6px;
      border-right:none;border-bottom:3px solid var(--brand);
      box-shadow:0 2px 10px rgba(0,0,0,.4);
    }
    nav h2,nav .who{display:none}
    nav button.nav-btn{
      flex:0 0 auto;white-space:nowrap;margin-bottom:0;padding:9px 13px;
      font-size:13.5px;min-height:38px;border-radius:20px;
    }
    nav .logout{margin-top:0;flex:0 0 auto}
    nav .logout button{white-space:nowrap;padding:9px 13px;min-height:38px}
    /* Sombra al borde derecho de la barra: avisa que hay más módulos si
       se desliza hacia el lado (la barra no alcanza a mostrarlos todos). */
    nav::after{
      content:'';position:absolute;top:0;right:0;bottom:0;width:28px;
      background:linear-gradient(to right, transparent, var(--panel));
      pointer-events:none;
    }
    main{padding:72px 12px 24px;max-height:none}
    h2.section-title{font-size:18px}
    #login-screen,#force-password-screen{padding:20px}
    .login-box{width:100%;max-width:340px;padding:24px}

    /* Los formularios en fila (.row) se apilan en una sola columna: en
       celular, dos o tres campos angostos uno al lado del otro quedan
       difíciles de tocar y de leer. */
    .row{flex-direction:column;gap:8px}
    .row > *{min-width:100%;width:100%}

    /* Objetivos de toque más grandes: botones e inputs un poco más altos
       para que sean fáciles de presionar con el dedo. */
    input,select,textarea{padding:12px 10px;font-size:16px}
    button{padding:12px 16px;min-height:44px}
    button.small{padding:9px 12px;min-height:38px}

    /* Cada tabla se desplaza horizontalmente por sí sola (en vez de
       arrastrar toda la pantalla, botones incluidos, hacia los lados). */
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
    table{min-width:560px;white-space:nowrap}
    th,td{padding:10px 12px;white-space:nowrap}

    .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .tabs{gap:8px}
    .tabs button{padding:10px 14px;min-height:40px}
    .toast{left:16px;right:16px;bottom:16px}
  }
  @media (max-width: 420px){
    .login-box{padding:20px}
    .cards{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

  </div>
  <div class="login-box">
    <h1><span class="floating-ball">⚽</span> Abraham Lincoln FC</h1>
    <p>Papás del Colegio Abraham Lincoln · Copa Futbolgol. Inicia sesión con tu cuenta (creada por el cuerpo técnico).</p>
    <input id="login-email" type="email" placeholder="Correo" />

<!-- ============= CAMBIO DE CONTRASEÑA OBLIGATORIO (primer login o tras un restablecimiento) ============= -->

  <div class="login-box">

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ======================================================
// CONFIGURACIÓN — reemplaza estos valores
// ======================================================
const SUPABASE_URL = "https://qmjqceyqbtikixabcvnk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtanFjZXlxYnRpa2l4YWJjdm5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NDMzNTksImV4cCI6MjEwMjMxOTM1OX0.3Wqq7QN_SO6whhQ3lsHFNaudkABM4zAtBbiOGNSCFiU";
// Supabase ahora tiene dos sistemas de llaves: la "anon" de arriba (formato JWT,
// funciona bien para las llamadas normales de la app) y esta "publishable" nueva,
// que es la única que aceptan las Edge Functions (admin-create-user /
// admin-reset-password) como header "apikey". Si alguna vez la cambias en
// Supabase (Settings > API Keys > Publishable and secret API keys), actualízala
// aquí también.
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_9og9uAqNyXTkopCTvOiIHg_aRiPibji";

// YouTube Data API v3 (https://console.cloud.google.com/apis)
const YOUTUBE_API_KEY = "TU_YOUTUBE_API_KEY";
const YOUTUBE_CHANNEL_ID = "TU_YOUTUBE_CHANNEL_ID";

// Instagram: las llamadas reales a Graph API se hacen desde un Edge
// Function de Supabase (ver /supabase/functions/instagram-media) para
// no exponer el access token en el navegador y evitar problemas de CORS.
const INSTAGRAM_PROXY_URL = "https://TU-PROYECTO.functions.supabase.co/instagram-media";
// ======================================================

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
let profile = null; // { id, full_name, role, player_id }
let currentView = 'dashboard';
let playersCache = [];
let currentSeasonCache = null; // temporada marcada is_current, se carga al iniciar sesión y se refresca en "Temporadas"
async function loadCurrentSeason(){
  const { data } = await supabase.from('seasons').select('*').eq('is_current', true).maybeSingle();
  currentSeasonCache = data || null;
}
function currentSeasonId(){ return currentSeasonCache?.id || null; }

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const main = $('#main-content');

// Envuelve cada <table> en un contenedor que se desplaza hacia los lados por
// sí solo (en vez de deformar la tabla con el truco de CSS "display:block",
// que en Safari/iOS descuadra el encabezado respecto a las filas porque cada
// uno termina generando su propia tabla interna). Corre automáticamente cada
// vez que una vista mete tablas nuevas en el DOM, sin tener que tocar cada
// función renderX() una por una.
const tableWrapObserver = new MutationObserver(()=>{
  $$('table', main).forEach(t=>{
    if(t.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
});
tableWrapObserver.observe(main, { childList: true, subtree: true });

function toast(msg, isError=false){

}

function fmtDate(d){ if(!d) return '-'; return new Date(d+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMoney(n){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0); }

// ---------------- EXPORTAR A EXCEL (ExcelJS) ----------------
// Descarga el workbook generado como archivo .xlsx en el navegador.
async function downloadWorkbook(workbook, filename){
  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
// Da formato de encabezado (negrita, fondo oscuro, texto blanco) a la primera fila de una hoja.
function styleHeaderRow(sheet){
  const row = sheet.getRow(1);
  row.font = { bold: true, color: { argb: 'FFFFFFFF' } };
  row.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
  row.alignment = { vertical: 'middle' };
}

// Link "Cómo llegar" (Google Maps, Waze o cualquier URL que haya puesto el
// cuerpo técnico) — se abre en pestaña nueva y nunca rompe el layout si no
// hay link cargado.
function mapsLink(url, label){
  if(!url) return '';
  // Si pegaron el link sin "https://" (por ejemplo, copiando solo el texto
  // visible), el navegador lo trata como una ruta interna de la app y el
  // clic no lleva a ningún lado. Se le agrega el esquema automáticamente.
  let href = url.trim();
  if(!/^https?:\/\//i.test(href)) href = 'https://' + href;
  const safeUrl = href.replace(/"/g,'&quot;');
  return `<a href="${safeUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${label || '📍 Cómo llegar'}</a>`;
}

// Link "Cómo llegar" con respaldo automático: si el cuerpo técnico solo
// escribió el nombre del lugar (campo "Lugar") pero no pegó un link de Google
// Maps/Waze, se arma un link de búsqueda de Google Maps con ese texto para
// que el pin siempre quede clickeable en vez de mostrar solo el nombre suelto.
function mapsLinkAuto(location, location_url){
  const url = location_url || (location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}` : '');
  return url ? mapsLink(url) : '';
}

// Tarjeta "próximo entrenamiento": fecha, horario y lugar juntos.
async function fetchNextTrainingCard(){
  const { data } = await supabase.from('trainings').select('*').gte('session_date', new Date().toISOString().slice(0,10)).order('session_date').limit(1);

      ${(t.location || t.location_url) ? `<div style="margin-top:4px">${mapsLinkAuto(t.location, t.location_url)}</div>` : ''}

// Tarjeta "próximo partido": rival, uniforme y horario juntos.
async function fetchNextMatchCard(){
  const { data: matches } = await supabase.from('matches').select('*').gte('match_date', new Date().toISOString().slice(0,10)).order('match_date').limit(1);
  const m = matches?.[0];
  if(!m) return `<div class="card"><div class="label">Próximo partido</div><div class="num" style="font-size:16px">Sin programar</div></div>`;
  const { data: cu } = await supabase.from('call_ups').select('uniform').eq('match_id', m.id).maybeSingle();
  return `

      <div class="label">Próximo partido</div>

      <div class="muted">${fmtDate(m.match_date)}${m.match_time ? ' · 🕒 '+m.match_time.slice(0,5) : ''}</div>
      ${m.location ? `<div class="muted">📍 ${m.location}</div>` : ''}
      ${cu?.uniform ? `<div class="muted">👕 ${UNIFORM_LABELS[cu.uniform]||cu.uniform}</div>` : ''}
      ${(m.location || m.location_url) ? `<div style="margin-top:4px">${mapsLinkAuto(m.location, m.location_url)}</div>` : ''}
    </div>
  `;
}

// Tarjeta única con el próximo evento del equipo (partido o entrenamiento, lo
// que caiga primero) — usada en el Dashboard de TODOS los roles, en vez de dos
// tarjetas separadas. Se muestra siempre que haya un partido o entreno
// programado a futuro (sin límite de días), para que la ubicación quede
// visible con anticipación.
async function fetchNextEventCard(){
  const today = new Date().toISOString().slice(0,10);
  const [{ data: trainings }, { data: matches }] = await Promise.all([
    supabase.from('trainings').select('*').gte('session_date', today).order('session_date').limit(1),
    supabase.from('matches').select('*').gte('match_date', today).order('match_date').limit(1),
  ]);
  const t = trainings?.[0], m = matches?.[0];
  if(!t && !m) return '';
  const matchIsNext = m && (!t || m.match_date <= t.session_date);
  return matchIsNext ? await fetchNextMatchCard() : await fetchNextTrainingCard();
}

// Recordatorio para el cuerpo técnico: partidos que ya se jugaron pero
// todavía no tienen ninguna calificación (técnica/física/táctica/mental)
// cargada para sus jugadores — para que no se le pase calificarlos.
async function renderUnratedMatchesReminder(){
  const container = $('#notify-banner');
  if(!container) return;
  const today = new Date().toISOString().slice(0,10);
  const [{ data: pastMatches }, { data: evals }] = await Promise.all([
    supabase.from('matches').select('id, opponent, match_date').lt('match_date', today).order('match_date', {ascending:false}),
    supabase.from('evaluations').select('match_id').not('match_id', 'is', null),
  ]);
  const ratedMatchIds = new Set((evals||[]).map(e=>e.match_id));
  const unrated = (pastMatches||[]).filter(m=>!ratedMatchIds.has(m.id));
  if(!unrated.length){ container.innerHTML = ''; return; }
  container.innerHTML = `
    <div class="notify-banner">
      <h3>⚠️ Tienes ${unrated.length} partido${unrated.length>1?'s':''} sin calificar</h3>
      <p class="muted">Ya se jugaron pero todavía no les cargas la calificación (técnica/física/táctica/mental) a los jugadores. Entra a Partidos → selecciona el partido → Editar partido para calificarlos.</p>
      <ul style="margin:4px 0 0;padding-left:18px">
        ${unrated.map(m=>`<li>vs ${m.opponent} · ${fmtDate(m.match_date)}</li>`).join('')}
      </ul>
    </div>
  `;
}

// Tabla de posiciones de la Copa Futbolgol (torneo que juega el equipo),
// tomada en vivo de futbolgol.com a través de la Edge Function
// "fetch-standings" (el fetch se hace del lado del servidor porque el sitio
// de Futbolgol no permite llamadas directas desde el navegador). Muestra los
// primeros 10 puestos y, si Abraham Lincoln no está entre ellos, lo agrega
// como una fila extra con su posición real.
async function renderTournamentStandings(){
  const container = $('#tabla-torneo');
  if(!container) return;
  container.innerHTML = `<h3 class="section-title" style="margin-top:8px">Tabla de posiciones · Copa Futbolgol</h3><p class="muted">Cargando tabla…</p>`;
  try{
    // Este proyecto usa el sistema nuevo de llaves de Supabase. El cliente
    // global se creó con la llave anon "legacy" (formato JWT), que la
    // pasarela de Edge Functions rechaza. Por eso aquí forzamos los headers
    // con la publishable key nueva, que sí autentica correctamente.
    const { data, error } = await supabase.functions.invoke('fetch-standings', {
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}` },
    });
    if(error || !data || data.error) throw new Error(data?.error || error?.message || 'No se pudo cargar la tabla');
    const rows = [...(data.top10||[])];
    if(data.ourTeam && !data.ourInTop10) rows.push(data.ourTeam);
    container.innerHTML = `
      <h3 class="section-title" style="margin-top:8px">Tabla de posiciones · Copa Futbolgol</h3>
      <table>
        <thead><tr><th>Pos</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>GD</th><th>PTS</th></tr></thead>
        <tbody>
          ${rows.map(r=>{
            const isUs = (r.href||'').includes('abraham-lincoln');
            return `<tr style="${isUs?'font-weight:700;background:var(--panel2)':''}">
              <td>${r.pos ?? '-'}</td><td>${isUs?'⭐ ':''}${r.team}</td><td>${r.pj??'-'}</td><td>${r.pg??'-'}</td><td>${r.pe??'-'}</td><td>${r.pp??'-'}</td><td>${r.gf??'-'}</td><td>${r.gc??'-'}</td><td>${r.gd??'-'}</td><td>${r.pts??'-'}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="10" class="muted">Sin datos todavía.</td></tr>'}
        </tbody>
      </table>
      <p class="muted" style="margin-top:6px">Actualizado ${new Date(data.updatedAt).toLocaleString('es-ES')} · <a href="${data.source}" target="_blank" rel="noopener">Ver tabla completa en Futbolgol</a></p>
    `;
  }catch(err){
    container.innerHTML = `
      <h3 class="section-title" style="margin-top:8px">Tabla de posiciones · Copa Futbolgol</h3>
      <p class="muted">No se pudo cargar la tabla en este momento. <a href="https://www.futbolgol.com/copa/" target="_blank" rel="noopener">Verla directo en Futbolgol</a>.</p>
    `;
  }
}

async function renderDashboard(){
  main.innerHTML = `
    <h2 class="section-title">Dashboard</h2>
    <div class="dash-hero"><div class="dash-hero-inner"><span class="floating-ball">⚽</span> ¡Vamos Abraham Lincoln FC! <span class="floating-ball" style="animation-delay:.4s">⚽</span></div></div>
    <div id="notify-banner"></div><div id="dash-cards" class="cards"><p class="muted">Cargando…</p></div><div id="tabla-torneo"></div><div id="top-scorers"></div>`;
  renderTournamentStandings();
  if(isMaster()){
    const [{count: activePlayers}, summaryRes, nextEventCard] = await Promise.all([
      // Un jugador lesionado no cuenta como "activo" en este contador del Dashboard.
      supabase.from('players').select('*', {count:'exact', head:true}).eq('active', true).eq('injured', false),
      supabase.rpc('team_financial_summary'),
      fetchNextEventCard(),
    ]);
    const s = summaryRes.data || {};
    $('#dash-cards').innerHTML = `
      <div class="card"><div class="num">${activePlayers ?? '-'}</div><div class="label">Jugadores activos</div></div>
      ${nextEventCard}
      <div class="card"><div class="num">${fmtMoney(s.total_recaudado)}</div><div class="label">Recaudado</div></div>
      <div class="card"><div class="num">${fmtMoney(s.total_gastado)}</div><div class="label">Gastado</div></div>
      <div class="card"><div class="num">${fmtMoney((s.total_recaudado||0)-(s.total_gastado||0))}</div><div class="label">Saldo en caja</div></div>
    `;
  } else if(isAdmin()){
    renderUnratedMatchesReminder();
    const [{count: activePlayers}, nextEventCard] = await Promise.all([
      // Un jugador lesionado no cuenta como "activo" en este contador del Dashboard.
      supabase.from('players').select('*', {count:'exact', head:true}).eq('active', true).eq('injured', false),
      fetchNextEventCard(),
    ]);
    $('#dash-cards').innerHTML = `
      <div class="card"><div class="num">${activePlayers ?? '-'}</div><div class="label">Jugadores activos</div></div>
      ${nextEventCard}
    `;
  } else {
    renderPlayerNotifications();
    const pid = profile.player_id;
    // El % de participación (y el resto de estadísticas de partidos) se calculan solo
    // sobre partidos que YA se jugaron a la fecha — así el numerador (partidos jugados)
    // y el denominador (partidos ya disputados por el equipo) quedan en la misma base.
    // Si no se filtrara también el numerador (con el join a matches), un partido
    // reprogramado a futuro después de haber guardado sus estadísticas podía inflar
    // el % por encima de 100%.
    const today = new Date().toISOString().slice(0,10);
    const [{data: att}, {data: stats}, {data: dues}, {data: pays}, {count: recCount}, {count: totalMatches}, nextEventCard] = await Promise.all([
      supabase.from('attendance').select('status').eq('player_id', pid),
      supabase.from('player_match_stats').select('minutes_played,goals,assists,yellow_cards,red_cards, matches!inner(match_date)').eq('player_id', pid).lte('matches.match_date', today).order('created_at', {ascending:false}),
      supabase.from('payment_dues').select('amount_due').eq('player_id', pid),
      supabase.from('payments').select('amount').eq('player_id', pid),
      supabase.from('player_recommendations').select('*', {count:'exact', head:true}).eq('player_id', pid),
      supabase.from('matches').select('*', {count:'exact', head:true}).lte('match_date', today),
      fetchNextEventCard(),
    ]);
    const total = att?.length || 0;
    const presentes = att?.filter(a=>a.status!=='ausente').length || 0;
    const pctEntrenos = total ? Math.round((presentes/total)*100) : 0;
    const partidosJugados = stats?.length || 0;
    const pctPartidos = totalMatches ? Math.round((partidosJugados/totalMatches)*100) : 0;
    const minutosTotales = (stats||[]).reduce((a,s)=>a+s.minutes_played,0);
    const minutosPromedio = partidosJugados ? Math.round(minutosTotales/partidosJugados) : 0;
    const minutosUltimo = stats?.[0]?.minutes_played ?? 0;
    const goles = (stats||[]).reduce((a,s)=>a+s.goals,0);
    const asistencias = (stats||[]).reduce((a,s)=>a+s.assists,0);
    const amarillas = (stats||[]).reduce((a,s)=>a+s.yellow_cards,0);
    const rojas = (stats||[]).reduce((a,s)=>a+s.red_cards,0);
    const totalDue = (dues||[]).reduce((a,d)=>a+Number(d.amount_due),0);
    const totalPaid = (pays||[]).reduce((a,p)=>a+Number(p.amount),0);
    const me = playersCache.find(p=>p.id===pid);
    $('#dash-cards').innerHTML = `
      ${nextEventCard}
      <div class="card"><div class="num">#${me?.jersey_number ?? '-'}</div><div class="label">Tu camiseta</div></div>
      <div class="card"><div class="num">${pctEntrenos}%</div><div class="label">Asistencia a entrenamientos</div></div>
      <div class="card"><div class="num">${pctPartidos}%</div><div class="label">Participación en partidos</div></div>
      <div class="card"><div class="num">${minutosUltimo}</div><div class="label">Minutos último partido</div></div>
      <div class="card"><div class="num">${minutosPromedio}</div><div class="label">Minutos promedio / partido</div></div>
      <div class="card"><div class="num">${partidosJugados}</div><div class="label">Partidos jugados</div></div>
      <div class="card"><div class="num">${goles}</div><div class="label">Goles</div></div>
      <div class="card"><div class="num">${asistencias}</div><div class="label">Asistencias</div></div>
      <div class="card"><div class="num">${amarillas}</div><div class="label">Tarjetas amarillas</div></div>
      <div class="card"><div class="num">${rojas}</div><div class="label">Tarjetas rojas</div></div>
      <div class="card"><div class="num">${recCount ?? 0}</div><div class="label">Recomendaciones del técnico</div></div>
    `;
    // "fichaje" es igual a "jugador" pero sin nada del módulo financiero —
    // ni el ítem de menú "Resumen financiero" (ver buildNav) ni este resumen
    // dentro del Dashboard.
    if(profile.role !== 'fichaje'){
      $('#dash-cards').insertAdjacentHTML('afterend', `
        <h3 class="section-title" style="margin-top:8px">Módulo financiero</h3>
        <div class="cards">
          <div class="card"><div class="num">${fmtMoney(totalDue)}</div><div class="label">Total en cuotas</div></div>
          <div class="card"><div class="num">${fmtMoney(totalPaid)}</div><div class="label">Total pagado</div></div>
          <div class="card"><div class="num">${fmtMoney(totalDue-totalPaid)}</div><div class="label">Saldo pendiente</div></div>
        </div>
      `);
    }
  }

  // Top 5 goleadores del equipo — visible en el Dashboard de todos los roles
  // (usuario maestro, cuerpo técnico, jugador y fichaje).
  const [{ data: goalStats }, { data: allPlayers }] = await Promise.all([
    supabase.from('player_match_stats').select('player_id, goals'),
    supabase.from('players').select('id, full_name, jersey_number').eq('active', true),
  ]);
  const goalsByPlayer = {};
  (goalStats||[]).forEach(s=>{ goalsByPlayer[s.player_id] = (goalsByPlayer[s.player_id]||0) + (s.goals||0); });
  const topScorers = (allPlayers||[])
    .map(p=>({ ...p, goals: goalsByPlayer[p.id] || 0 }))
    .filter(p=>p.goals > 0)
    .sort((a,b)=>b.goals - a.goals)
    .slice(0,5);
  $('#top-scorers').innerHTML = `
    <h3 class="section-title" style="margin-top:8px">Top 5 goleadores del equipo</h3>
    ${topScorers.length ? `
    <table><thead><tr><th>#</th><th>Jugador</th><th>Goles</th></tr></thead>
    <tbody>${topScorers.map((p,i)=>`<tr><td>${i+1}</td><td>#${p.jersey_number} ${p.full_name}</td><td>${p.goals}</td></tr>`).join('')}</tbody></table>
    ` : '<p class="muted">Todavía no hay goles registrados.</p>'}
  `;
}

let playerRatings = {}; // player_id -> promedio de calificación (1-5)

async function loadPlayerRatings(){
  const { data: evals } = await supabase.from('evaluations').select('player_id,technique,physical,tactical,mental');
  const sums = {};
  (evals||[]).forEach(e=>{
    const vals = [e.technique, e.physical, e.tactical, e.mental].filter(v=>v!=null);
    if(!vals.length) return;
    const avg = vals.reduce((a,v)=>a+v,0) / vals.length;
    if(!sums[e.player_id]) sums[e.player_id] = [];
    sums[e.player_id].push(avg);
  });
  playerRatings = {};
  Object.entries(sums).forEach(([pid, arr])=>{
    playerRatings[pid] = arr.reduce((a,v)=>a+v,0) / arr.length;
  });
}

// ---------------- USUARIOS (solo usuario maestro: crear login de jugadores y cuerpo técnico) ----------------
// supabase.functions.invoke() solo llena "data" cuando la función responde 2xx. Cuando
// responde con un código de error (401/403/etc.), el mensaje real que armamos en el
// backend (ej. "Solo el usuario maestro puede crear cuentas.") queda en el cuerpo de la
// respuesta de error, no en "data" — hay que leerlo a mano para no mostrar solo el
// mensaje genérico "Edge Function returned a non-2xx status code".
async function extractFunctionError(data, error){
  if(data?.error) return data.error;
  if(!error) return null;
  try{
    const body = await error.context.json();
    if(body?.error) return body.error;
  }catch(e){ /* el cuerpo no era JSON, seguimos con el mensaje genérico */ }
  return error.message;
}

async function renderEntrenamientos(){
  // Del más reciente (próximo o recién realizado) al más lejano en el tiempo.
  const { data: trainings } = await supabase.from('trainings').select('*').order('session_date', {ascending:true});
  main.innerHTML = `
    <h2 class="section-title">Entrenamientos y asistencia</h2>
    ${canManage() ? `
    <div class="panel">
      <h3>Nuevo entrenamiento</h3>
      <div class="row">
        <input id="nt-date" type="date" />
        <input id="nt-time" type="time" />
        <input id="nt-location" placeholder="Lugar" />
        <input id="nt-notes" placeholder="Notas" />
      </div>
      <div class="row">
        <input id="nt-location-url" placeholder="Link de Google Maps o Waze (opcional)" style="flex:1" />
      </div>
      <button id="nt-save">Crear entrenamiento</button>
    </div>` : ''}
    ${canManage() ? `<button id="nt-export" class="secondary" style="margin-bottom:16px">⬇️ Exportar asistencia a Excel</button>` : ''}
    <div id="trainings-list"></div>
  `;
  const list = $('#trainings-list');
  // Resumen rápido de asistencia (X/Y presentes) para no tener que desplegar cada
  // entrenamiento para saber cómo fue — con el roster completo la lista es larga.
  let presentesByTraining = {};
  if(canManage() && (trainings||[]).length){
    const { data: allAttendance } = await supabase.from('attendance')
      .select('training_id, status').in('training_id', trainings.map(t=>t.id));
    (allAttendance||[]).forEach(a=>{
      if(a.status === 'presente') presentesByTraining[a.training_id] = (presentesByTraining[a.training_id]||0) + 1;
    });
  }
  const totalActive = playersCache.filter(p=>p.active).length;

  // Cada entrenamiento va colapsado por defecto y se despliega al hacer clic — con el
  // roster completo, mostrar todos abiertos a la vez hace la lista interminable.
  const trainingCard = t => {
    const summary = canManage() ? `<span class="muted" style="margin-left:8px">${presentesByTraining[t.id]||0}/${totalActive} presentes</span>` : '';
    return `
    <div class="panel">
      <details>
        <summary style="cursor:pointer">
          <strong>${fmtDate(t.session_date)}</strong> ${t.start_time ? '· '+t.start_time.slice(0,5) : ''} ${t.location ? '· '+t.location : ''}
          ${summary}
        </summary>
        ${t.location_url ? `<div style="margin-top:4px">${mapsLink(t.location_url)}</div>` : ''}
        ${t.notes ? `<div class="muted" style="margin-top:6px">${t.notes}</div>` : ''}
        ${canManage() ? `
        <div class="panel" style="background:var(--panel2);margin-top:10px">
          <p class="muted" style="margin-top:0">Editar entrenamiento (por ejemplo, si cambia la fecha) o eliminarlo si se canceló.</p>
          <div class="row">
            <input type="date" class="et-date" value="${t.session_date}" />
            <input type="time" class="et-time" value="${t.start_time?.slice(0,5)||''}" />
            <input class="et-location" placeholder="Lugar" value="${t.location||''}" />
            <input class="et-notes" placeholder="Notas" value="${t.notes||''}" />
          </div>
          <div class="row">
            <input class="et-location-url" placeholder="Link de Google Maps o Waze (opcional)" value="${t.location_url||''}" style="flex:1" />
          </div>
          <div class="row">
            <button class="small" onclick="window.__saveTraining('${t.id}', this)">Guardar cambios</button>
            <button class="small danger" onclick="window.__deleteTraining('${t.id}')">Eliminar entrenamiento</button>
          </div>
        </div>` : ''}
        <div id="att-${t.id}" style="margin-top:10px">Cargando asistencia…</div>
      </details>
    </div>
  `;
  };
  // Próximos (el más cercano primero) aparte de los ya realizados (el más reciente primero).
  const today = new Date().toISOString().slice(0,10);
  const proximos = (trainings||[]).filter(t=>t.session_date >= today).sort((a,b)=>a.session_date.localeCompare(b.session_date));
  const realizados = (trainings||[]).filter(t=>t.session_date < today).sort((a,b)=>b.session_date.localeCompare(a.session_date));
  list.innerHTML = `
    <h3 class="section-title">Próximos entrenamientos</h3>
    ${proximos.map(trainingCard).join('') || '<p class="muted">No hay entrenamientos próximos.</p>'}
    <h3 class="section-title" style="margin-top:20px">Entrenamientos realizados</h3>
    ${realizados.map(trainingCard).join('') || '<p class="muted">Todavía no se ha realizado ningún entrenamiento.</p>'}
  `;

  for(const t of (trainings||[])) renderAttendanceForTraining(t.id, t.session_date);

  if(canManage()){
    $('#nt-export').addEventListener('click', ()=> exportAttendanceToExcel(trainings||[]));
    $('#nt-save').addEventListener('click', async ()=>{
      const payload = {
        session_date: $('#nt-date').value,
        start_time: $('#nt-time').value || null,
        location: $('#nt-location').value.trim(),
        location_url: $('#nt-location-url').value.trim() || null,
        notes: $('#nt-notes').value.trim(),
        season_id: currentSeasonId(),
      };
      if(!payload.session_date){ toast('La fecha es obligatoria', true); return; }
      const { data: newTraining, error } = await supabase.from('trainings').insert(payload).select().single();
      if(error){ toast(error.message, true); return; }
      // Convocatoria automática: los jugadores la ven de inmediato como notificación.
      const { error: cuError } = await supabase.from('call_ups').insert({
        type: 'entrenamiento',
        training_id: newTraining.id,
        match_id: null,
        event_date: newTraining.session_date,
        uniform: null,
        notes: null,
        created_by: profile.id,
      });
      if(cuError) toast('Entrenamiento creado, pero no se pudo lanzar la convocatoria: ' + cuError.message, true);
      else toast('Entrenamiento creado y convocatoria enviada a los jugadores');
      renderEntrenamientos();
    });
  }
}

    location_url: panel.querySelector('.et-location-url').value.trim() || null,

window.__saveAttendance = async (trainingId, playerId, btn)=>{
  const tr = btn.closest('tr');
  const payload = {
    training_id: trainingId,
    player_id: playerId,
    status: tr.querySelector('.f-status').value,
    arrival_time: tr.querySelector('.f-time').value || null,
    absence_reason: tr.querySelector('.f-reason').value || null,
    reason_notes: tr.querySelector('.f-notes').value || null,
    recorded_by: profile.id,
  };
  const { error } = await supabase.from('attendance').upsert(payload, { onConflict: 'training_id,player_id' });
  if(error){ toast(error.message, true); return; }

  const technique = tr.querySelector('.f-technique')?.value;
  const physical = tr.querySelector('.f-physical')?.value;
  const tactical = tr.querySelector('.f-tactical')?.value;
  const mental = tr.querySelector('.f-mental')?.value;
  if(technique || physical || tactical || mental){
    const evalPayload = {
      player_id: playerId, training_id: trainingId,
      eval_date: tr.dataset.sessionDate,
      evaluator_id: profile.id,
      technique: Number(technique)||null,
      physical: Number(physical)||null,
      tactical: Number(tactical)||null,
      mental: Number(mental)||null,
    };
    const { error: evalError } = await supabase.from('evaluations').upsert(evalPayload, { onConflict: 'player_id,training_id' });
    if(evalError){ toast(evalError.message, true); return; }
  }
  toast('Asistencia y calificación guardadas');
};

// Exporta un .xlsx con una fila por jugador y entrenamiento: asistencia, llegada,
// motivo de ausencia y la calificación (si el DT la registró).
async function exportAttendanceToExcel(trainings){
  if(!trainings.length){ toast('No hay entrenamientos para exportar', true); return; }
  toast('Generando Excel…');
  const [{data: attendance}, {data: evals}] = await Promise.all([
    supabase.from('attendance').select('*'),
    supabase.from('evaluations').select('*').not('training_id', 'is', null),
  ]);
  const trainingById = Object.fromEntries(trainings.map(t=>[t.id, t]));
  const playerById = Object.fromEntries(playersCache.map(p=>[p.id, p]));
  const evalByKey = Object.fromEntries((evals||[]).map(e=>[`${e.training_id}_${e.player_id}`, e]));

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Asistencia');
  ws.columns = [
    { header: 'Fecha', key: 'fecha', width: 14 },
    { header: '#', key: 'num', width: 6 },
    { header: 'Jugador', key: 'jugador', width: 26 },
    { header: 'Estado', key: 'estado', width: 12 },
    { header: 'Llegada', key: 'llegada', width: 10 },
    { header: 'Motivo', key: 'motivo', width: 14 },
    { header: 'Notas', key: 'notas', width: 30 },
    { header: 'Técnica', key: 'tec', width: 10 },
    { header: 'Físico', key: 'fis', width: 10 },
    { header: 'Táctica', key: 'tac', width: 10 },
    { header: 'Mental', key: 'men', width: 10 },
  ];
  styleHeaderRow(ws);

  (attendance||[]).sort((a,b)=>{
    const ta = trainingById[a.training_id]?.session_date || '';
    const tb = trainingById[b.training_id]?.session_date || '';
    return tb.localeCompare(ta);
  }).forEach(a=>{
    const t = trainingById[a.training_id];
    const p = playerById[a.player_id];
    if(!t || !p) return;
    const e = evalByKey[`${a.training_id}_${a.player_id}`];
    ws.addRow({
      fecha: fmtDate(t.session_date),
      num: p.jersey_number,
      jugador: p.full_name,
      estado: a.status,
      llegada: a.arrival_time ? a.arrival_time.slice(0,5) : '-',
      motivo: a.absence_reason || '-',
      notas: a.reason_notes || '',
      tec: e?.technique || '', fis: e?.physical || '', tac: e?.tactical || '', men: e?.mental || '',
    });
  });

  await downloadWorkbook(wb, `asistencia_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel de asistencia descargado');
}

// ---------------- PAGOS DE TARJETAS Y SANCIONES (sección aparte y siempre visible) ----------------
// Es una categoría de gasto normal por debajo (así entra en el presupuesto de
// la temporada junto a las demás), pero tiene su propio panel exclusivo en
// Finanzas para que el cuerpo técnico / usuario maestro no tenga que filtrar
// la lista general de gastos para verlos: quedan aparte y siempre a la vista.
const SANCIONES_CATEGORY_NAME = 'Sanciones y tarjetas (amarillas y rojas)';
let sancionesCategoryId = null;
async function ensureSancionesCategory(){
  const seasonId = currentSeasonId();
  let cat = expenseCategories.find(c => c.name === SANCIONES_CATEGORY_NAME);
  if(!cat){
    // No existe todavía para esta temporada (por ejemplo, una temporada nueva) — se crea sola.
    const { data, error } = await supabase.from('expense_categories')
      .insert({ name: SANCIONES_CATEGORY_NAME, estimated_amount: 0, season_id: seasonId })
      .select().single();
    if(!error && data){ cat = data; expenseCategories.push(data); }
  }
  sancionesCategoryId = cat?.id || null;
}
async function loadSancionesPagos(){
  if(!sancionesCategoryId) return [];
  const { data } = await supabase.from('team_expenses')
    .select('*')
    .eq('category_id', sancionesCategoryId)
    .order('expense_date', {ascending:false});
  return data || [];
}
async function renderSancionesPanel(){
  const pagos = await loadSancionesPagos();

  $('#pay-save').addEventListener('click', async ()=>{
    const { error } = await supabase.from('payments').insert({

// Tabla editable de presupuesto: presupuestado (editable) vs. ejecutado (real, calculado).
async function renderBudgetRows(){
  const { data: expenses } = await supabase.from('team_expenses').select('category_id, amount');
  const ejecutadoPorCategoria = {};
  (expenses||[]).forEach(e=>{ ejecutadoPorCategoria[e.category_id] = (ejecutadoPorCategoria[e.category_id]||0) + Number(e.amount); });
  $('#budget-tbody').innerHTML = expenseCategories.map(c=>{
    const ejecutado = ejecutadoPorCategoria[c.id] || 0;
    const diff = Number(c.estimated_amount) - ejecutado;
    return `<tr data-cid="${c.id}">
      <td>${c.name}</td>
      <td><input type="number" class="budget-amount" value="${c.estimated_amount}" style="width:120px"></td>
      <td>${fmtMoney(ejecutado)}</td>
      <td style="color:${diff<0?'var(--danger)':'var(--accent)'}">${fmtMoney(diff)}</td>
      <td>
        <button class="small" onclick="window.__saveBudget('${c.id}', this)">Guardar</button>
        <button class="small danger" onclick="window.__deleteBudgetCategory('${c.id}', '${c.name.replace(/'/g,"\\'")}')">Eliminar</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="muted">Aún no has creado categorías de presupuesto</td></tr>';
}

window.__saveBudget = async (categoryId, btn)=>{
  const tr = btn.closest('tr');
  const estimated_amount = Number(tr.querySelector('.budget-amount').value) || 0;
  const { error } = await supabase.from('expense_categories').update({ estimated_amount }).eq('id', categoryId);
  if(error){ toast(error.message, true); return; }
  toast('Presupuesto actualizado');
  await loadExpenseCategories();
  renderBudgetRows();
  loadFinancialSummaryReadOnly('#fin-summary');
};

window.__deleteBudgetCategory = async (categoryId, categoryName)=>{
  if(!confirm(`¿Eliminar la categoría de presupuesto "${categoryName}"? Esta acción no se puede deshacer.`)) return;
  // expense_categories no tiene "on delete cascade" en team_expenses.category_id, así que
  // si ya hay gastos registrados en esta categoría, avisamos antes de intentar borrar.
  const { count } = await supabase.from('team_expenses').select('id', { count: 'exact', head: true }).eq('category_id', categoryId);
  if(count){ toast(`No se puede eliminar: hay ${count} gasto(s) registrados en "${categoryName}". Elimínalos o cámbialos de categoría primero.`, true); return; }
  const { error } = await supabase.from('expense_categories').delete().eq('id', categoryId);
  if(error){ toast(error.message, true); return; }
  toast('Categoría eliminada');
  await loadExpenseCategories();
  renderBudgetRows();
  loadFinancialSummaryReadOnly('#fin-summary');
};

// Cuota presupuestada vs. pagado por jugador, sumando automáticamente las
// multas por tarjeta amarilla/roja (según fine_settings) a lo que debe.
async function renderPlayerHealthRows(){
  const [{data: dues}, {data: pays}, {data: stats}] = await Promise.all([
    supabase.from('payment_dues').select('player_id, amount_due, due_date'),
    supabase.from('payments').select('player_id, amount'),
    supabase.from('player_match_stats').select('player_id, yellow_cards, red_cards'),
  ]);
  const today = new Date().toISOString().slice(0,10);
  const rows = playersCache.filter(p=>p.active).map(p=>{
    const playerDues = (dues||[]).filter(d=>d.player_id===p.id);
    const cuotas = playerDues.reduce((a,d)=>a+Number(d.amount_due),0);
    const pagado = (pays||[]).filter(x=>x.player_id===p.id).reduce((a,x)=>a+Number(x.amount),0);
    const yellow = (stats||[]).filter(s=>s.player_id===p.id).reduce((a,s)=>a+(s.yellow_cards||0),0);
    const red = (stats||[]).filter(s=>s.player_id===p.id).reduce((a,s)=>a+(s.red_cards||0),0);
    const multas = yellow*Number(fineSettings.yellow_card_fine||0) + red*Number(fineSettings.red_card_fine||0);
    const totalDebe = cuotas + multas;
    const saldo = totalDebe - pagado;
    const hayVencida = playerDues.some(d=>d.due_date && d.due_date < today);
    const estado = saldo <= 0 ? 'Al día' : (hayVencida ? 'Vencido' : 'Pendiente');
    const badgeClass = saldo <= 0 ? 'presente' : (hayVencida ? 'ausente' : 'tarde');
    return { p, cuotas, multas, totalDebe, pagado, saldo, estado, badgeClass, yellow, red };
  });
  $('#player-health-tbody').innerHTML = rows.map(r=>`
    <tr>
      <td>#${r.p.jersey_number}</td>
      <td>${r.p.full_name}</td>
      <td>${fmtMoney(r.cuotas)}</td>
      <td>${fmtMoney(r.multas)}${(r.yellow||r.red) ? ` <span class="muted">(${r.yellow} 🟨${r.red?' '+r.red+' 🟥':''})</span>` : ''}</td>
      <td>${fmtMoney(r.totalDebe)}</td>
      <td>${fmtMoney(r.pagado)}</td>
      <td>${fmtMoney(r.saldo)}</td>
      <td><span class="badge ${r.badgeClass}">${r.estado}</span></td>
    </tr>
  `).join('') || '<tr><td colspan="8" class="muted">Sin jugadores activos</td></tr>';
}

// Solo el usuario maestro puede borrar una cuota (la política "maestro gestiona
// cuotas" en payment_dues ya lo exige también a nivel de base de datos, esto es
// solo la confirmación del lado de la app). Si esa cuota ya tenía pagos
// registrados, esos pagos NO se borran — quedan con due_id en null (ver
// "on delete set null" en schema.sql) para no perder el historial de pagos.
window.__deleteDue = async (dueId, btn)=>{
  if(!confirm('¿Eliminar esta cuota? Los pagos que ya se hayan registrado contra ella no se borran, solo la cuota.')) return;
  btn.disabled = true;
  const { error } = await supabase.from('payment_dues').delete().eq('id', dueId);
  if(error){ btn.disabled = false; toast(error.message, true); return; }
  toast('Cuota eliminada');
  renderPlayerHealthRows();
  loadFinanceDetail();
};

// ---------------- TEMPORADAS (histórico semestral) ----------------
// El torneo corre en semestres. Cada temporada agrupa sus propios entrenamientos, partidos,
// categorías de presupuesto y cuotas (vía season_id), para poder comparar un semestre contra
// otro sin mezclar los datos.
async function seasonStats(seasonId){
  const [{ data: matches }, { data: trainings }, { data: categorias }, { data: dues }] = await Promise.all([
    supabase.from('matches').select('result').eq('season_id', seasonId),
    supabase.from('trainings').select('id').eq('season_id', seasonId),
    supabase.from('expense_categories').select('id, estimated_amount').eq('season_id', seasonId),
    supabase.from('payment_dues').select('player_id, amount_due').eq('season_id', seasonId),
  ]);
  const categoriaIds = (categorias||[]).map(c=>c.id);
  const presupuestado = (categorias||[]).reduce((a,c)=>a+Number(c.estimated_amount||0),0);
  let ejecutado = 0;
  if(categoriaIds.length){
    const { data: expenses } = await supabase.from('team_expenses').select('amount').in('category_id', categoriaIds);
    ejecutado = (expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0);
  }
  const comprometido = (dues||[]).reduce((a,d)=>a+Number(d.amount_due||0),0);
  const duePlayerIds = [...new Set((dues||[]).map(d=>d.player_id))];
  let recaudado = 0;
  if(duePlayerIds.length){
    // Aproximación: pagos de jugadores que tienen al menos una cuota en esta temporada.
    const { data: pays } = await supabase.from('payments').select('amount').in('player_id', duePlayerIds);
    recaudado = (pays||[]).reduce((a,p)=>a+Number(p.amount||0),0);
  }
  const jugados = (matches||[]).filter(m=>m.result && m.result.trim()).length;
  return { partidosProgramados: (matches||[]).length, partidosJugados: jugados, entrenamientos: (trainings||[]).length, presupuestado, ejecutado, comprometido, recaudado };
}

              <td>${s.is_current ? '' : `<button class="small secondary" onclick="window.__setCurrentSeason('${s.id}')">Marcar como actual</button>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="row" style="margin-top:14px">
        <input id="ts-name" placeholder="Nombre (ej. 2027-1 (Torneo 52))" />
        <input id="ts-start" type="date" placeholder="Inicio" />
        <input id="ts-end" type="date" placeholder="Fin" />
        <button id="ts-save">Crear temporada</button>
      </div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px"><input type="checkbox" id="ts-current" checked /> Marcarla como temporada actual al crearla</label>
    </div>
    <div class="panel">
      <h3>Histórico</h3>
      <select id="th-season">${seasons.map(s=>`<option value="${s.id}">${s.name}${s.is_current?' (actual)':''}</option>`).join('')}</select>
      <div id="th-body">Cargando…</div>
    </div>
  `;
  const renderHistorico = async ()=>{
    const seasonId = $('#th-season').value;
    if(!seasonId) return;
    $('#th-body').innerHTML = 'Cargando…';
    const s = await seasonStats(seasonId);
    $('#th-body').innerHTML = `
      <div class="cards" style="margin-top:14px">
        <div class="card"><div class="num">${s.entrenamientos}</div><div class="label">Entrenamientos</div></div>
        <div class="card"><div class="num">${s.partidosJugados} / ${s.partidosProgramados}</div><div class="label">Partidos jugados / programados</div></div>
        <div class="card"><div class="num">${fmtMoney(s.presupuestado)}</div><div class="label">Presupuestado</div></div>
        <div class="card"><div class="num">${fmtMoney(s.ejecutado)}</div><div class="label">Ejecutado (gastos)</div></div>
        <div class="card"><div class="num">${fmtMoney(s.comprometido)}</div><div class="label">Cuotas asignadas</div></div>
        <div class="card"><div class="num">${fmtMoney(s.recaudado)}</div><div class="label">Recaudado (aprox.)</div></div>
      </div>
    `;
  };
  if(seasons.length) await renderHistorico();
  else $('#th-body').innerHTML = '<p class="muted">Aún no hay temporadas.</p>';
  $('#th-season').addEventListener('change', renderHistorico);
  $('#ts-save').addEventListener('click', async ()=>{
    const name = $('#ts-name').value.trim();
    const start_date = $('#ts-start').value || null;
    const end_date = $('#ts-end').value || null;
    if(!name){ toast('El nombre de la temporada es obligatorio', true); return; }
    const makeCurrent = $('#ts-current').checked;
    if(makeCurrent){
      const { error: unsetError } = await supabase.from('seasons').update({ is_current: false }).eq('is_current', true);
      if(unsetError) return toast(unsetError.message, true);
    }
    const { error } = await supabase.from('seasons').insert({ name, start_date, end_date, is_current: makeCurrent });
    if(error) return toast(error.message, true);
    toast('Temporada creada');
    await loadCurrentSeason();
    renderTemporadas();
  });
}

window.__setCurrentSeason = async (seasonId)=>{
  const { error: unsetError } = await supabase.from('seasons').update({ is_current: false }).eq('is_current', true);
  if(unsetError) return toast(unsetError.message, true);
  const { error } = await supabase.from('seasons').update({ is_current: true }).eq('id', seasonId);
  if(error) return toast(error.message, true);
  toast('Temporada actual actualizada');
  await loadCurrentSeason();
  renderTemporadas();
};

// ---------------- PARTIDOS ----------------
function extractYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

async function renderPartidos(){
  // Del más reciente (próximo o recién jugado) al más lejano en el tiempo.
  const { data: matches } = await supabase.from('matches').select('*').order('match_date', {ascending:true});
  main.innerHTML = `
    <h2 class="section-title">Partidos</h2>
    <div id="partidos-list-view">
      ${canManage() ? `
      <div class="panel">
        <h3>Nuevo partido</h3>
        <div class="row">
          <input id="nm-date" type="date" />
          <input id="nm-time" type="time" placeholder="Horario" />
          <input id="nm-opponent" placeholder="Rival" />
          <input id="nm-competition" placeholder="Competencia" />
          <input id="nm-location" placeholder="Lugar" />
          <input id="nm-result" placeholder="Resultado (ej. 3-1)" />
        </div>
        <div class="row">
          <input id="nm-location-url" placeholder="Link de Google Maps o Waze (opcional)" style="flex:1" />
        </div>
        <div class="row">
          <input id="nm-instagram" placeholder="Link de Instagram (post/reel)" />
        </div>
        <div class="row">
          <input id="nm-youtube" placeholder="Link de YouTube - Primer tiempo" />
          <input id="nm-youtube2" placeholder="Link de YouTube - Segundo tiempo" />
        </div>
        <div class="row">
          <select id="nm-uniform">
            <option value="uniforme_1">Uniforme 1 (negro y amarillo)</option>
            <option value="uniforme_2">Uniforme 2 (blanco y azul)</option>
          </select>
        </div>
        <div class="row">
          <button id="nm-search-yt" class="secondary">Buscar en YouTube del canal</button>
          <button id="nm-search-ig" class="secondary">Buscar en Instagram</button>
        </div>
        <div id="nm-suggestions" class="muted"></div>
        <button id="nm-save" style="margin-top:8px">Crear partido</button>
        <p class="muted">Al crear el partido se envía automáticamente la convocatoria a todos los jugadores.</p>
      </div>` : ''}
      <div id="matches-list"></div>
    </div>
    <div id="match-detail"></div>
  `;
  const matchCard = m => `
    <div class="panel match-card" onclick="window.__openMatch('${m.id}')">
      <strong>${fmtDate(m.match_date)}${m.match_time?' · '+m.match_time.slice(0,5):''} vs ${m.opponent}</strong> ${m.result ? '· '+m.result : ''} ${m.competition ? '· '+m.competition : ''}
    </div>
  `;
  // Próximos (el más cercano primero) aparte de los ya jugados (el más reciente primero).
  const today = new Date().toISOString().slice(0,10);
  const proximos = (matches||[]).filter(m=>m.match_date >= today).sort((a,b)=>a.match_date.localeCompare(b.match_date));
  const jugados = (matches||[]).filter(m=>m.match_date < today).sort((a,b)=>b.match_date.localeCompare(a.match_date));
  $('#matches-list').innerHTML = `
    <h3 class="section-title">Próximos partidos</h3>
    ${proximos.map(matchCard).join('') || '<p class="muted">No hay partidos próximos.</p>'}
    <h3 class="section-title" style="margin-top:20px">Partidos jugados</h3>
    ${jugados.map(matchCard).join('') || '<p class="muted">Todavía no se ha jugado ningún partido.</p>'}
  `;

  if(canManage()){
    $('#nm-search-yt').addEventListener('click', searchYouTube);
    $('#nm-search-ig').addEventListener('click', searchInstagram);
    $('#nm-save').addEventListener('click', async ()=>{
      const ytUrl = $('#nm-youtube').value.trim();
      const ytUrl2 = $('#nm-youtube2').value.trim();
      const payload = {
        match_date: $('#nm-date').value,
        match_time: $('#nm-time').value || null,
        opponent: $('#nm-opponent').value.trim(),
        competition: $('#nm-competition').value.trim(),
        location: $('#nm-location').value.trim(),
        location_url: $('#nm-location-url').value.trim() || null,
        result: $('#nm-result').value.trim(),
        instagram_url: $('#nm-instagram').value.trim() || null,
        youtube_url: ytUrl || null,
        youtube_video_id: extractYouTubeId(ytUrl),
        youtube_url_2: ytUrl2 || null,
        season_id: currentSeasonId(),
      };
      if(!payload.match_date || !payload.opponent){ toast('Fecha y rival son obligatorios', true); return; }
      const { data: newMatch, error } = await supabase.from('matches').insert(payload).select().single();
      if(error) return toast(error.message, true);
      // Convocatoria automática: los jugadores la ven de inmediato como notificación,
      // incluyendo el uniforme que les corresponde para este partido.
      const { error: cuError } = await supabase.from('call_ups').insert({
        type: 'partido',
        training_id: null,
        match_id: newMatch.id,
        event_date: newMatch.match_date,
        uniform: $('#nm-uniform').value,
        notes: null,
        created_by: profile.id,
      });
      if(cuError) toast('Partido creado, pero no se pudo lanzar la convocatoria: ' + cuError.message, true);
      else toast('Partido creado y convocatoria enviada a los jugadores');
      renderPartidos();
    });
  }
}

// YouTube Data API v3 — búsqueda de videos del canal del equipo
async function searchYouTube(){
  const box = $('#nm-suggestions');
  box.textContent = 'Buscando en YouTube…';
  try{
    const url = `https://www.googleapis.com/youtube/v3/search?key=${YOUTUBE_API_KEY}&channelId=${YOUTUBE_CHANNEL_ID}&part=snippet&order=date&maxResults=5&type=video`;
    const res = await fetch(url);
    const json = await res.json();
    if(json.error){ box.textContent = 'Error de YouTube API: '+json.error.message; return; }
    box.innerHTML = 'Resultados: ' + (json.items||[]).map(it=>{
      const vid = it.id.videoId;
      const title = it.snippet.title.replace(/'/g,"\\'");
      return `<button class="small secondary" onclick="document.getElementById('nm-youtube').value='https://youtu.be/${vid}'">${it.snippet.title}</button>`;
    }).join(' ') || 'sin resultados';
  }catch(e){ box.textContent = 'No se pudo conectar con YouTube API (revisa YOUTUBE_API_KEY / CHANNEL_ID).'; }
}

// Instagram Graph API — vía Edge Function proxy (evita exponer el token y problemas de CORS)
async function searchInstagram(){
  const box = $('#nm-suggestions');
  box.textContent = 'Buscando en Instagram…';
  try{
    const res = await fetch(INSTAGRAM_PROXY_URL);
    const json = await res.json();
    if(json.error){ box.textContent = 'Error de Instagram API: '+json.error; return; }
    box.innerHTML = 'Resultados: ' + (json.data||[]).slice(0,5).map(it=>{
      return `<button class="small secondary" onclick="document.getElementById('nm-instagram').value='${it.permalink}'">${(it.caption||'Post').slice(0,30)}</button>`;
    }).join(' ') || 'sin resultados';
  }catch(e){ box.textContent = 'No se pudo conectar con el proxy de Instagram (revisa INSTAGRAM_PROXY_URL y la Edge Function).'; }
}

window.__openMatch = async (matchId)=>{

  const { data: stats } = await supabase.from('player_match_stats').select('*, players(full_name, jersey_number)').eq('match_id', matchId);
  const { data: evals } = await supabase.from('evaluations').select('*').eq('match_id', matchId);
  const { data: comments } = await supabase.from('match_comments').select('*, players(full_name, jersey_number)').eq('match_id', matchId).order('created_at');
  const { data: matchCallUp } = await supabase.from('call_ups').select('*').eq('match_id', matchId).maybeSingle();
  const byPlayer = Object.fromEntries((stats||[]).map(s=>[s.player_id, s]));
  const evalByPlayer = Object.fromEntries((evals||[]).map(e=>[e.player_id, e]));
  // Organización en 3 grupos, igual en la tabla de carga del cuerpo técnico que
  // en la vista de solo lectura del jugador: 1) titulares (arrancaron el
  // partido), 2) suplentes que sí jugaron (entraron pero no fueron titulares),
  // 3) jugadores que no participaron (sin minutos registrados). Dentro de cada
  // grupo, ordenados por número de camiseta.
  const matchGroup = (p)=>{
    const s = byPlayer[p.id];
    if(s?.started) return 0;
    if(s && s.minutes_played > 0) return 1;
    return 2;
  };
  const sortedMatchPlayers = playersCache.filter(p=>p.active).slice().sort((a,b)=>{
    const ga = matchGroup(a), gb = matchGroup(b);
    if(ga !== gb) return ga - gb;
    return (a.jersey_number||0) - (b.jersey_number||0);
  });

  // Vista exclusiva: al abrir un partido se oculta la lista completa (y el
  // panel "Nuevo partido") para que solo se vea la información de este
  // partido; el botón "Volver" restaura la lista.

      <div class="embed-wrap">
        ${m.youtube_video_id ? `<iframe width="320" height="180" src="https://www.youtube.com/embed/${m.youtube_video_id}" allowfullscreen></iframe>` : ''}
        ${m.instagram_url ? `<blockquote class="instagram-media" data-instgrm-permalink="${m.instagram_url}" style="width:320px"></blockquote>` : ''}
      </div>
      ${(m.youtube_url || m.youtube_url_2) ? `
      <div class="row" style="margin:8px 0">
        ${m.youtube_url ? `<button class="secondary" onclick="window.open('${m.youtube_url.replace(/'/g,"\\'")}','_blank')">▶ Ver primer tiempo</button>` : ''}
        ${m.youtube_url_2 ? `<button class="secondary" onclick="window.open('${m.youtube_url_2.replace(/'/g,"\\'")}','_blank')">▶ Ver segundo tiempo</button>` : ''}
      </div>` : ''}
      ${(m.photo_url_1 || m.photo_url_2) ? `
      <div class="row" style="margin:8px 0;flex-wrap:wrap">
        ${m.photo_url_1 ? `<a href="${m.photo_url_1}" target="_blank" rel="noopener"><img src="${m.photo_url_1}" alt="Foto del partido" style="max-width:160px;max-height:160px;border-radius:8px;object-fit:cover" /></a>` : ''}
        ${m.photo_url_2 ? `<a href="${m.photo_url_2}" target="_blank" rel="noopener"><img src="${m.photo_url_2}" alt="Foto del partido" style="max-width:160px;max-height:160px;border-radius:8px;object-fit:cover" /></a>` : ''}
      </div>` : ''}

      ${canManage() ? `
      <div class="panel" style="background:var(--panel2)">
        <h4 style="margin-top:0">Editar partido</h4>
        <p class="muted">Ajusta la fecha, el resultado, etc., o elimina el partido si se canceló.</p>
        <div class="row">
          <input type="date" id="em-date" value="${m.match_date}" />
          <input type="time" id="em-time" value="${m.match_time?.slice(0,5)||''}" />
          <input id="em-opponent" placeholder="Rival" value="${m.opponent||''}" />
          <input id="em-competition" placeholder="Competencia" value="${m.competition||''}" />
        </div>
        <div class="row">
          <input id="em-location" placeholder="Lugar" value="${m.location||''}" />

        </div>
        <div class="row">
          <input id="em-location-url" placeholder="Link de Google Maps o Waze (opcional)" value="${m.location_url||''}" style="flex:1" />
        </div>
        <div class="row">
          <input id="em-youtube" placeholder="Link de YouTube - Primer tiempo" value="${m.youtube_url||''}" />
          <input id="em-youtube2" placeholder="Link de YouTube - Segundo tiempo" value="${m.youtube_url_2||''}" />
        </div>
        <div class="row">
          <div>
            <label class="muted" style="display:block;font-size:12px">Foto 1</label>
            <input type="file" id="em-photo1" accept="image/*" />
            <div style="margin-top:4px">
              <button class="small secondary" onclick="window.__uploadMatchPhoto('${matchId}',1)">Subir foto 1</button>
              ${m.photo_url_1 ? `<button class="small danger" onclick="window.__removeMatchPhoto('${matchId}',1)">Quitar</button>` : ''}
            </div>
          </div>

            <label class="muted" style="display:block;font-size:12px">Foto 2</label>

              ${m.photo_url_2 ? `<button class="small danger" onclick="window.__removeMatchPhoto('${matchId}',2)">Quitar</button>` : ''}
            </div>
          </div>
        </div>

          <select id="em-uniform">
            <option value="uniforme_1" ${(!matchCallUp?.uniform || matchCallUp.uniform==='uniforme_1')?'selected':''}>Uniforme 1 (negro y amarillo)</option>

      <h4>Minutos, estadísticas y calificación</h4>
      ${canManage() ? `
      <p class="muted">Registra minutos, goles, tarjetas y la calificación (1-5) de cada jugador que participó. Todo se guarda junto con el botón "Guardar". Máximo 11 titulares por partido. Los titulares aparecen primero.</p>
      <table><thead><tr><th>#</th><th>Jugador</th><th>Titular</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th><th>Téc.</th><th>Fís.</th><th>Tác.</th><th>Men.</th><th></th></tr></thead>
      <tbody>
        ${sortedMatchPlayers.map(p=>{
          const s = byPlayer[p.id] || {};
          const e = evalByPlayer[p.id] || {};
          return `<tr data-pid="${p.id}" data-match-date="${m.match_date}">
            <td>#${p.jersey_number}</td><td>${p.full_name}</td>
            <td><input type="checkbox" class="f-started" ${s.started?'checked':''}></td>

            <td><input type="number" min="1" max="5" class="f-technique rating-input" value="${e.technique||''}" placeholder="-" /></td>
            <td><input type="number" min="1" max="5" class="f-physical rating-input" value="${e.physical||''}" placeholder="-" /></td>
            <td><input type="number" min="1" max="5" class="f-tactical rating-input" value="${e.tactical||''}" placeholder="-" /></td>
            <td><input type="number" min="1" max="5" class="f-mental rating-input" value="${e.mental||''}" placeholder="-" /></td>

          </tr>`;
        }).join('')}
      </tbody></table>` : `
      <p class="muted">Estadísticas y calificación de todos los jugadores del equipo en este partido: titulares primero, luego suplentes que jugaron, y al final quienes no participaron.</p>
      <table><thead><tr><th>#</th><th>Jugador</th><th>Estado</th><th>Min.</th><th>Goles</th><th>Asist.</th><th>TA</th><th>TR</th><th>Téc.</th><th>Fís.</th><th>Tác.</th><th>Men.</th><th>Calificación</th></tr></thead>
      <tbody>${sortedMatchPlayers.map(p=>{
        const s = byPlayer[p.id] || {};
        const e = evalByPlayer[p.id] || {};
        const hasEval = e.technique || e.physical || e.tactical || e.mental;
        const avg = hasEval ? (((e.technique||0)+(e.physical||0)+(e.tactical||0)+(e.mental||0))/4) : null;
        const estado = s.started ? 'Titular' : (s.minutes_played > 0 ? 'Suplente' : 'No participó');

      }).join('')||'<tr><td colspan="13" class="muted">Sin jugadores activos</td></tr>'}</tbody></table>
      `}

      <h4>Comentarios del partido</h4>
      <div id="comments-list">${(comments||[]).map(c=>`
        <div class="comment"><div class="meta">#${c.players.jersey_number} ${c.players.full_name} · ${new Date(c.created_at).toLocaleString('es-ES')}</div>${c.comment_text}</div>
      `).join('') || '<p class="muted">Sin comentarios aún.</p>'}</div>
      ${profile.player_id ? `
        <textarea id="new-comment" placeholder="Escribe tu comentario sobre el partido…"></textarea>
        <button id="save-comment">Comentar</button>
      ` : ''}
    </div>
  `;

  // load instagram embed script (official, público)
  if(m.instagram_url && !window.instgrm){
    const s = document.createElement('script'); s.src = 'https://www.instagram.com/embed.js'; s.async = true;
    document.body.appendChild(s);
  } else if(window.instgrm){ window.instgrm.Embeds.process(); }

  // Máximo 11 titulares a la vez: si ya hay 11 marcados, desmarca el que se acaba de
  // intentar marcar y avisa. Es una validación en pantalla; cada fila igual se guarda
  // por separado con su botón "Guardar".
  if(canManage()){
    $$('.f-started').forEach(cb=> cb.addEventListener('change', ()=>{
      if(cb.checked && $$('.f-started:checked').length > 11){
        cb.checked = false;
        toast('Ya hay 11 titulares seleccionados (el máximo permitido)', true);

  if(profile.player_id){
    $('#save-comment').addEventListener('click', async ()=>{
      const text = $('#new-comment').value.trim();

      const { error } = await supabase.from('match_comments').insert({ match_id: matchId, player_id: profile.player_id, comment_text: text });
      if(error) return toast(error.message, true);
      window.__openMatch(matchId);
    });
  }
};

  if(!match_date || !opponent){ toast('Fecha y rival son obligatorios', true); return; }
  const ytUrl = $('#em-youtube').value.trim();
  const ytUrl2 = $('#em-youtube2').value.trim();
  const payload = {
    match_date,
    match_time: $('#em-time').value || null,
    opponent,
    competition: $('#em-competition').value.trim(),
    location: $('#em-location').value.trim(),
    location_url: $('#em-location-url').value.trim() || null,
    result: $('#em-result').value.trim(),
    youtube_url: ytUrl || null,
    youtube_video_id: extractYouTubeId(ytUrl),
    youtube_url_2: ytUrl2 || null,
  };
  const { error } = await supabase.from('matches').update(payload).eq('id', matchId);
  if(error){ toast(error.message, true); return; }
  // Mantiene sincronizada la fecha y el uniforme de la convocatoria asociada.
  const uniform = $('#em-uniform').value;
  await supabase.from('call_ups').update({ event_date: match_date, uniform }).eq('match_id', matchId);
  // Se queda en el detalle del partido (ya actualizado) en vez de volver a la
  // lista; la lista se refresca sola la próxima vez que se use "Volver".
  toast('Partido actualizado'); window.__openMatch(matchId);
};

window.__uploadMatchPhoto = async (matchId, slot)=>{
  const input = document.getElementById('em-photo' + slot);
  const file = input.files[0];
  if(!file){ toast('Selecciona una imagen primero', true); return; }
  if(!file.type.startsWith('image/')){ toast('El archivo debe ser una imagen', true); return; }
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${matchId}/foto${slot}-${Date.now()}.${ext}`;
  const { error: upErr } = await supabase.storage.from('match-photos').upload(path, file, { upsert: true });
  if(upErr){ toast(upErr.message, true); return; }
  const { data: pub } = supabase.storage.from('match-photos').getPublicUrl(path);
  const field = slot === 1 ? 'photo_url_1' : 'photo_url_2';
  const { error } = await supabase.from('matches').update({ [field]: pub.publicUrl }).eq('id', matchId);
  if(error){ toast(error.message, true); return; }
  toast('Foto subida'); window.__openMatch(matchId);
};

window.__removeMatchPhoto = async (matchId, slot)=>{
  if(!confirm('¿Quitar esta foto del partido?')) return;
  const field = slot === 1 ? 'photo_url_1' : 'photo_url_2';
  const { error } = await supabase.from('matches').update({ [field]: null }).eq('id', matchId);
  if(error){ toast(error.message, true); return; }
  toast('Foto eliminada'); window.__openMatch(matchId);
};

window.__deleteMatch = async (matchId)=>{
  if(!confirm('¿Eliminar este partido? Se borrarán también las estadísticas, la convocatoria y los comentarios asociados. Esta acción no se puede deshacer.')) return;
  // El schema tiene "on delete cascade" en player_match_stats/match_comments/call_ups/call_up_responses
  // y "on delete set null" en evaluations.match_id, así que un solo delete basta.
  const { error } = await supabase.from('matches').delete().eq('id', matchId);
  if(error){ toast(error.message, true); return; }
  toast('Partido eliminado'); $('#match-detail').innerHTML = ''; renderPartidos();
};

window.__saveMatchStat = async (matchId, playerId, btn)=>{
  const tr = btn.closest('tr');
  const startedNow = tr.querySelector('.f-started').checked;
  if(startedNow){
    const { count: otherStarters } = await supabase.from('player_match_stats')
      .select('id', { count: 'exact', head: true })
      .eq('match_id', matchId).eq('started', true).neq('player_id', playerId);
    if((otherStarters||0) >= 11){
      tr.querySelector('.f-started').checked = false;
      toast('Ya hay 11 titulares guardados en este partido (el máximo permitido)', true);
      return;
    }
  }
  const statsPayload = {
    match_id: matchId, player_id: playerId,
    started: startedNow,
    minutes_played: Number(tr.querySelector('.f-minutes').value)||0,
    goals: Number(tr.querySelector('.f-goals').value)||0,
    assists: Number(tr.querySelector('.f-assists').value)||0,
    yellow_cards: Number(tr.querySelector('.f-yellow').value)||0,
    red_cards: Number(tr.querySelector('.f-red').value)||0,
  };
  const { error: statsError } = await supabase.from('player_match_stats').upsert(statsPayload, { onConflict: 'match_id,player_id' });
  if(statsError) return toast(statsError.message, true);

  const technique = tr.querySelector('.f-technique').value;
  const physical = tr.querySelector('.f-physical').value;
  const tactical = tr.querySelector('.f-tactical').value;
  const mental = tr.querySelector('.f-mental').value;
  if(technique || physical || tactical || mental){
    const evalPayload = {
      match_id: matchId, player_id: playerId,
      eval_date: tr.dataset.matchDate,
      evaluator_id: profile.id,
      technique: Number(technique)||null,
      physical: Number(physical)||null,
      tactical: Number(tactical)||null,
      mental: Number(mental)||null,
    };
    const { error: evalError } = await supabase.from('evaluations').upsert(evalPayload, { onConflict: 'player_id,match_id' });
    if(evalError) return toast(evalError.message, true);
  }
  toast('Estadísticas y calificación guardadas');
};
